"בעליל","m":"באופן מובהק, ללא ספק.","e":"ראיתי זאת בעליל, ולא בחלום."},{"u":7,"n":17,"t":"בעלמא","m":"סתם, בלי כוונה מיוחדת.","e":"אמרנו זאת בעלמא ולא בכוונה להעליב."},{"u":7,"n":18,"t":"גמלוני","m":"מגודל, מגושם, מסורבל, חסר קואורדינציה.","e":"גמלוניותו היא הסיבה להתנפצות כל הכלים השבירים בבית."},{"u":7,"n":19,"t":"גמר עליו את ההלל","m":"שיבח ופיאר אדם אחר בצורה מרובה וגדולה.","e":"בשיחתי עם מורתו של בני היא גמרה עליו את ההלל."},{"u":7,"n":20,"t":"גץ","m":"ניצוץ, חתיכה זעירה של חומר בוער הניתזת מתוך מדורה.","e":"הגצים שפגעו בחולצתה הותירו בה חורים."},{"u":7,"n":21,"t":"דלף","m":"נזילה, טפטוף.","e":"יש דלף מהגג וזאת הסיבה לרטיבות."},{"u":7,"n":22,"t":"דמגוג","m":"אדם בעל יכולת דיבור או כתיבה המסוגל לשלהב את ההמונים ולהשפיע באמצעות שקרים, הטעיות ופנייה לרגש.","e":"ראש הממשלה הוא דמגוג גדול ובזכות דרכי השכנוע שלו נבחר שוב."},{"u":7,"n":23,"t":"דמו בראשו","m":"הוא אחראי על מעשיו ועליו לשאת בתוצאות.","e":"מי שייכנס לאזורים אסורים מסתכן ודמו בראשו."},{"u":7,"n":24,"t":"הסתודדות","m":"שיח בסוד, התלחשות.","e":"הזוג הסתודד על מנת שענייניהם יישארו בניהם."},{"u":7,"n":25,"t":"הסתייגות","m":"אי הסכמה.","e":"הסתייגותם של חברי הכנסת מאישור החוק החדש הכעיסה אותי."},{"u":7,"n":26,"t":"העלה חרס בידו","m":"נכשל, לא הצליח.","e":"המשטרה חפשה את הפושע במשך שבוע ולבסוף העלתה חרס בידיה."},{"u":7,"n":27,"t":"העלה על נס","m":"ציין לשבח, החמיא, שיבח.","e":"המורה העלה על נס את התלמיד החרוץ ביותר בכיתה."},{"u":7,"n":28,"t":"הפיל את חתתו","m":"הטיל אימה, השרה פחד.","e":"צבא המדינה הפיל את חתתו על כל המדינות השכנות."},{"u":7,"n":29,"t":"השתוממות","m":"התפלאות, תמיהה.","e":"כולנו השתוממנו כשראינו את שמי הלילה מלאים במטר מטאורים מרהיב."},{"u":7,"n":30,"t":"התבוללות","m":"התערבות באחרים וקבלת מנהגיהם, היטמעות.","e":"בישראל התבוללות היא כאשר יהודי נישא ללא יהודי."},{"u":7,"n":31,"t":"זלולת","m":"מזון שאיכותו נמוכה, ג'אנק פוד.","e":"אכילה מרובה של זלולת אינה בריאה בעליל."},{"u":7,"n":32,"t":"חמש","m":"בן הנין.","e":"לסבתי שבעה חמשים."},{"u":7,"n":33,"t":"חפת","m":"חלק השרוול המקיף את פרק היד, קיפול קצה בגד בשרוול או במכנסיים.","e":"הילד קיפל את חפתי חולצתו לבל יתלכלכו."},{"u":7,"n":34,"t":"חרב פיפיות","m":"(1) חרב שהלהב שלה מושחז משני צדדיו. (2) משל לדבר שנועד להועיל אבל יש בו גם להזיק.","e":"נטילת אנטיביוטיקה היא חרב פיפיות, הורגת את החיידקים הרעים וגם את הטובים המועילים למערכת החיסון."},{"u":7,"n":35,"t":"חרול","m":"צמח קוצני, קוץ.","e":"שדה חרולים מאחורי ביתי."},{"u":7,"n":36,"t":"טלאי","m":"חתיכת בד או ער התפורה על קרע כדי לתקנו.","e":"בזמן מלחמת העולם השנייה,היהודים נדרשו לתפור לבגדיהם טלאי צהוב."},{"u":7,"n":37,"t":"טלית שכלה תכלת","m":"טהור לחלוטין, ללא פגם, מושלם.","e":"הוא רק נראה טלית שכלו תכלת אבל הוא תככן גדול."},{"u":7,"n":38,"t":"יצול","m":"מוט בקצה עגלה שרותמים אליו את הבהמה.","e":"גיורא קשר את הסוס ליצול העגלה."},{"u":7,"n":39,"t":"יקב","m":"מקום בו מכינים את היין מענבים.","e":"הסיור ביקב ארך כ- 3 שעות שבסופן טעמנו יינות."},{"u":7,"n":40,"t":"יקר המציאות","m":"נדיר ביותר.","e":"זן זה של ורדים הינו יקר המציאות."},{"u":7,"n":41,"t":"כמו כוסות רוח למת","m":"לא מועיל, חסר תועלת לגמרי.","e":"טיפול רפואי זה הינו כמו כוסות רוח למת ולכן החולה אינו מתרפא."},{"u":7,"n":42,"t":"כמטחוי קשת","m":"מרחק קצר.","e":"חיילי ישראל נמצאים כמטחוי קשת מהגבול הצפוני."},{"u":7,"n":43,"t":"כמש","m":"נובל, מצטמק.","e":"הצמחייה בגן כמשה בקיץ."},{"u":7,"n":44,"t":"כן","m":"(1) בסיס, יסוד. (2) בסיס שניתן להניח או להציג עליו דברים, מעמד.","e":"בחנות הספרים, רבי המכר מוצגים על כנים."},{"u":7,"n":45,"t":"לית","m":"אין.","e":"לא היו בוחרים בדרך זו אלא בלית ברירה."},{"u":7,"n":46,"t":"ללא כחל ושרק","m":"גלוי וברור, ללא העלמת מידע.","e":"הנחקר מסר את המידע לחוקר ללא כחל ושרק ולכן שוחרר."},{"u":7,"n":47,"t":"מפיח","m":"מכוסה פיח.","e":"קירות הבית פויחו בשריפה."},{"u":7,"n":48,"t":"מפכה","m":"נובע, פורץ(מעיין), מביע, זורם.","e":"עצבות מפכה בפניה."},{"u":7,"n":49,"t":"מפלה","m":"בודק ומוציא כינים מתוך שיער או בגדים.","e":"אבי מפלה את ראשי."},{"u":7,"n":50,"t":"מפרכס","m":"מאופר, מגונדר, מקושט.","e":"פני הליצנים פרכסו לקראת ההצגה."},{"u":7,"n":51,"t":"מצביא","m":"מפקד עליון של צבא, שר צבא.","e":"המצביא קבע אסטרטגיה לקרב ולפי כך פעל הצבא."},{"u":7,"n":52,"t":"מצחף","m":"חיבור הכתוב בכתב יד בעל חשיבות רבה ומכורך בצורת ספר, קודקס.","e":"מצחף נפוליאון הוא מצחף של המשפט האזרחי שנתב בידי הקיסר נפוליאון."},{"u":7,"n":53,"t":"מצטווה","m":"נדרש לבצע פקודה, מוטלת עליו מצווה.","e":"משה הצטווה לירות בנשקו החדש לשם איפוסו."},{"u":7,"n":54,"t":"מצלה","m":"אירוע חברתי שבמרכזו צלייה ואכילה בדרך כלל של בשר, על האש.","e":"בחול המועד סוכות ערכנו מצלה בביתו של יוסי."},{"u":7,"n":55,"t":"מצמית","m":"מביס, מכניע, משמיד.","e":"\"ובחסדך תצמית איבי\" (תהילים, קמג', יב')."},{"u":7,"n":56,"t":"מצנם","m":"מכשיר לקליית לחם, טוסטר.","e":"המצנם התקלקל ולכן הכנסתי את פרוסות הלחם לקלייה בתנור."},{"u":7,"n":57,"t":"מצעצע","m":"מקושט יותר מידיי, מגונדר.","e":"הבגד הזה מצעצע מידיי ולכן לא אלבש אותו."},{"u":7,"n":58,"t":"מצר","m":"רצועה צרה של יבשה בין שני ימים או של ים בין שתי יבשות.","e":"מצר גיברלטר מפריד בין אירופה לאפריקה ומקשר בין הים התיכון לאוקיינוס האטלנטי."},{"u":7,"n":59,"t":"מק","m":"ריקבון.","e":"בטיול בפרדס, ריח מק פירות ההדר היה מצחין."},{"u":7,"n":60,"t":"מקאמה","m":"סיפור בחרוזים שיש בו הרפתקאות ובדרך כלל הומור רב או סאטירה שנונה.","e":"הספר החדש הוא אוסף של מקאמות ובזכות ההומור השנון בו נבחר לרב מכר."},{"u":7,"n":61,"t":"מקדמת דנא","m":"מאז ומעולם, מלפני זמן רב.","e":"מנהג זה מוכר מקדמת דנא."},{"u":7,"n":62,"t":"נימה","m":"(1) משמעות לוואי, משמעות מרומזת, טון, צליל. (2) חוט דק. (3) שערה. (4) מיתר של כלי נגינה.","e":"לאחר נצחונו, נאם הספורטאי והיה ניתן לשמוע נימה של זלזול בקולו."},{"u":7,"n":63,"t":"נכלולי","m":"נוכל, ערמומי, מפוקפק.","e":"השועל מתואר בספרות כחיה נכלולית."},{"u":7,"n":64,"t":"נכנס בעבי הקורה","m":"נעשה שותף חשוב לעניין, חדר לעניין לכל עומקו.","e":"הוא הביע את דעתו בסוגיה רק לאחר שנכנס בעבי הקורה."},{"u":7,"n":65,"t":"סיעוד","m":"מתן עזרה למי שזקוק לה, הסיעוד בהקשר הרפואי מתייחס למקצוע האחים והאחיות ומתן עזרה רפואית.","e":"האח סעד את החולה במסירות רבה."},{"u":7,"n":66,"t":"סך","m":"קהל רב, המון.","e":"כדי לעבור את הסך היו צריכים השוטרים להתערב."},{"u":7,"n":67,"t":"סכוף","m":"מדוכא, מעונה.","e":"הילדה הייתה סכופה עקב מעבר הדירה."},{"u":7,"n":68,"t":"עמיר","m":"צרור שיבולים.","e":"בידו של החקלאי עמיר שהביא לביתו מהשדה."},{"u":7,"n":69,"t":"עמק הבכא","m":"מקום של סבל וצרות, גלות.","e":"אלפיים שנה היו היהודים בעמק הבכא."},{"u":7,"n":70,"t":"ענבל","m":"(1) לשון הפעמון המתנדנדת בתוך הפעמון ומפיקה צלילים בעזרת דפנותיו. (2) לשון בשר קטנה שבפתח הלוע.","e":"כיום לא כל הפעמונים בעלי ענבל ומופעלים על ידי הקשה ידנית."},{"u":7,"n":71,"t":"ענוה","m":"צניעות, חוסר גאווה.","e":"\"יראת ה', מוסר, חכמה, ולפני כבוד – ענוה\" (משלי, טו', לג')"},{"u":7,"n":72,"t":"פלסתר","m":"זיוף, הונאה, רמאות.","e":"איש המכירות אמר דברי פלסתר כדי לשכנע את הלקוחות לקנות את המוצר."},{"u":7,"n":73,"t":"פלצות","m":"פחד גדול, זעזוע.","e":"למשמע קולות הנפץ חשתי פלצות והסתגרתי בחדרי."},{"u":7,"n":74,"t":"פמית","m":"פייה.","e":"האדים יצאו דרך פמית הקומקום."},{"u":7,"n":75,"t":"פמליה","m":"חבורת בני לויה.","e":"הנשיא הגיע לביקור עם כל פמליתו."},{"u":7,"n":76,"t":"פנכה","m":"כלי שטוח להגשת מזון, צלחת, קערה.","e":"הגשתי פנכת פירות לאורחים."},{"u":7,"n":77,"t":"פסה","m":"חתיכה(של נייר, בד וכו').","e":"התופרת תפרה פסת בד על המכנסיים הקרועים."},{"u":7,"n":78,"t":"צלמות","m":"חושך, אימה, שם נרדף לגיהינום.","e":"\"גם כי אלך בגיא צלמות לא אירא רע כי אתה עמדי\" (תהילים, כג', ד')."},{"u":7,"n":79,"t":"צנה","m":"(1) קור חזק, קרה. (2) מגן למלחמה.","e":"צנת הבקר בחורף מקשה על הקימה מן המיטה."},{"u":7,"n":80,"t":"קמל","m":"נבל, איבד את רעננותו.","e":"הצמח קמל לאחר שבוע של חמסין."},{"u":7,"n":81,"t":"קנה לו שביתה","m":"התיישב, השתקע, התנחל, נאחז בקרקע, התבסס במקום באופן קבוע.","e":"חתול הרחוב קנה לו שביתה במפתן ביתנו ונראה שאין בכוונתו לעזוב."},{"u":7,"n":82,"t":"קנוקנת","m":"ענף דק ומסתלסל בצמחים מטפסים המשמש להם מעין משענת.","e":"ללא הקנוקנות שבצמח הגפן, לא יוכל הצמח לטפס."},{"u":7,"n":83,"t":"קנטור","m":"הרגזה על ידי השמעת דברי עקיצה, השמצה והקנטה.","e":"לאחר הפסד בבחירות החל המתמודד לקנטר ולרגוז."},{"u":7,"n":84,"t":"קנין","m":"רכוש, דבר שיש לאדם זכות בעלות עליו. נכס תרבותי, רוחני.","e":"קנינו של העם היהודי בספריו."},{"u":7,"n":85,"t":"קעור","m":"שקוע, עשוי כמו קערה או כיפה הפוכה.","e":"חלקו הקדמי של הפסל החדש שהוצב בעיר קעור כלפי מעלה."},{"u":7,"n":86,"t":"ריחן","m":"בזיליקום.","e":"הריחן מוסיף טעם מיוחד לרוטב."},{"u":7,"n":87,"t":"רימה","m":"זחלי חרקים חסרי רגליים היכולים לגרום ריקבון.","e":"כיום רימות משמשות לטיפול רפואי לעור שאינו נרפא."},{"u":7,"n":88,"t":"ריק","m":"היעדר כל, ריקנות.","e":"בעבר טענו שהחלל החיצון הוא ריק אך כיום הפריכו טענה זו."},{"u":7,"n":89,"t":"רצוד","m":"תנועות קפצניות, ריטוט של קרן אור.","e":"התמונה ריצדה על מסך הטלוויזיה ולכן בעל הבית קנה טלוויזיה חדשה."},{"u":7,"n":90,"t":"שם לאל","m":"ביטל, הכשיל, קלקל.","e":"הפסקות החשמל התכופות שמו לאל את האפשרות להקרין סרט במועדון"},{"u":7,"n":91,"t":"שם נפשו בכפו","m":"סיכן את חייו.","e":"\"ואראה כי אינך מושיע ואשימה נפשי בכפי\" (שופטים, יב', ג')."},{"u":7,"n":92,"t":"שם פעמיו","m":"יצא לדרך, הלך לכיוון.","e":"המטייל שם פעמיו צפונה."},{"u":7,"n":93,"t":"שמאי","m":"שמקצועו להעריך ולקבוע שווים של דברים.","e":"כדי לאמוד את שווי הרכב התייעצנו עם שמאי."},{"u":7,"n":94,"t":"שני","m":"צבע אדום בעיקר של בד.","e":"חולצתי החדשה צבועה בשני."},{"u":7,"n":95,"t":"שניוני","m":"משני, ממדרגה שניה.","e":"נושא זה הוא נושא שניוני ויש כרגע לדון בנושאים חשובים יותר."},{"u":7,"n":96,"t":"שעל","m":"צעד, פסיעה.","e":"הסטודנט עשה עוד שעל אל עבר התואר הנחשק."},{"u":7,"n":97,"t":"שפול","m":"החלק התחתון, תחתית.","e":"שפולי שמלתה עשויים מבד סאטן."},{"u":7,"n":98,"t":"שפוף","m":"(1) כפוף. (2) מדוכא.","e":"הגיבן היה שפוף משנולד."},{"u":7,"n":99,"t":"תנודה","m":"תנועה לכאן ולכאן, נדנוד.","e":"התנודות במצב רוחו מוזרות."},{"u":7,"n":100,"t":"תפוגה","m":"גמר, תוקף.","e":"מועד תפוגתה של הגבינה יחל מחר."},{"u":8,"n":1,"t":"אסקפה","m":"מפתן, סף הדלת, כניסה.","e":"דני גבוהה מאוד וקיבל מכה מהאסקפה כשנכנס הביתה."},{"u":8,"n":2,"t":"אסתטי","m":"יפה – בעיקר לעין.","e":"החדר במסודר בצורה אסתטית."},{"u":8,"n":3,"t":"אפו הארוך של הגיבן","m":"פגם שולי שמתגמד ביחס לבעיה (הגיבנת).","e":"לדעת אורי חזותו של בית הספר היא בחזקת אפו הארוך של הגיבן והבעיה האמיתית היא ריבוי התלמידים בכיתות."},{"u":8,"n":4,"t":"אפוא","m":"אם כן, ובכן, בכל אופן.","e":"\"עשה זאת אפוא בני, והנצל\" (משלי, ו', ג'.)"},{"u":8,"n":5,"t":"אפוף","m":"עטוף, מוקף.","e":"פשע זה אפוף מסתורין ולא פוענח כבר שנים."},{"u":8,"n":6,"t":"אפיזודה","m":"מקרה בודד ולא חשוב במיוחד.","e":"אפיזודה חולפת היא מאורע או מקרה שהיה בעל חשיבות בתקופה מסוימת אך השפעתו לא הורגשה לאחר מכן."},{"u":8,"n":7,"t":"אפליה","m":"(1) הבדל מתוך דעה קדומה. (2) קיפוח, העדפה על פני אחר.","e":"הורים צריכים להעניק תשומת לב שווה לכולם ללא אפליה בין ילד לילד."},{"u":8,"n":8,"t":"אפסר","m":"חבל שקושרים בצוואר הבהמה לנהוג בה, מושכות.","e":"יש היודעים לרכב על סוס ולשלוט בו ללא אפסר."},{"u":8,"n":9,"t":"אפקט","m":"(1) תוצאה, תגובה. (2) פעולה מבוימת במופע שמדמה התרחשות אמיתית.","e":"לשתיית כוס קפה יש אפקט מעורר."},{"u":8,"n":10,"t":"אפרכסת","m":"(1) חלק האוזנית בשפופרת הטלפון שאדם מקרב לאוזנו. (2) החלק החיצוני של האוזן.","e":"בסיום השיחה, החזרתי את אפרכסת הטלפון למקומה."},{"u":8,"n":11,"t":"אצבעון","m":"כיסוי מתכת על האצבע להגנה מדקירות המחט בשעת תפירה.","e":"אמי משתמשת באצבעון כדי להגן על אצבעה מהמחט החדה."},{"u":8,"n":12,"t":"בעתה","m":"פחד גדול, בהלה.","e":"הפצוע היה אחוז בעתה."},{"u":8,"n":13,"t":"בצור","m":"(1) מבנים, שוחות או חפירות להגנה מפני אויב. (2) מבצר, מצודה.","e":"החיילים הסתתרו בתוך הבצורים מפני אש האויב."},{"u":8,"n":14,"t":"בר דעת","m":"אדם בעל שכל, בעל הבנה, בעל אחריות.","e":"חייל זה הינו בר דעת ולכן מומלץ לשלחו לקורס קצינים."},{"u":8,"n":15,"t":"בר מנן","m":"מת.","e":"סבי בר מנן לפני זמן רב."},{"u":8,"n":16,"t":"בר פלגתא","m":"אדם או צד שיש אתו מחלקות.","e":"לאחרונה הפכה טורקיה לבת פלגתא חריפה למדינת ישראל."},{"u":8,"n":17,"t":"בר קיימא","m":"בתוקף, שיש לו קיום.","e":"החוזה הוא בר קיימא."},{"u":8,"n":18,"t":"גרדום","m":"במת הוצאה להורג.","e":"נגזר עליו עונש מוות והוא הועלה לגרדום."},{"u":8,"n":19,"t":"גרום","m":"בעל עצמות בולטות בשל רזון.","e":"אדם זה הינו גרום בשל היותו אנורקסי."},{"u":8,"n":20,"t":"גרידא","m":"בלבד.","e":"אין זה אלא צירוף מקרים גרידא."},{"u":8,"n":21,"t":"דנדון","m":"צליל הפעמון, צלצול בפעמון.","e":"דנדון פעמוני הכנסייה נשמע ברחבי העיר."},{"u":8,"n":22,"t":"דר רחוב","m":"אדם חסר בית הישן במקומות ציבוריים ולרוב נמצא בהזנחה נפשית ופיזית, הומלס.","e":"ראש העיר הבטיח למצוא פתרון לדרי הרחוב בעיר."},{"u":8,"n":23,"t":"דרדק","m":"(1) ילד קטן. (2) לא מנוסה, טירון.","e":"אחיי דרדקים ולכן יש להשגיח עליהם בתשומת לב רבה."},{"u":8,"n":24,"t":"דריכות","m":"מצב של מתיחות או כוננות.","e":"דני דרך את נשקו על מנת להיות מוכן לקרב."},{"u":8,"n":25,"t":"הפיס את דעתו","m":"פייס אותו, הרגיע אותו.","e":"השוטר הפיס את דעתו של הפושע מלבצע את הפשע."},{"u":8,"n":26,"t":"הפליא מכותיו","m":"הרביץ באלימות וללא רחמים.","e":"הבריון הפליא מכותיו בילדים הקטנים על לא עוול בכפם."},{"u":8,"n":27,"t":"הפליג בשבח","m":"הלל, פיאר, שיבח במידה רבה.","e":"שר המשפטים הפליג בשבחים על לשכת עורכי הדין בארץ."},{"u":8,"n":28,"t":"הפרזה","m":"הגזמה, תיאור דבר בצורה גדולה יותר ממה שהוא באמת.","e":"האדון הפריז ביכולותיו על מנת להרשים את הגברת."},{"u":8,"n":29,"t":"הפרכה","m":"ביטול דעה בגלל פגם הגיוני, סתירת טענה.","e":"עורך הדין התובע הפריך את טענתו של הנאשם ולכן הורשע."},{"u":8,"n":30,"t":"השבחה","m":"1. הטבה, שכלול, שיפור. 2. זיווג מבוקר של בעלי חיים או של צמחים לשם יצירת צאצאים משופרים.","e":"השבחת זני התפוח זכתה להצלחה רבה בעולם עד כדי הזנחה של זנים קודמים."},{"u":8,"n":31,"t":"השליך את יהבו על","m":"הסתמך על, תלה את בטחונות ב..","e":"\"השלך על ה' יהבך והוא יכלכלך\" (תהילים, נה'. כג')."},{"u":8,"n":32,"t":"התגוששות","m":"היאבקות, התכתשות","e":"התגוששות הספורטאים מקומה בזירה."},{"u":8,"n":33,"t":"זמורה","m":"ענף של גפן.","e":"\"ויכרתו משם זמורה ואשכול ענבים אחד\" (במדבר יג', כג')"},{"u":8,"n":34,"t":"חרון","m":"כעס גדול.","e":"\"וישמע זבל שר העיר את דברי געל בן עבד ויחר אפו\". (שופטים, ט', ל')"},{"u":8,"n":35,"t":"חרטום","m":"1. החלק הקדמי המחודד של הנעל, של כלי או של ספינה. 2. החלק הקדמי המוארך של ראש של בעלי חיים שונים.","e":"בהתרסקות המטוס נפגע רק החרטום ולכן המנוע לא נפגע."},{"u":8,"n":36,"t":"חריצת לשון","m":"1. דברי תוכחה וביקורת, דברי נאצה. 2. גידוף, חירוף, נזיפה. 3. הלשנה.","e":"בעקבות חריצות לשונות כלפי עובדים, הודח המנהל מתפקידו."},{"u":8,"n":37,"t":"חריש","m":"1. עונה החרישה. 2. פעולת החרישה. 3. השדה אותו צריך לחרוש.","e":"\"וביום השביעי תשבת בחריש ובקציר\" (שמות, לד', כא')."},{"u":8,"n":38,"t":"טלף","m":"פרסה, רגל הבהמה והחיה.","e":"\"כל שיש לו קרנים, יש לו טלפים.ויש שיש לו טלפים ואין לו קרנים\" (משנה)."},{"u":8,"n":39,"t":"טמן ראש בחול","m":"התעלם מהמציאות באופן מכוון, השלה את עצמו שאין סכנה.","e":"ההתפתחויות באזור הדרום היו צפויות לכל מי שלא טמן ראש בחול."},{"u":8,"n":40,"t":"ירדה קרנו","m":"זכה לפחות הערכה, מעמדו התערער.","e":"ירדה קרנו של עורך הדין הזה לאחר פרשת השחיתות שלקח בה חלק."},{"u":8,"n":41,"t":"יש בלבו","m":"שומר טינה, כועס, יש לו מטען רגשי כבד על אחר.","e":"שירה ושמואל השלימו לאחר שנים של סכסוך, אך עדיין יש בלבו של שמואל."},{"u":8,"n":42,"t":"יש לאל ידו","m":"בכוחו, ביכולתו.","e":"\"יש לאל ידי לעשות עמכם רע\" (בראשית, לא', כט')"},{"u":8,"n":43,"t":"כסת","m":"שמיכת פוך.","e":"קניתי כסת נוצות חדשה במיוחד לחורף הקר."},{"u":8,"n":44,"t":"כעור","m":"מכוער, לא יפה.","e":"חזותה כעורה של העיר הביאה להתקוממות התושבים."},{"u":8,"n":45,"t":"כעך","m":"מאפה בצק בצורת טבעת, בייגלה.","e":"רוב הילדים אוהבים לאכול כעכים."},{"u":8,"n":46,"t":"כפה הר כגיגית","m":"לא נותן ברירה, מכריח.","e":"לא בחרתי באיש זה, אנשי הוועד כפו עליי את בחירתו הר כגיגית."},{"u":8,"n":47,"t":"למפרע","m":"לאחור, רטרואקטיבי.","e":"על פי הצעת משרד השיכון, הפחתת המע\"מ תחול למפרע על זוגות שקנו דירה חדשה עד שנה אחת לפני כניסת החוק לתוקף."},{"u":8,"n":48,"t":"למשעי","m":"באופן מושלם.","e":"הבית נקי למשעי."},{"u":8,"n":49,"t":"מקטרג","m":"טוען נגד הנאשם בבית משפט, מאשים אחר.","e":"שאול קטרג על דוד."},{"u":8,"n":50,"t":"מקטרן","m":"מעיל קצר לגברים.","e":"גיל עטה מקטרן לפני שיצא מביתו."},{"u":8,"n":51,"t":"מקלס","m":"משובח, מפואר, מהולל.","e":"היין הוא מקלס ביותר ולכן עולה יקר."},{"u":8,"n":52,"t":"מקרקש","m":"מקשקש, משמיע צליל, מרעיש בפעמון או ברעשן.","e":"נהוג לקרקש ברעשנים באמירת שמו של המן בזמן קריאת מגילת אסתר."},{"u":8,"n":53,"t":"מקשה","m":"(1) עשוי שלמות אחת, גוש אחד. (2) שדה של קישואים או אבטיחים.","e":"משפחתו של דוד מגדלת מקשה של אבטחים מימים ימימה."},{"u":8,"n":54,"t":"מרבד","m":"שטיח.","e":"מרבד צבעוני פרוש על הרצפה."},{"u":8,"n":55,"t":"מרדד","m":"עושה בצד לדק ושטוח.","e":"האופה רידד את הבצק עד שנקרע."},{"u":8,"n":56,"t":"מרהיב","m":"מעורר התפעלות, מדהים.","e":"הנוף הנשקף מההר היה מרהיב עין."},{"u":8,"n":57,"t":"מרך לב","m":"פחדנות.","e":"בעקבות מרך לב של החייל, הוא נחטף והיה שבוי תקופת זמן ארוכה."},{"u":8,"n":58,"t":"מרעה","m":"(1) שדה שהבהמות רועות בו. (2) מרחב מחיה לבעלי חיים שונים.","e":"\"וילכו למבוא גדר עד למזרח הגיא לבקש מרעה לצאנם\" (דברי הימים א, ד', לט')."},{"u":8,"n":59,"t":"מרצפת","m":"שטח מרוצף, רצפה, לוח לריצוף, אריח.","e":"אמי החליפה מרצפת בסלון הבית."},{"u":8,"n":60,"t":"מרקוע","m":"ביסקוויט.","e":"הכנתי עוגת מרקועים עם קצפת."},{"u":8,"n":61,"t":"מרקסיזם","m":"תורה חברתית הדוגלת בביטול רכוש הפרט ובהספקת עבודה ומחיה לכל.","e":"מרקסיזם היא תאוריה כלכלית-חברתית והשקפת עולם, המבוססת על הגותו של הפילוסוף קרל מרקס."},{"u":8,"n":62,"t":"מרקע","m":"לוח או בד המשמש לתמונות של מקרן, מסך, רקע, משטח.","e":"הדמויות מצולמות על מרקע כחול."},{"u":8,"n":63,"t":"מרשל","m":"לא מסודר, מוזנח, אינו מקפיד על מלאכתו.","e":"הופעתו הייתה מרשלת ולכן לא קיבל אהדה רבה מהציבור."},{"u":8,"n":64,"t":"מרפש","m":"מלוכלך בבוץ.","e":"\"הכל כאן מרפש בגלל הכלב!\" גער שמעון."},{"u":8,"n":65,"t":"נכסף","m":"משתוקק, מתאווה, עורג.","e":"נהוראי נכסף לנהוג במכונית החדשה של אביו."},{"u":8,"n":66,"t":"נלוז","m":"סר מדרך הישר.","e":"חבורה זו נלוזה כבר בגיל צעיר מאוד."},{"u":8,"n":67,"t":"נמחה","m":"(1) מנוגב (דמעה). (2) נמחק. (3) נשמד, מסולק.","e":"עקבותיו נמחו מהשביל."},{"u":8,"n":68,"t":"נמלך בדעתו","m":"חזר ושקל את הדברים, התלבט מאוד.","e":"ראש הממשלה נמלך בדעתו לגבי יציאה למלחמה."},{"u":8,"n":69,"t":"נסרת","m":"אבקה ושבבי עץ הנושרים מן העץ בשעת ניסור.","e":"רצפת הנגרייה מכוסה בנסרת."},{"u":8,"n":70,"t":"נעירה","m":"(1) נערה, קול החמור. (2) ניעור, טלטול בחוזקה לשם ניקוי.","e":"נעירותיו של החמור העירו אותנו משנתינו."},{"u":8,"n":71,"t":"נקפו לבו","m":"מצטער, מתחרט, חש ייסורי מצפון.","e":"לאחר שגנב מהרוכל הזקן, נקפו לבו של הפושע וחזר לשלם על כל מה שגנב."},{"u":8,"n":72,"t":"סכר את פיו","m":"סתם לו את הפה.","e":"הוא העדיף לסכור את פיו ולא לומר מילה."},{"u":8,"n":73,"t":"סלידה","m":"גועל או רתיעה מפני דבר מאוס.","e":"שקר וזיוף מעוררים בי סלידה."},{"u":8,"n":74,"t":"סמוך על שולחן","m":"אינו מפרנס את עצמו, נתמך על ידי אחרים.","e":"אמנים רבים היו סמוכים על שולחנו של המלך."},{"u":8,"n":75,"t":"סנגור","m":"עורך דין המגן על נאשם במשפט, המדבר בזכותו של אדם המואשם בדבר מה.","e":"הוריו של הילד סנגרו עליו מול מנהלת בית הספר שטענה שעשה מעשי קונדס."},{"u":8,"n":76,"t":"סנונית ראשונה","m":"כינוי למבשר דבר מה שאחרים עוד יבואו בעקבותיו.","e":"הכנסת הגבינה הלבנה והשמנת המתוקה לפיקוח מחירים היא צעד מבורך, אבל הצרכן הישראלי צריך לקוות שזו תהיה רק הסנונית הראשונה ושלאחריה הממשלה תגביר את התערבותה במחירים בשוק."},{"u":8,"n":77,"t":"ענף","m":"בעל ענפים רבים. מקיף, מגוון, פורה, שופע.","e":"הסעודה הייתה ענפה במטעמים."},{"u":8,"n":78,"t":"עצת אחיתפל","m":"עצה מכשילה.","e":"יוסי נתן לדני עצת אחיתפל, לקחת הלוואה לקניית רכב למרות שידע שאין לו יכולת להחזיר את הכסף בזמן."},{"u":8,"n":79,"t":"עקב אכילס","m":"נקודת תורפה, נקודת חולשה.","e":"האנטיביוטיקה היא עקב אכילס של חיידקים."},{"u":8,"n":80,"t":"עקב בצד אגודל","m":"לאט לאט, צעד אחר צעד, בזהירות.","e":"הלכנו עקב בצד אגודל בשביל המסוכן."},{"u":8,"n":81,"t":"פסיבי","m":"לא פעיל, חסר יוזמה, סביל, עמדה המתירה שליטה של השפעות חיצוניות.","e":"עישון פסיבי מזיק במידה רבה."},{"u":8,"n":82,"t":"פעוט","m":"ילד קטן, תינוק.","e":"לגן השעשועים מגיעים כל יום בממוצע 30 פעוטות."},{"u":8,"n":83,"t":"פעוט","m":"קטן וחסר חשיבות.","e":"הבדל התשלום בין חברות הביטוח פעוט, ולכן לא משנה היכן תבטחי את רכבך."},{"u":8,"n":84,"t":"פקו ברכיו","m":"נבהל, נמלא פחד או חולשה שגרמו לברכיו לרעוד.","e":"פקו ברכיו של הנער למשמע קול הנפץ."},{"u":8,"n":85,"t":"פרדוקס","m":"טענה או תופעה הכוללת סתירה פנימית או סותרת את ההיגיון.","e":"פרדוקס הביצה והתרנגולת: מה קדם למה - הביצה או התרנגולת?"},{"u":8,"n":86,"t":"פרוביזורי","m":"זמני, ארעי.","e":"מזג האוויר הזה פרוביזורי ויחלוף בקרוב."},{"u":8,"n":87,"t":"צנזורה","m":"מניעת פרסום, פיקוח ושליטה על מידע ודעות.","e":"הרבה מידע לא מגיע לציבור עקב החלטת הצנזורה הצבאי."},{"u":8,"n":88,"t":"צפוד","m":"מצומק, יבש, מקומט.","e":"הפרחים באגרטל היו צפודים."},{"u":8,"n":89,"t":"קפא על שמריו","m":"לא עשה דבר, נותר ללא שינוי.","e":"בניית השכונה החדשה קפאה על שמריה ובתגובה לכך תושבי העיר מחו."},{"u":8,"n":90,"t":"קפח","m":"אדם גבוה מאוד.","e":"רוב שחקני הכדורסל קפחים."},{"u":8,"n":91,"t":"קפיטליזם","m":"(1) רכושנות. (2) משטר כלכלי חברתי הדוגל ביוזמה פרטי ובקניין פרטי וכן בשליטה פרטית על הרכוש.","e":"יש בי אמון שבאמצעות קפיטליזם יהיה ניתן להרים את הכלכלה הישראלית לרבדים גבוהים יותר מאשר כשהיא הייתה מדינה סוציאליסטית."},{"u":8,"n":92,"t":"קפנדריה","m":"דרך קיצור.","e":"דרך זו היא קפנדריה לביתי."},{"u":8,"n":93,"t":"קפץ את ידו","m":"לא נתן, נהג בקמצנות.","e":"\"לא תקפץ את ידך מאחיך האביון\" (דברים, טו', ז')."},{"u":8,"n":94,"t":"קצב","m":"מי שמכין בשר למכירה ומוכר אותו.","e":"לק צב הזה בשר משובח."},{"u":8,"n":95,"t":"ריתוך","m":"חיבור חלקי מתכת על ידי התכת (המסת מתכת) מקום החיבור.","e":"טבעת הנישואים יוצרה על ידי ריתוך של כסף וזהב יחד."},{"u":8,"n":96,"t":"רמח","m":"חנית, כלי נשק קדום בצורת מוט שחוד מתכת מחובר לקצהו.","e":"תחרות הפלה ברמח היא תחרות בין שני אבירים רכובים על גבי סוס כאשר מטרת כל אחד מהם היא להפיל את יריבו מהסוס ברמח."},{"u":8,"n":97,"t":"רמץ","m":"אפר חם, גחלים חמים.","e":"מהמדורה נשאר רק רמץ."},{"u":8,"n":98,"t":"שנץ","m":"שרוך או סרט לקשירה או לקישוט בעיקר על בגד.","e":"על שמלתה שנצים רבים."},{"u":8,"n":99,"t":"שנת","m":"קו או סימן של חלוקת המידה במכשירי מדידה.","e":"ניתן לראות על המשורות את השנתות למדידת נפח הנוזל שבהם"},{"u":8,"n":100,"t":"שעון","m":"נשען.","e":"האדון שעון על הקביים."},{"u":9,"n":1,"t":"אצטבה","m":"מדף.","e":"אצטבת ספרים."},{"u":9,"n":2,"t":"אצטלה","m":"(1) גלימה של אדם מכובד. (2) משל לתפקיד מכובד.","e":"הוא ראוי לאצטלה."},{"u":9,"n":3,"t":"אצן","m":"ספורטאי המתמחה בריצה מהירה.","e":"האצן הנורווגי שבר את שיא העולם בריצת מאה מטרים."},{"u":9,"n":4,"t":"אקוטי","m":"חד, מתפתח במהירות ובחדות, לא קבוע, רציני, חמור.","e":"דלקת תוספתן מלווה בכאבים אקוטיים."},{"u":9,"n":5,"t":"אקולוגיה","m":"תורת הסביבה, ענף בביולוגיה החוקר את היחס בין החי והצומח לבין סביבתם, מבחינת מחזור קיום, מבנה קהילתי והתפתחותם, קשרים בין סוגי אורגניזמים שונים, התפלגות גאוגרפית ושינוי אוכלוסייה.","e":"הממשלות העלו את מחירי הנפט בשל סיבות אקולוגיות."},{"u":9,"n":6,"t":"אקטיבי","m":"פעיל, תזזיתי, עובד במרץ ובערנות.","e":"הר געש זה הוא אקטיבי בשנים האחרונות."},{"u":9,"n":7,"t":"אקלקטי","m":"בעברית: לקטני. מורכב ממקורות שונים.","e":"מידע זה אקלקטי ונבחר בקפידה ושקדנות."},{"u":9,"n":8,"t":"ארומה","m":"ריח נעים, ניחוח.","e":"ארומת הפרחים הייתה נהדרת."},{"u":9,"n":9,"t":"ארך רוח","m":"סבלנות, מתינות.","e":"בזכות ארך רוחו של המנהל, העובד לא פוטר למרות חוצפתו."},{"u":9,"n":10,"t":"ארכבה","m":"(1) ברך. (2) ידית כפופה. (3) ענף כפוף.","e":"אדם המתחנן נופל על ארכבותיו."},{"u":9,"n":11,"t":"ארכה","m":"הארכת זמן, דחיית הסיום, שהות נוספת.","e":"לא הספקתי להגיש את עבודת הגמר לכן ביקשתי ארכה."},{"u":9,"n":12,"t":"ברדס","m":"כיסוי ראש המחובר למעיל, קפוצ'ון.","e":"אורי עטה את הברדס בגלל הגשם."},{"u":9,"n":13,"t":"ברוא","m":"(1) פינוי השטח על ידי עקירת העצים שבו. (2) הרחקת דברי הזוהמה שדבקו בפצע לפני הטיפול בתרופות.","e":"הטרקטור בירא את השטח המיועד לבניה."},{"u":9,"n":14,"t":"ברי","m":"ברור, שאינו מוטל בספק.","e":"ברי שפעילות גופנית מועילה לבריאות, אך חשוב לשמור גם על תזונה נכונה."},{"u":9,"n":15,"t":"בריה","m":"יצור, כלל בעלי החיים כולל בני האדם.","e":"אני בריה וחברי ברייה."},{"u":9,"n":16,"t":"בריש גלי","m":"בפומבי, בגלוי, לעיני כל.","e":"הנשיא גילה את סודו לעם בריש גלי."},{"u":9,"n":17,"t":"ברם","m":"אבל, אולם. מילת קישור המביעה קשר לוגי של ניגוד.","e":"תכננתי ללכת אל חברי ברם לבסוף לא עשיתי זאת."},{"u":9,"n":18,"t":"דרך ארץ","m":"נימוסים, כבוד, התנהגות נאותה.","e":"על כל אדם להתייחס אל הוריו בדרך ארץ."},{"u":9,"n":19,"t":"דרך כוכבו","m":"עלה לגדולה, הצליח.","e":"בשלהי המאה השמונה עשרה דרך כוכבה של התנועה הרומנטית באירופה."},{"u":9,"n":20,"t":"דש","m":"קפל בחלק העליון של בגד הנמצא בהמשך הצווארון.","e":"החתן שם פרח בדש חולצתו."},{"u":9,"n":21,"t":"דש","m":"עוסק בעניין עיסוק חוזר ונשנה.","e":"הוא דש שוב ושוב באותו העניין."},{"u":9,"n":22,"t":"הצר את צעדיו","m":"עיכב את התקדמותו(של אחר), הגביל את חופש הפעולה שלו.","e":"השופט הצר את צעדיו של העבריין ואסר עליו לצאת מביתו."},{"u":9,"n":23,"t":"הקוות","m":"היאספות של נוזלים.","e":"הקוותם של מי הגשם יצרה אגם קטן."},{"u":9,"n":24,"t":"הקזה","m":"הוצאת דם לשם ריפוי.","e":"לשם טיפול בבעיות בטחול נהגו להקיז דם מווריד ביד שמאל."},{"u":9,"n":25,"t":"הקיץ הקץ","m":"הגיע הסוף, חדל מלהתקיים.","e":"יש הטוענים בעזרת הוספת מצלמות מהירות לכבישים יקיץ הקץ של תופעת הנהיגה המופרזת."},{"u":9,"n":26,"t":"הקנטה","m":"לגלוג והרגזה על ידי הערות עוקצניות במטרה להכעיס.","e":"דני הקניט את אורי, ואורי החליט להבליג."},{"u":9,"n":27,"t":"הקש","m":"הסקת מסקנות עקב דמיון בין שני דברים או יותר.","e":"יכולת ההקשה שלי מפעילותה השיווקית של הפירמה בה אני עובד כיום אל הצלחתה העסקית מוגבלת למדי משום שהתחלתי לעובד בפירמה לפני כשנה בלבד."},{"u":9,"n":28,"t":"הקשה את ערפו","m":"התעקש, סירב להיענות, לא שינה את דעתו בעקשנות יתרה.","e":"\"כי הקשו את ערפם לבלתי שמוע את דברי\" (ירמיהו, יט', טו')."},{"u":9,"n":29,"t":"הרואי","m":"מעשה אמיץ שיש בו גבורה.","e":"גיבור הספר הציל את הנסיכה ובכך עשה מעשה הרואי."},{"u":9,"n":30,"t":"הרף עין","m":"מהירות רבה, מיד.","e":"הטייסים ראו עצם בלתי מזוהה שנעלם כהרף עין ולכן לא הספיקו לזהותו."},{"u":9,"n":31,"t":"הררים התלויים בשערה","m":"תורה וסברות כבדות המבוססות על בסיס חלק או רמז דק.","e":"בהלתם של האזרחים ממלחמה קרבה היא כהררים התלויים בשערה."},{"u":9,"n":32,"t":"זמם","m":"אבזר החוסם פה של בעלי חיים, רסן.","e":"נחום חסם את פי האתון בזמם, כדי שזו לא תאכל את הפרחים שבגינתו."},{"u":9,"n":33,"t":"זרזיף","m":"(1) גשם דק. (2) זרם, שטף.","e":"לא עצרו את המרוץ בשל זרזיף קל שירד."},{"u":9,"n":34,"t":"זרקור","m":"פנס גדול המאיר למרחקים.","e":"זרקורים רבים הוצבו ברחבי העיר לכבוד החגיגות."},{"u":9,"n":35,"t":"חרמה","m":"כיליון, השמדה.","e":"מלחמת העולם השנייה הייתה מלחמת חרמה ולכן הוגדרה כמלחמה הקשה ביותר."},{"u":9,"n":36,"t":"חרף","m":"למרות, על אף.","e":"חרף ההפגנות לא הושגה שום פשרה בעניין."},{"u":9,"n":37,"t":"חרף את נפשו","m":"סיכן את חייו.","e":"המפקד חרף את נפשו למען חייליו."},{"u":9,"n":38,"t":"טפיפה","m":"הליכה בצעדים קלים ומהירים.","e":"הדוגמניות פסעו בטפיפה על מסלול התצוגה."},{"u":9,"n":39,"t":"טריבונה","m":"(1) מערכת מושבים מדורגים באצטדיון. (2) במה, דוכן.","e":"במהלך משחק הכדורגל הטעון בין שני קבוצות הנוער של שני המועדונים היריבים המאמן של אחת הקבוצות הורחק על ידי שופט המשחק לטריבונה כיוון שהוא התנהג באופן לא נאות ובהתאם לנדרש ממאמן קבוצת הנוער של מועדון הכדורגל המפואר."},{"u":9,"n":40,"t":"ישוב הדעת","m":"מחשבה מפוכחת ולא פזיזה.","e":"המדינאים דנו בפתרונות לסכסוך בישוב הדעת."},{"u":9,"n":41,"t":"ישומון","m":"אפליקציה","e":"לחברת הדואר ישומון המאפשר לקבל מידע ללא הגעה פיזית לסניפים."},{"u":9,"n":42,"t":"ישועה","m":"הצלה – בעיקר על ידי אלוהים.","e":"זמננו אוזל ולכן מוטב לפעול ולא להמתין לישועת האל."},{"u":9,"n":43,"t":"כפח","m":"אדם גבוה מאוד.","e":"רוב שחקני הכדורסל הינם כפחים ולא ננסים."},{"u":9,"n":44,"t":"כפיס","m":"פיסת עץ קטנה.","e":"אומן העץ מכין פסלים מזעריים מכפיסים."},{"u":9,"n":45,"t":"כפל לשון","m":"חזרה על מילה או על עניין בדרך כלל לשם חיזוק.","e":"בדבריו של המורה יש כפל לשון בשל רצונו לחזק את דבריו הנוקבים."},{"u":9,"n":46,"t":"כרה","m":"סעודה עשירה במאכלים למוזמנים רבים.","e":"החבורה הקימה מחנה ביער וערכה במקום כרה גדולה ועשירה במטעמים."},{"u":9,"n":47,"t":"לעז","m":"(1) לועזית, לא עברית. (2) שם רע, דיבה.","e":"אתה מוציא לעז על אדם שהוא צדיק."},{"u":9,"n":48,"t":"לעלא ולעלא","m":"למעלה מכל שבח, מן המעלה הראשונה, מושלם.","e":"לאחר שנה של לימודי השפה הסינית, היא דיברה את השפה לעלא ולעלא."},{"u":9,"n":49,"t":"לפני ולפנים","m":"עומק הדברים, הפרטים הנסתרים.","e":"הוא נכנס לפני ולפנים של נפשו."},{"u":9,"n":50,"t":"מרשתת","m":"אינטרנט.","e":"אתמול חיפשתי מרשתת מידע על חיות בר בארץ ישראל."},{"u":9,"n":51,"t":"מרת רוח","m":"חוסר נחת, אכזבה","e":"מרת רוח של המורה נגרמה בגלל ציוניהם הנמוכים של התלמידים."},{"u":9,"n":52,"t":"משאת נפש","m":"שאיפה, אידאל.","e":"הצטיינות היא משאת נפש של התלמיד."},{"u":9,"n":53,"t":"משוא פנים","m":"אפליה לטובה.","e":"על השופט לשפוט את שני האנשים האלה ללא משוא פנים."},{"u":9,"n":54,"t":"משובב נפש","m":"משמח, עושה נחת, מרענן, מעניין.","e":"הטיול לחו\"ל משובב נפש לכל המשפחה."},{"u":9,"n":55,"t":"משובה","m":"שובבות, מעשה קונדס, התנהגות רעה, חטא.","e":"ילדים עוסקים במעשי משובה."},{"u":9,"n":56,"t":"משולח רסן","m":"פרוע, ללא הגבלה מוסרית, ללא מעצור.","e":"התנהגותו של התלמיד משולחת כל רסן ולא נותר אלא להרחיקו."},{"u":9,"n":57,"t":"משושה","m":"אנטנה.","e":"בעמק האלה נמצאת תחנת לוויינים ובו משושות רבות."},{"u":9,"n":58,"t":"משטין","m":"מלשין, שונא, מקטרג.","e":"החיילים השטינו על מקום מחבואו של המפקד."},{"u":9,"n":59,"t":"משכבר הימים","m":"לפני ימים רבים, לפני עידנים, בעבר הרחוק.","e":"החברות שלהם היא חברות משכבר הימים."},{"u":9,"n":60,"t":"משכון","m":"עירבון, חפץ המופקד בידי המלווה להבטחת פירעון החוב.","e":"משכנתי את רכבי עד להחזרת הכסף שלוויתי."},{"u":9,"n":61,"t":"משכית","m":"מעשה אמנות כמו תמונה או תכשיט.","e":"חלון משכית, חלון העשוי פסיפס."},{"u":9,"n":62,"t":"משל ברוחו","m":"התאפק, שלט בעצמו.","e":"שאול המלך לא משל ברוחו והטיל את הרומח לכיוון דוד."},{"u":9,"n":63,"t":"משנה","m":"(1) תורתו של הוגה דעות. (2) קובץ הלכות של התורה שבעל-פה.","e":"למשנתו של שפינוזה מעריצים רבים."},{"u":9,"n":64,"t":"משנס","m":"חוגר, אוזר.","e":"\"וישנס מתניו וירץ לפני אחאב\" (מלכים א', יח', מו')."},{"u":9,"n":65,"t":"נעלס","m":"שמח, עליז.","e":"הצלם נעלס למראה הנוף המיוחד."},{"u":9,"n":66,"t":"נפל למשכב","m":"חלה.","e":"המורה נפל למשכב לכן היה צורף במורה מחליף."},{"u":9,"n":67,"t":"נפרע","m":"(1) מסולק, משולם. (2) נעשה פרוע. (3) נחשף. (4) מעניש.","e":"ההמחאה הנפרעת תכנס לחשבון הבנק."},{"u":9,"n":68,"t":"נפתל","m":"(1) עקלקל, מפותל. (2) ערמומי, תחבולני.","e":"הזהר מעצות נפתלות פן תטעה."},{"u":9,"n":69,"t":"נצת","m":"נדלק, נשרף.","e":"חומותיה ושעריה של העיר נצתו באש."},{"u":9,"n":70,"t":"נקבובית","m":"חור קטן מאוד.","e":"בעור גופנו נקבוביות רבות."},{"u":9,"n":71,"t":"נקיק","m":"סדק רחב בסלע או באדמה, מעבר צר ועמוק שקירותיו תלולים.","e":"יש ציפורים המקננות נקיקי סלעים."},{"u":9,"n":72,"t":"ססגוני","m":"צבעוני, רבגוני.","e":"זר הפרחים שקיבלה הגברת ססגוני."},{"u":9,"n":73,"t":"סערה בכוס מים","m":"עשיית רעש ובלגן מכלום ושום דבר.","e":"הדר נכשלה במבחן ועשתה סערה בכוס מים."},{"u":9,"n":74,"t":"ספון","m":"(1) מקורה, בעל תקרה. (2) טמון, חבוי, נסתר, צפון.","e":"בחוץ יורד גשם ואנו ספונים בביתנו."},{"u":9,"n":75,"t":"ספן","m":"משטח מרוצף מחוץ לבית העשוי עץ או דמוי עץ.","e":"\"ויבן את הבית ויכלהו ויספן את הבית גבים ושדרת בארזים\" (מלכים א', ו' ט')."},{"u":9,"n":76,"t":"ספר","m":"גבול, אדמת המדינה הסמוכה לגבול.","e":"התושבים באזורי הספר של המדינה מחו על חוסר טיפוח של יישובים אלה."},{"u":9,"n":77,"t":"עקה","m":"מועקה, לחץ.","e":"חשתי עקה לאחר ראיון העבודה."},{"u":9,"n":78,"t":"ערבה","m":"ערובה, ביטחון ואחריות לקיומה של הבטחה או התחייבות.","e":"הכנת שיעורים היא ערבה להצלחת הילד בעתיד."},{"u":9,"n":79,"t":"ערירי","m":"בודד, גלמוד, שאין לו צאצאים.","e":"ישיש זה ערירי ואין מי שיסעד אותו בזקנתו."},{"u":9,"n":80,"t":"ערכאה","m":"מוסד בעל סמכות שיפוטית, מקום המשפט, בית המשפט.","e":"בבית המשפט בישראל יש שתי ערכאות המוסמכות לדון בענייני משפחה – הערכאה הדתית והערכאה האזרחית."},{"u":9,"n":81,"t":"עשה שמות","m":"הרס, החריב.","e":"המים שהציפו את הדירה עשו בה שמות, ורוב תכולתה כבר אינה ראויה לשימוש."},{"u":9,"n":82,"t":"פרודיה","m":"יצירה קומית המחקה בלגלוג יצירה רצינית, סוגה או אדם.","e":"מנדלסון יצר פרודיה על יצירותיו של מוצארט על מנת ללעוג לו."},{"u":9,"n":83,"t":"פרוזאי","m":"רגיל, פשוט, משעמם.","e":"מחזה זה היה פרוזאי לעומת מחזות אחרים."},{"u":9,"n":84,"t":"פרוזמא","m":"(1) סינר, מטפחת. (2) זרקור. (3) מקרן.","e":"לאופה פרוזמא בצבע כחול."},{"u":9,"n":85,"t":"פרוטרוט","m":"(1) מספר קטן, דבר מועט. (2) מטבעות קטנים.","e":"הטכנאי הסביר לי בפרוטרוט איך לתקן את המכשיר החשמלי."},{"u":9,"n":86,"t":"פרוצדורה","m":"(1) הליך, נוהל, שיטה, סדר עבודה, נוהג. (2) שיטת ייצור.","e":"פרוצדו רת הייצור של ננוטכנולוגיה מורכבת מאוד."},{"u":9,"n":87,"t":"פרי עטו","m":"יצירה או טקסט שהוא כתב.","e":"האודישנים לתחרות המוזיקה דרשו לבצע יצירה פרי עטם של המועמדים."},{"u":9,"n":88,"t":"צפחת","m":"(1) כד בעיקר למים או לשמן. (2) מימייה.","e":"צפחת השמן נשברה וכל המטבח היה משומן."},{"u":9,"n":89,"t":"צפרירים","m":"רוחות קלילות או קרני או של תחילת הבוקר.","e":"בבוקר נכנסו צפרירים דרך התריס בחדרי."},{"u":9,"n":90,"t":"קצרה ידו","m":"לא הייתה לו יכולת.","e":"קצרה ידו מלהושיע."},{"u":9,"n":91,"t":"קר רוח","m":"שלוות נפש, שליטה עצמית.","e":"המעורבים בתאונה הפגינו קר רוח למרות הנזק שנגרם."},{"u":9,"n":92,"t":"קרא תגר","m":"(1) התלונן, מחה. (2) התריס, התגרה.","e":"לאחר ההתנקשות בנשיא, הבינו כי פוליטיקאים רבים קראו עליו תגר."},{"u":9,"n":93,"t":"קרדם לחפר בו","m":"אמצעי לפרנסה, אמצעי לקידום תועלת אישית.","e":"העיתונאי משתמש בקשריו המשפחתיים כקרדם לחפר בו ובכך לקדם את עצמו."},{"u":9,"n":94,"t":"קרטוב","m":"קצת, מעט.","e":"במתכון העוגה נכתב להוסיף קרטוב של מלח."},{"u":9,"n":95,"t":"רפה ידים","m":"חלש, חסר כח.","e":"הישיש חולה ורפה ידים וצריך סיע וד."},{"u":9,"n":96,"t":"שעטנז","m":"(1) בד עשוי צמר ופשתן יחד. (2) ערבוב של שני מינים או יותר השונים זה מזה.","e":"בחברה הישראלית נעשה שעטנז תרבויות."},{"u":9,"n":97,"t":"שעיר לעזאזל","m":"אדם הנענש על פשעי אחרים, אדם שמאשימים אותו על כישלון אחרים.","e":"כמה ילדים הוענשו מכיוון שאיחרו לשיעור, אולם אחד הילדים שהוענש לא איחר והפך שעיר לעזאזל."},{"u":9,"n":98,"t":"תעודת עניות","m":"עדות לחוסר יכולת.","e":"היחלשותו הדרסטית של המטבע המקומי היא תעודת עניות לשר האוצר ולנגדי הבנק המרכזי."},{"u":9,"n":99,"t":"תועבה","m":"דבר מה מגונה, פריצות מוסרית.","e":"תרחק דרכו של אדם הגון בעל מידות טובות ממבצעי מעשי תועבה בבעל חיים חסר ישע."},{"u":9,"n":100,"t":"תסכית","m":"מחזה מעובד למשדר רדיו.","e":"מאז עידן הטלוויזיה מפיקים פחות ופחות תסכיתים ברדיו."},{"u":10,"n":1,"t":"ארכן","m":"(1) שמאריך בדיבורו, דברן. (2) בעל גפיים ארוכות, ארוך יתר על המידה.","e":"שדר החדשות ארכן מאוד."},{"u":10,"n":2,"t":"ארעי","m":"זמני, לא קבוע.","e":"מזג האוויר הסוער הוא ארעי."},{"u":10,"n":3,"t":"ארשת פנים","m":"הבעת פנים.","e":"הם התפללו איש איש במקומו בשקט ובארשת פנים רצינית."},{"u":10,"n":4,"t":"אשכר","m":"מתנה.","e":"קבלתי אשכר לכבוד חג הפסח."},{"u":10,"n":5,"t":"אשליה","m":"(1) אמונה או תקווה שאין לה יסוד במציאות. (2) תעתוע ראיה, אחיזת עיניים.","e":"אדם הלוקה בנפשו שוגה באשליות ולכן מדבר לעצמו."},{"u":10,"n":6,"t":"אשמאי","m":"חוטא.","e":"אשמאים רבים בקרבנו, הזהרו!"},{"u":10,"n":7,"t":"אשמורה","m":"חלק מן הלילה.","e":"שמירתו של דניאל החלה עם תום אשמורת הלילה הראשונה."},{"u":10,"n":8,"t":"אשתקד","m":"שנה שעברה.","e":"יש ירידה ביבול לעומת אשתקד."},{"u":10,"n":9,"t":"את","m":"כלי חפירה.","e":"הגנן חפר באדמה בעזרת את."},{"u":10,"n":10,"t":"אתאיסט","m":"חסר אמונה, כופר באלוהיו, אפיקורוס.","e":"כל חייו היה איש דת והאמין אך בזקנותו התרחק מהדת והפך אתאיסט."},{"u":10,"n":11,"t":"אתון","m":"נקבת החמור.","e":"מהכלאה של סוס עם אתון יוצא הפרד."},{"u":10,"n":12,"t":"אתי","m":"מוסרי.","e":"הכובשים נהגו בצורה אתית לתושבי המקום."},{"u":10,"n":13,"t":"אתני","m":"ששייך לעם או לגזע בתחומי התרבות, הדת וכו'.","e":"המוזיקה של זמר זה לא שאובה משורשיו האתניים."},{"u":10,"n":14,"t":"בשבע עיניים","m":"בקפדנות רבה, בתשומת לב רבה.","e":"אמרתי לשמרטפית להשגיח על התינוק בשבע עיניים כי הוא שובב."},{"u":10,"n":15,"t":"התלקחות","m":"(1) התפרצות פתאומית של אש, תחילת השריפה. (2) התפרצות, התחוללות, התפשטות מהירה.","e":"בעקבות ביטול הסכם הסחר בין המדינות, יחסם התלקח עד כדי ביטול הסכם השלום."},{"u":10,"n":16,"t":"התמרה","m":"(1) שינוי הרכב, מבנה או צורה באופן יסודי. (2) שינוי אופי או מצב.","e":"בניסוי גנטי התרחשה התמרה, זן א' הפך לזן ב'."},{"u":10,"n":17,"t":"התנודדות","m":"(1) התנדנדות, עמידה בלי שיווי משקל. (2) התלבטות.","e":"לאחר שנפל על ראשו התנודד והיה צריך עזרה להתהלך."},{"u":10,"n":18,"t":"התנכלות","m":"ניסיון לפגוע, חרישת מזימות נגד.","e":"התנכלותו של קין בהבל נבעה מקנאתו לו."},{"u":10,"n":19,"t":"התפלה","m":"סילוק המלח, הפיכת מי ים ראויים לשתייה.","e":"למדינת ישראל מומחיות בנושא התפלת מים מכיוון שיש מחסור במקורות מים טבעיים במדינה."},{"u":10,"n":20,"t":"התקוממות","m":"התמרדות, התנגדות.","e":"ההתקוממות של העם הביאה לשינוי."},{"u":10,"n":21,"t":"התרברבות","m":"התפארות שחצנית, התגאות, התנשאות.","e":"ראש הממשלה התרברב בהצלחתו הביטחונית יתר על המידה."},{"u":10,"n":22,"t":"התרועעות","m":"(1) התיידדות. (2) התמוטטות.","e":"התרועעותם קרבה בניהם מאוד."},{"u":10,"n":23,"t":"התרשלות","m":"פעולה או מילוי חובה בצורה מרושלת, חלקית וגרועה מתוך עצלות או חוסר תשומת לב.","e":"משרד החינוך מנסה למנוע התרשלות מן הלימוד."},{"u":10,"n":24,"t":"חרץ לשון","m":"התחצף, גידף, הלשין.","e":"התלמיד חרץ לשונו כלפי חבריו לכיתה ולכן הושעה מהלימודים."},{"u":10,"n":25,"t":"חשך מצרים","m":"חושך מוחלט.","e":"בשל הפסקת החשמל שרר בבית חשך מצרים."},{"u":10,"n":26,"t":"חת","m":"ירא, נבהל, פחד, נשבר.","e":"חיתתו של ערן מעכבישים גרמה לו להשתתק."},{"u":10,"n":27,"t":"חתחתים","m":"(1) מכשולים, קשיים. (2) בליטות ושקעים באדמה המהווים מכשול. (3) קמטים, חריצים.","e":"חתחתים רבים בדרכו להתקדם בעבודתי, אך עליו להתמודד עמם."},{"u":10,"n":28,"t":"טרם","m":"עדיין לא, לפני ש-.","e":"החורף הגיע וטרם נראה הנחליאלי."},{"u":10,"n":29,"t":"כרח","m":"הכרח, צורך דחוף, חוסר ברירה.","e":"יאיר אובחן כחולה בצנצנת ונשלח בעל כרחו להתחסן."},{"u":10,"n":30,"t":"כרך","m":"(1) עיר גדולה. (2) עיר מוקפת חומה.","e":"ניכר שכפריים רבים עוזבים לאזור הכרך בחיפוש אחר פרנסה."},{"u":10,"n":31,"t":"כרם","m":"מטע של גפנים, זיתים או שקדים.","e":"\"כי תבא בכרם רעך ואכלת ענבים כנפשך שבעך\" (דברים, כג', כה')."},{"u":10,"n":32,"t":"כתת את רגליו","m":"הטריח עצמו בהליכה מרובה עד שרגליו נשחקו.","e":"האדון כתת את רגליו על מנת להגיע במהירות למקום עבודתו."},{"u":10,"n":33,"t":"לקוני","m":"(1) לא מפורט, מקוצר, תמציתי. (2) אדם שאינו מרבה לדבר.","e":"תשובה לקונית שאינה מספקת מידע רב."},{"u":10,"n":34,"t":"לקסיקון","m":"אוצר מילים או רשימת מילים, מילון בעיקר למקצוע או לתחום מסוים.","e":"הלקסיקון של ילד הכפר היה דל מאשר של ילד העיר ולכן התקשו לתקשר."},{"u":10,"n":35,"t":"לרועץ","m":"למכשול, לצרה.","e":"פשרנותו הייתה לו לרועץ בעולם העסקים."},{"u":10,"n":36,"t":"משסה","m":"מעודד או מגרה מישהו אחר לתקוף, מסית.","e":"שסיתי את הכלב לתקוף את הפורץ."},{"u":10,"n":37,"t":"משעול","m":"שביל, דרך.","e":"כדי לטפס את הר הקלימנג'רו עברנו משעולים לא קלים."},{"u":10,"n":38,"t":"מתאוה","m":"חושק, רוצה מאוד.","e":"הכלב מתאוה לצאת לטיול אך יורד גשם בחוץ."},{"u":10,"n":39,"t":"מתאונן","m":"מתלונן.","e":"היא התאוננה בפני מנהל המסעדה על איכות השירות."},{"u":10,"n":40,"t":"מתבן","m":"מחסן לתבן, ערימת תבן.","e":"המתבן שבחצרי נאכל בלילה על ידי חיות בר."},{"u":10,"n":41,"t":"מתגלע","m":"פרץ, הגיח, בקע (ריב, מחלוקת וכדומה).","e":"בין יאיר לשירן נתגלעה מחלוקת בנושא הצמחונות."},{"u":10,"n":42,"t":"מתימר","m":"מתפאר ביכולת שעדיין לא עמדה במבחן, מתהלל.","e":"הוא מתימר כי ינצח בתחרות."},{"u":10,"n":43,"t":"מתינות","m":"(1) חוסר קיצוניות, נטייה להתפשרות. (2) איטיות, חוסר פזיזות.","e":"מתינותם של שני הצדדים מנעה מלחמה."},{"u":10,"n":44,"t":"מתיק","m":"מנתק, מזיז, מרחיק.","e":"האישה לא יכלה להתיק עיניה מהנוף."},{"u":10,"n":45,"t":"מתכלה","m":"נגמר, מושמד.","e":"לפלסטיק לוקח המון שנים להתכלות."},{"u":10,"n":46,"t":"מתנה","m":"(1) מספר בעיקר את רגשותיו או צרותיו. (2) מקונן, סופד.","e":"הקשיש מתנה את צרותיו בפני הרופא."},{"u":10,"n":47,"t":"מתעב","m":"מואס, נגעל, סלד, שנא.","e":"העם מתעב את נשיאו."},{"u":10,"n":48,"t":"מתעמר","m":"מתאכזר, מתעלל.","e":"המתעמר בבעל חיים חייב להיענש."},{"u":10,"n":49,"t":"מתעשת","m":"משנה את דעתו לאחר מחשבה שניה, התגבר על חולשה או הלם וחזר לפעות בכוחות עצמו.","e":"לאחר ההלם שתקפו התעשת פלוני והגיב בהתאם."},{"u":10,"n":50,"t":"מתפרקד","m":"משתרע לכל אורכו בשכיבה על גבו.","e":"הסטודנט התפרקד על דשא האוניברסיטה בהפסקתו."},{"u":10,"n":51,"t":"מתרה","m":"מזהיר מפני סכנה או עונש.","e":"עורך הדין מתרה בלקוחו לומר את האמת."},{"u":10,"n":52,"t":"נקרה","m":"מזדמן, בא במקרה, נקלע.","e":"נקרנו למקום התאונה."},{"u":10,"n":53,"t":"נר לרגליו","m":"עקרון המנחה אותו, נתן השראה.","e":"הצדק צריך להיות נר לרגליו של שופט בבית המשפט."},{"u":10,"n":54,"t":"נרגן","m":"רוטן, מתלונן, לעולם לא מרוצה, מעורר ריב.","e":"הוא תמיד נרגן ולכן אין לו חברים."},{"u":10,"n":55,"t":"נשגב מבינתו","m":"לא ביכולתו השכלית להבין.","e":"החומר נשגב מבינתו של תלמידי הכיתה."},{"u":10,"n":56,"t":"נשיה","m":"שכחה.","e":"נשיה טובה לעיתים מהזיכרון."},{"u":10,"n":57,"t":"סר חינו","m":"חדל להיות נחשק, ירד ממנו החן, יש בו פגם.","e":"לאחר זמן מה, סר חינו של הזמר מלהופיע והפסיק."},{"u":10,"n":58,"t":"סרוגין","m":"(1) ברווחים והפסקות. (2) דבר שנעשה במתכונת החוזרת על עצמה.","e":"הפצוע מהתאונה אמש החל לצלוע לסרוגין."},{"u":10,"n":59,"t":"סרעף","m":"מחשבה, הרהור, רעיון.","e":"הנערה השתתקה ושקעה בסרעפים."},{"u":10,"n":60,"t":"סתירה","m":"הפרכה(של טענה), ניגוד בין שני רעיונות.","e":"קיימת סתירה באופיו של הדמות המרכזית בספר, מצד אחד הוא הגון ומצד שני אסר את אמו ללא משפט הוגן."},{"u":10,"n":61,"t":"עששית","m":"מנורת נפט בעלת כיסוי זכוכית.","e":"למזלי העששית האירה את חדרי ויכולתי לקרוא ספר."},{"u":10,"n":62,"t":"עשתון","m":"מחשבה, הגיג, רעיון.","e":"אבדו עשתונותיו של המאמן כאשר קבוצתו הפסידה."},{"u":10,"n":63,"t":"עתודה","m":"(1) מאגר משאבים שמור הנועד לשימוש במקרה הצורך או בשעת חירום.","e":"במסגרת לימודי העתודה הרפואית לשירותו בצה\"ל כרופא רכש ניר כלים רבים וחשובים אשר יסייעו לא למלא את תפקידו נאמנה."},{"u":10,"n":64,"t":"עתירה","m":"(1) בקשה שמגישים לבית המשפט לשם קבל סעד משפטי בדרך כלל נגד רשות מוסמכת. (2) תפילת בקשה, תחינה.","e":"האדון נענה לעתירתם של העובדים לקבל העלאה בשכר."},{"u":10,"n":65,"t":"פרימיטיבי","m":"1. לא מפותח, לא משוכלל, מחוץ לציוויליזציה. 2. כינוי לאדם גס וחסר תרבות.","e":"למרות אופיו הפרימיטיבי, הצליח להרשים את המנהל ולהתקבל לעבודה."},{"u":10,"n":66,"t":"פרישות","m":"התנזרות, התרחקות מתענוגות החיים, צניעות.","e":"הוא החל לחיות חיי פרישות והתרחק מנשים ובילויים."},{"u":10,"n":67,"t":"פרמננטי","m":"תמידי, קבוע.","e":"טוש זה פרמננטי ולא מחיק, היזהר לכתוב איתו על הלוח."},{"u":10,"n":68,"t":"פרנויה","m":"מחלת נפש המתבטאת בחשדנות קיצונית וחרדה לא מציאותית מפני גורמים שרוצים להרע.","e":"הוא לא נרדם בלילות בגלל פרנויות."},{"u":10,"n":69,"t":"פרענות","m":"צרה גדולה, אסון.","e":"פרענות גדולה באה עלינו עם פרוץ המלחמה."},{"u":10,"n":70,"t":"פרשת דרכים","m":"צומת, מקום מפגש של שתי דרכים או יותר.","e":"בפרשת הדרכים הבאה פנה ימינה ותגיע למעוז חפצך."},{"u":10,"n":71,"t":"צפרן","m":"לוחית מתכת מחודדת בקצה העט, חרט חד לכתיבה ולחקיקה.","e":"כתבתי בצפרן את ספרי החדש."},{"u":10,"n":72,"t":"צקצוק","m":"רשרוש, השמעת קולות לא חזקים.","e":"לאחר שמנהל החברה סרב להעלות משכורות, אחד העובדים צקצק בלשון."},{"u":10,"n":73,"t":"צריח","m":"1. מגדל מבוצר, מצודה. 2. מבנה משוריין שמחובר אליו כלי ירייה, על גבי טנק או אניית מלחמה ואפשר לסובבו למטרת פגיעה. 3. כלי שחמט.","e":"ככל שהצריח גבוה ומפואר יותר כך הוא מעיד על עוצמה חזקה יותר."},{"u":10,"n":74,"t":"קרם עור וגידים","m":"החל להיעשות ממשי, הפך למציאות.","e":"תוכנית פיתוח החללית הישראלית קרמה עור וגידים."},{"u":10,"n":75,"t":"קרפיף","m":"חצר מגודרת.","e":"בבית זה קרפיף ואפשר לגדל בו כלבים."},{"u":10,"n":76,"t":"קרקע בתולה","m":"אדמה שלא עובדה מעולם.","e":"החקלאי קבל קרקע בתולה ולכן ליבולים לקח זמן רב מהרגיל לצמוח."},{"u":10,"n":77,"t":"קש וגבבה","m":"דברים בטלים, שטויות.","e":"כאשר היה שרוי בגילופין דבר רק קש וגבבה."},{"u":10,"n":78,"t":"קשה לב","m":"אכזר, רשע.","e":"המן היה קשה לב."},{"u":10,"n":79,"t":"קשה ערף","m":"עקשן.","e":"בעל העסק קשה ערף בכל מה שקשור בשיפוץ."},{"u":10,"n":80,"t":"קשר כתרים","m":"הילל, שיבח.","e":"הסטודנט קשר כתרים למרצה לפיזיקה."},{"u":10,"n":81,"t":"קתדרה","m":"בימה קטנה למרצה או למורה.","e":"המרצה עמד על הקתדרה על מנת שכל יושבי האולם יוכלו לראותו."},{"u":10,"n":82,"t":"רציונלי","m":"שכלי, שמבוסס על שיקול דעת, הגיוני.","e":"אדם רציונלי אינו פועל לפי הרגש אלא על פי הראש."},{"u":10,"n":83,"t":"רצען","m":"מי שעוסק בעבודות עור, סנדלר.","e":"הרצען תיקן את נעל העור החדשה שקניתי."},{"u":10,"n":84,"t":"רקיק","m":"עוגה, מאפה קטן ושטוח.","e":"ליום ההולדת הוגשו רקיקים ומגדנות."},{"u":10,"n":85,"t":"רשלנות","m":"חוסר הקפדה במעשים, הזנחה וזלזול בסדר ובניקיון או בדייקנות.","e":"עקב רשלנות רפואית המטופל נאלץ להישאר בבית החולים זמן ממושך בהרבה משהיה צריך."},{"u":10,"n":86,"t":"רשף","m":"גחלת, ניצוץ, הבזקי אש היוצאים מלוע הנשק בזמן הירי.","e":"\"וכמה רשפים וברקים ולפידים\"."},{"u":10,"n":87,"t":"רתוק","m":"הגבלת חופש התנועה של אדם, ע\"י צו או הוראה, חיבור, הצמדה, כבילה.","e":"רתוק החיילים לבסיס הינו עונש מיטבי."},{"u":10,"n":88,"t":"רתתן","m":"הססן, שאינו בטוח בעצמו.","e":"הוא רתתן ולכן לא עשה בנג'י בטיולו."},{"u":10,"n":89,"t":"שפרא דשפרא","m":"המשובח ביותר, מובחר.","e":"בשר זה הינו שפרא דשפרא."},{"u":10,"n":90,"t":"שצף","m":"1. זרם חזק. 2. מהירות.","e":"הסוסים רצו בשצף."},{"u":10,"n":91,"t":"שקוץ","m":"דבר מאוס, תועבה.","e":"מעשיו מעוררי שקוץ."},{"u":10,"n":92,"t":"שרבוט","m":"סרטוט קווים וסימנים חסרי משמעות, קשקוש, כתיבה מרושלת.","e":"השרבוט של דה וינצ'י לבסוף הפך ליצירת אומנות מוכרת ומוערצת בכל העולם."},{"u":10,"n":93,"t":"שריר וקיים","m":"ודאי, מאושר וקיים.","e":"שריר וקיים שמועמד זה ינצח בבחירות לראשות המפלגה."},{"u":10,"n":94,"t":"שרירות","m":"החלטה מקרית חסרת כל ביסוס או שיקול.","e":"העובדים האשימו את ההנהלה בפיטורים שרירותיים ולא צודקים"},{"u":10,"n":95,"t":"שת","m":"שם, מניח.","e":"התלמיד שת את ספריו על השולחן."},{"u":10,"n":96,"t":"תצלינה שתי אזניו","m":"הדבר יזעזע את השומע.","e":"אם פרשייה זו תיחשף כל השומע אותה תצלינה שתי אזניו."},{"u":10,"n":97,"t":"תצרף","m":"פאזל.","e":"הרכבנו תצרף בעל אלף חלקים."},{"u":10,"n":98,"t":"תר","m":"מחפש. מטייל במקום כדי להכירו מקרוב.","e":"משפוטר מעבודתו נאלץ לתור אחר עבודה חדשה."},{"u":10,"n":99,"t":"תרעמת","m":"כעס על אדם על עוול שעשה.","e":"אליאן מצאה כלב עזוב בצד הכביש הסואן ביום קר וגשום מפרפר וכמעט ללא רוח חיים. לאחר שאספה אותו והביאה אותו לווטרינר העירוני נדמה לגלות כי הנ\"ל לא הסכים לטפל בכלב ללא תשלום מלא ונתקפה תרעמת עזה כלפי הווטרינר ואף חשה כלפיו בוז."},{"u":10,"n":100,"t":"תתורה","m":"שוליים.","e":"תתורת הכובע הסתירה את פניה."},{"u":11,"n":1,"t":"אב בחכמה רך בשנים","m":"אדם חכם וצעיר. ניתן לכנות כך אדם חכם מאוד ביחס לגילו הצעיר יחסית.","e":"יוסף חגג אמש גיל מצוות, התרשמתי מהשכלתו הפיננסית וחשתי בליבי כי על יוסף נאמר אב בחכמה רך בשנים."},{"u":11,"n":2,"t":"אבדו עשתונותיו","m":"אובדן שליטה עצמית (עשתונות = מחשבות), התבלבלות.","e":"חברי עומר אבד את עשתונותיו, לצערי, ודיבר אל הוריו באופן מעורר חמלה, כך ללא כל כבוד או הערכה אליהם."},{"u":11,"n":3,"t":"אבד תקוה","m":"התייאש, נכנע, הרים ידיים, הניף דגל לבן, השליך את המגבת.","e":"\"עוד לא אבדה תקותנו, התקוה בת שנות אלפים, להיות עם חפשי בארצנו, ארץ ציון וירושלים. \" (נפתלי הרץ אימבר, שנת 8781)."},{"u":11,"n":4,"t":"אבוס","m":"מפוטם.","e":"החוק בישראל אוסר האבסת אווזים לצרכי הפקת כבד אווז מפני שהליך זה גורם לאווזים לסבל רב."},{"u":11,"n":5,"t":"איפול","m":"הסתרה, שמירת דבר בסוד.","e":"חוקרי משטרת ישראל הטילו איפול מלא על פרטי החקירה."},{"u":11,"n":6,"t":"אליה","m":"זנבה השומני והרך של הכבשה.","e":"אליה מסייעת לכבשה, בין היתר, לאגור מזון בעונות בהן יש מחסור, באופן די דומה לדבשתו של הגמל."},{"u":11,"n":7,"t":"אליה וקוץ בה","m":"דבר מה הנראה טוב אולם יש בו פגם, משול לזנב הכבש נחשב לטעים למאכל אולם לא אחת נתפסים בו קוצים.","e":"הליך שחרורו של גלעד שליט מידי חמאס ביום 1102.01.81 תמורת 720,1 אסירים ועצירים ביטחוניים אשר היו כלואים בישראל משול בעיני רבים לאליה וקוץ בה."},{"u":11,"n":8,"t":"אמיר","m":"צמרת הענפים העליונים בעץ.","e":"יואל טיפס, בגינתו, עד הגיעו אל אמיר העץ."},{"u":11,"n":9,"t":"אנקדוטה","m":"סיפור קצר ומשעשע מהחיים.","e":"אחת המילים הנרדפות לאנקדוטה היא הלצה."},{"u":11,"n":10,"t":"בא אל אבותיו","m":"נפטר, הלך לעולמו, מת, בר- מינן.","e":"אברהם אבינו בא אל אבותיו בעודו בן 175 שנים דאז."},{"u":11,"n":11,"t":"בא על שכרו","m":"קיבל תמורה על מעשיו הטובים, השתכר בגין עבודתו.","e":"גילה באה על שכרה בעת קבלת תעודת ההצטיינות על התנדבותה בעמותה המסייעת לנפגעי פעולות האיבה."},{"u":11,"n":12,"t":"באיבו","m":"בצעירותו, בתחילתו.","e":"המחשבה על הילד התמים אשר נקטף באיבו מעציבני מאד."},{"u":11,"n":13,"t":"באישון לילה","m":"בשעה מאוחרת בלילה.","e":"אורנה ומשה קבעו להיפגש באישון לילה על-מנת להאזין לקולות הצרצרים."},{"u":11,"n":14,"t":"בבת עיני","m":"יקר לי מכל.","e":"לא אחת, אמי אמרה לי כי אני בבת עיניה. היום, כאם לשלושה ילדים, אני מבינה טוב יותר את המשמעות של דבריה."},{"u":11,"n":15,"t":"בגילופין","m":"בשכרות.","e":"עינת נהגה בגילופין ובכך סיכנה את כל היושבים ברכבה."},{"u":11,"n":16,"t":"גאה","m":"התרומם, עלה, טיפס.","e":"לאחר סופות הגשמים הנהר גאה על גדותיו."},{"u":11,"n":17,"t":"גבה לבו","m":"התגאה, התייהר, התרברב, התהדר, השתחצן.","e":"אביו של משה גבה לבו על כך שבנו קיבל את אות מהנדס החלל."},{"u":11,"n":18,"t":"גרגרן","m":"בעל תאוות אכילה או שתייה.","e":"לא אחת גרגרנותו של פו הדוב עלתה לו ביוקר."},{"u":11,"n":19,"t":"דאבון","m":"צער גדול.","e":"חשתי דאבון כן כשראיתי את פיצי, חתולתי האהובה, שוכבת פצועה בצד הכביש."},{"u":11,"n":20,"t":"דברי סרק","m":"דברי הבל, דברים חסרי תוכן, דיבורים בעלמא.","e":"שכנתי נורית מרבה להשמיע דברי סרק ולכן איני נהנית כלל וכלל במחיצתה."},{"u":11,"n":21,"t":"דחי","m":"כישלון, מעידה, תקלה, צרה.","e":"רנן הולך עתה מדחי אל דחי ואינו מצליח להגיע להישגיו משכבר הימים."},{"u":11,"n":22,"t":"דחק את רגליו","m":"סילק אותו כדי לתפוס את מקומו.","e":"יוסי, עוזר המאמן של אלי, דחק את רגליו כדי לרשת את כס האימון."},{"u":11,"n":23,"t":"האביס","m":"האכיל במזון רב מעבר לדרוש, הלעיט, פיטם.","e":"מעל 90% מכלל תוצרת הדגנים בישראל משמשת להאביס חיות המשק."},{"u":11,"n":24,"t":"האדיר","m":"שיבח, הילל, קילס, הגביר, הגדיל, העצים.","e":"בעת ראיון העבודה בחרתי במודע להאדיר את ניסיוני הפיקודי בצה\"ל על-מנת, לטעמי, להגדיל סיכויי להתקבל למשרה הנחשקת."},{"u":11,"n":25,"t":"האנשה","m":"ייחוס תכונות אנושיות לבעלי חיים או לחפץ.","e":"בהצגה שצפיתי חשתי בליבי כי אחד החפצים המואנש גרם לי להרגיש את מחשבותיו, את רגשותיו ובהתנהלותו כאדם לכל דבר ועניין."},{"u":11,"n":26,"t":"הבכיר","m":"הבשיל מוקדם מן הצפוי.","e":"ההשלכות הכלכליות של הבכרת החלק הארי מן הפירות במושב בו אני גר אינן חיוביות כלל וכלל."},{"u":11,"n":27,"t":"הגיע לעצה","m":"מלאו לו חמישים שנה.","e":"אבי הגיע לעצה ולכן חגגנו לו במסעדה בנוכחות מקורביו, לרבות בני משפחתי."},{"u":11,"n":28,"t":"הדום","m":"שרפרף, כיסא נמוך.","e":"המלך התיישב על כסאו המפואר וציווה על משרתו להביא לו לאלתר את ההדום לטובת מנוחת כפות רגליו."},{"u":11,"n":29,"t":"הדליף","m":"גילה למישהו דבר שהיה אמור להישאר חסוי, העביר מידע חסוי לגורמים בלתי מורשים.","e":"בשב\"כ נחקרת האפשרות כי מקורות יודעי דבר הדליפו לתקשורת פרטים על אודות אחד הנחקרים."},{"u":11,"n":30,"t":"הוליך שולל","m":"השלה, רימה.","e":"חברתי, כך אני חשה כעת, הוליכה אותי שולל כאשר גרמה לי לחשוב כי נטוס יחדיו לטיול בדרום אמריקה."},{"u":11,"n":31,"t":"הסביר פנים","m":"האיר פנים, התנהג בצורה אדיבה ומנומסת.","e":"המארחת החייכנית, בכניסתנו למסעדה, הסבירה פנינו ולכן הרושם הראשוני שנוצר לי הוא מצוין."},{"u":11,"n":32,"t":"הסתאב","m":"הזדהם, התלכלך, הפך מושחת.","e":"ציפור \"לחשה\" לי כי ממשרדו של ראש-הממשלה \"נידף\" ריח רע שכן פעילותו המסואבת \"חצתה\" כל גבול אפשרי."},{"u":11,"n":33,"t":"העלה ארכה","m":"הבריא, רופא.","e":"פצעיי הכואבים שנגרמו כתוצאה מנפילתי מהעץ העלו ארכה, אני מתנחם בכך."},{"u":11,"n":34,"t":"וולגרי","m":"גס, המוני, בוטה, שהתנהגותו אינה מעודנת, גס-רוח, פראי, חסר-תרבות.","e":"הקמפיין הוולגרי של חברת האופנה צונזר בגלל החשש מהשפעתו הרעה על בני הנוער."},{"u":11,"n":35,"t":"וורבאלי","m":"מילולי.","e":"יכולתו הוורבאלית יוצאת- הדופן של אבנר, ביחס לבני גילו, מבליטה אותו."},{"u":11,"n":36,"t":"זאטוט","m":"תינוק, עולל, ולד, שובב, פרחח.","e":"תאומיי הזאטוטים אינם נחים ולו לרגע קט."},{"u":11,"n":37,"t":"זוטר","m":"קטן, פעוט, מינורי, שולי.","e":"\"חייל זוטר!\", הטיח המפקד באחד מחייליו."},{"u":11,"n":38,"t":"זעק חמס","m":"התנגד, גינה, מחה בגין תופעה שאינה נראית לו.","e":"לא אחת קבוצות שונות של מפגינים מוצאות עצמן זועקות חמס בגין יוקר המחייה הבלתי נסבל, בישראל."},{"u":11,"n":39,"t":"זרק בו מרה","m":"החמיר עמו, התנהג כלפיו בצורה קשה מאוד.","e":"המשמעת הרופפת של טל, אחד השחקן הבכירים בקבוצה, הובילה את מאמנו לזרוק בו מרה, ולו כדי להחזירו לתלם."},{"u":11,"n":40,"t":"חדל אישים","m":"שאינו מוצלח.","e":"מדוע את \"מבזבזת\" את משאבייך על חדל אישים זה?"},{"u":11,"n":41,"t":"חורשף","m":"ארטישוק.","e":"מוצאו של החורשף הינו במערב הים-התיכון."},{"u":11,"n":42,"t":"חיבק אשפתות","m":"אדם רעב חסר אמצעים להשגת אוכל ושתייה החי בסביבת פחי האשפה על-מנת ללקט מזון.","e":"הביקורת המושמעת בדבר ניצולי השואה החיים בתת- תנאים לגיטימית. תמונת אבנר, ניצול השואה, המחבק אשפתות בקרבת בית הוריי, אינה נמחקת מזיכרוני."},{"u":11,"n":43,"t":"חידלון","m":"אבדון, מוות.","e":"התנהלותה חסרת האחריות של נגידת הבנק עלולה להוביל לחידלון מוחלט של המשק הישראלי."},{"u":11,"n":44,"t":"טיכס עצה","m":"התייעץ.","e":"לאחר שסיוון התייאשה כליל החליטה לטכס עצה עם אדווה, יועצת הלימודים הבכירה באוניברסיטה."},{"u":11,"n":45,"t":"טמיר","m":"נסתר, סודי, פלאי, נשגב.","e":"ישנם הטוענים כי בספר הספרים, התנ\"ך, רב הטמיר על הגלוי."},{"u":11,"n":46,"t":"ייבום","m":"נישואי אדם לאלמנת אחיו.","e":"לא רק בימי קדם תופעת הייבום הייתה נפוצה."},{"u":11,"n":47,"t":"ידה","m":"השליך, זרק.","e":"תופעת ידוי האבנים לעבר חיילי צה\"ל, תהא הסיבה אשר תהא, מגונה בעיניי."},{"u":11,"n":48,"t":"ירד לסוף דעתי","m":"הבין אותי היטב.","e":"אינני מצליח לרדת לסוף דעתך, דבריך מבלבלים אותי."},{"u":11,"n":49,"t":"ישיש","m":"זקן, קשיש, בא בימים.","e":"חנן כינה את אביו \"איש ישיש\" ופגע בו מאד."},{"u":11,"n":50,"t":"כבשת הרש","m":"לקיחה מאדם עני את הדבר היחידי שנותר לו.","e":"כישלונו העסקי של חביב הוביל אותו לרדת מכלל נכסיו, רק שעון נותר ברשותו, המזכרת היחידה מאביו, וכעת רוצים לקחת ממנו את כבשת הרש."},{"u":11,"n":51,"t":"כזב","m":"שקר, הונאה, משהו שאינו אמיתי.","e":"\"אל תאמינו לאף מילה שלו, הוא מכזב בכם!\"."},{"u":11,"n":52,"t":"ליבה","m":"בסיס, החלק המרכזי.","e":"כדי לקבל תעודת בגרות חייב כל תלמיד ללמוד את מקצועות הליבה ולהיבחן עליהם."},{"u":11,"n":53,"t":"ליטוש","m":"1. שפשוף, הברקה, השחזה. 2. עריכת שיפורים אחרונים.","e":"מידי שבוע היהלומן מלטש את היהלומים שברשותו."},{"u":11,"n":54,"t":"למצער","m":"לכל הפחות.","e":"המורה שלי לאפייה הוראתה לנו לשים למצער כפית וחצי כפיות מלח בשביל שטעם השוקולד יתעצם."},{"u":11,"n":55,"t":"לפלל","m":"לייחל, לקוות.","e":"פיללתי לעבור את המבחן בספרות למרות שלא התכוננתי אליו."},{"u":11,"n":56,"t":"מאוס","m":"בזוי, מעורר דחיה, לא רצוי יותר.","e":"מאסתי בעבודתי המשעממת, אלך לחפש עבודה אחרת."},{"u":11,"n":57,"t":"מאידך גיסא","m":"מצד שני.","e":"אמי מתלבטת אם לקנות כלב. מחד גיסא אני אוהבת כלבים, מאידך גיסא אחותי מפחדת מהם."},{"u":11,"n":58,"t":"מבאיש","m":"מדיף ריח רע, גורם לסירחון.","e":"הכלב בוני מבאיש, אני חייבת לקלח אותו לפני שהאורחים יבואו."},{"u":11,"n":59,"t":"מגלומניה","m":"שיגעון גדלות.","e":"ענת היא מגלומנית, חבריה דרשו ממנה להיפגש עם פסיכולוג על מנת לטפל בבעיה."},{"u":11,"n":60,"t":"מה הועילו חכמים בתקנתם","m":"אדם או גוף שניסה לתקן את המצב, אך התוצאה לא יצאה מוצלחת.","e":"המנקה שטפה את צדי מדרגות הבניין לאחר זמן רב שלא נשטפו, על מנת שלא יעלו עובש, אך במהלך השטיפה שברה את כדי הפרחים שנחו בצדי מדרגות אלו. ואני מהרהר, מה הועילו חכמים בתקנתם?"},{"u":11,"n":61,"t":"מוג לב","m":"פחדן, נרתע מסיכונים.","e":"כשרצינו לעלות על הר האוורסט, יוני התברר כמוג לב."},{"u":11,"n":62,"t":"מפורז","m":"שטח שאינו בשליטת שני הצדדים הלוחמים בו אין כלי נשק, אזור שאסורה בו נוכחות צבאית ואין להכניס אליו אמצעי לחימה.","e":"בגבול בין ישראל לסוריה קיים אזור מפורז."},{"u":11,"n":63,"t":"מרופט","m":"בלוי, קרוע.","e":"מדי העבודה שלי היו מרופטים ולכן ביקשתי מהמנהל שלי להחליף אותם."},{"u":11,"n":64,"t":"משבר","m":"גל גדול, נחשול.","e":"בחופי הוואי יש משברים רבים לעומת חופי הים התיכון."},{"u":11,"n":65,"t":"משענת קנה רצוץ","m":"אדם או דבר שאין לסמוך עליו.","e":"תליתי תקוות רבות בחברי שיסייע לי בביצוע העבודה, אך לצערי גיליתי שהוא משענת קנה רצוץ."},{"u":11,"n":66,"t":"נא","m":"מבושל למחצה.","e":"חלק ממרכיבי הסושי במסעדות יפניות הוא דג נא."},{"u":11,"n":67,"t":"נאה דורש ונאה מקים","m":"מן הראוי שאדם שבא בתביעות לאחרים, מן הראוי שיקיים בעצמו את מה שהוא דורש.","e":"לדעתי, מנהל צריך לדבוק בשיטת 'נאה דורש ונאה מקים'."},{"u":11,"n":68,"t":"נבכי נפש","m":"מעמקי הנפש.","e":"מומחיותו של פסיכולוג היא להבין את נבכי נפשו של האדם."},{"u":11,"n":69,"t":"נואל","m":"טיפשי, אווילי, עושה שטויות.","e":"אמא דרשה מתומר להפסיק להתנהג בצורה נואלית, ולהתנהג באופן בוגר."},{"u":11,"n":70,"t":"נוקד","m":"רועה צאן.","e":"ומישע מלך-מואב, היה נקד; והשיב למלך- ישראל מאה- אלף כרים, ומאה אלף אילים צמר (מלכים ב', ג, ד')"},{"u":11,"n":71,"t":"סאה","m":"יחידת נפח קדומה.","e":"בימי קדם מדדו 8 ליטרים בעזרת סאה, כיום מודדים 8 ליטרים בעזרת סמ''ק."},{"u":11,"n":72,"t":"סבב אותו בכחש","m":"רימה אותו, הטעה אותו.","e":"הנחש סבב בכחש את חווה כשגרם לה לאכול את התפוח."},{"u":11,"n":73,"t":"סובלנות","m":"נכונותו של אדם להכיר ולכבד דעות השונות משלו, טולרנטיות.","e":"בדיון שנערך בכיתה, נהגו הסטודנטים בסובלנות אחד כלפי השני."},{"u":11,"n":74,"t":"סומא","m":"עיוור, בעל חוסר יכולת לראות.","e":"כלב נחייה נועד לסייע לאדם עם לקות ובפרט לסומא."},{"u":11,"n":75,"t":"עומר","m":"אגודת שיבולים.","e":"בחג השבועות אימי הביאה לארוחה עומר לקישוט השולחן."},{"u":11,"n":76,"t":"עיר רפאים","m":"מקום נטוש, יישוב שננטש לחלוטין על ידי תושביו.","e":"בין הגורמים הנפוצים להפיכת יישוב לעיר רפאים הוא מלחמות."},{"u":11,"n":77,"t":"עלה בקנה אחד","m":"התאים, אין כל סתירה או התנגשות.","e":"הרעיונות שהצגתי בישיבה עלו בקנה אחד עם רוח החברה."},{"u":11,"n":78,"t":"עלטה","m":"חושך מוחלט, אפלה.","e":"בעלטה ניתן לראות טוב יותר את כוכבי השמיים."},{"u":11,"n":79,"t":"פוריטניות","m":"שמרנות, צניעות יתרה, קפדן וחומרני בענייני דת.","e":"הקהילה הדתית ניחנת ברמת פוריטניות גבוהה יחסית לשאר החברה הישראלית."},{"u":11,"n":80,"t":"פיק ברכיים","m":"רעידת הברכיים מפחד.","e":"לענבר יש פחד גבהים ולכן קיבלה פיק ברכיים כשעלתה לרכבת ההרים."},{"u":11,"n":81,"t":"פלורליזם","m":"השקפת עולם המקבלת צורות שונות של חשיבה וריבוי דעות.","e":"החברה הישראלית דוגלת בפלורליזם."},{"u":11,"n":82,"t":"צוהר","m":"חלון קטן, אשנב.","e":"ניגשתי לעמדת הדואר, והגשתי לפקיד טפסים דרך הצוהר."},{"u":11,"n":83,"t":"צידד","m":"תמך בדעתו של מישהו, היטה הצידה.","e":"בדיון שהתקיים היום בקורס, צידדתי בדעתו של יונתן."},{"u":11,"n":84,"t":"צעדי און","m":"הליכה בצעדים גדולים.","e":"החוקר צעד בצעדי און בחדר החקירות מול הנאשם."},{"u":11,"n":85,"t":"קורט","m":"מעט מאוד, כמות זעירה.","e":"אני נוהגת להוסיף קורט מלח לסלט שאני מכינה."},{"u":11,"n":86,"t":"קילס","m":"(1) לעג, גידף, קילל. (2) שיבח, הילל, החמיא.","e":"המורה קילס את התלמיד על תשובתו הנכונה."},{"u":11,"n":87,"t":"רדוקציה","m":"הפחתה, צמצום.","e":"שנת הבצורת פגעה בגידולי השדה ובכך גרמה לרדוקציה במכירות."},{"u":11,"n":88,"t":"רודף שררה","m":"כינוי לאדם המתאווה לכוח והשפעה.","e":"אלי רודף שררה ולכן אינו יכול לעבוד בתפקידים זוטרים."},{"u":11,"n":89,"t":"רפיון ידיים","m":"ייאוש, חולשה.","e":"עדן חשה רפיון ידיים כשחיפשה דירה וכל ניסיונותיה כשלו."},{"u":11,"n":90,"t":"רפה","m":"נחלש, התדלדל.","e":"חנן דיבר בקול רפה ולכן לא שמעתי את דבריו."},{"u":11,"n":91,"t":"שאה","m":"נהרס, נחרב, הוכחד.","e":"בית המקדש הראשון שאה בידי נבוכדנצר השני מלך בבל."},{"u":11,"n":92,"t":"שטח בקשתו לפניו","m":"התחנן, ביקש מאוד.","e":"האב שטח בקשתו לפני ילדיו בדבר מטלות הבית."},{"u":11,"n":93,"t":"שמחה לאיד","m":"הנאה מכישלון ומצרה של אחרים.","e":"כאשר איציק נכשל במבחן הוא חש כי חברו שמח לאידו במקום לזכות בתמיכתו."},{"u":11,"n":94,"t":"שרלטן","m":"נוכל, אדם המתחזה למומחה.","e":"תכנתו של חיים הכט נועדה לאתר שרלטנים ולהזהיר את הציבור."},{"u":11,"n":95,"t":"שררה","m":"שלטון, ממשל, שליטה, סמכות.","e":"עורך הדין התובע, סבור כי העונש הקל שניתן לנאשם במשפט התקבל בשל קשריו של הנאשם עם אנשי שררה."},{"u":11,"n":96,"t":"שתת","m":"נזל, איבד נוזלים.","e":"החייל הפצוע נשאר שותת דם עד שהגיעו לחלצו."},{"u":11,"n":97,"t":"תולדה","m":"תוצאה, מסקנה.","e":"המחקר המעמיק שנעשה בנושא הסרטן הביא לתולדות מעניינות."},{"u":11,"n":98,"t":"תזזית","m":"טירוף, שיגעון.","e":"בתקרית שהתפרצה היום בבית הספר, אחד הצדדים היה אחוז תזזית ולא שלט במעשיו."},{"u":11,"n":99,"t":"תשקיף","m":"(1) תחזית לימים הקרובים. (2) דוח, מסמך המפרט את מצבה הכלכלי של חברה לפני שהיא מנפיקה את מניותיה בבורסה. (3) מסמך המשמש להצעה של ניירות ערך לציבור.","e":"לפי תשקיף מזג- האוויר בימים הקרובים הטמפרטורות יעלו ויהיה חם מהרגיל."},{"u":11,"n":100,"t":"תתרן","m":"חסר חוש ריח.","e":"תתרנות יכולה להתאפיין בחוסר יכולת לחוש ריחות מסוימים או אובדן מוחלט של חוש ריח."},{"u":12,"n":1,"t":"אבוקה","m":"מתקן לנשיאת אש, לפיד.","e":"\"הבה נרימה נס ואבוקה, יחד פה נשירה, שיר החנוכה..\""},{"u":12,"n":2,"t":"אב טיפוס","m":"דגם ראשוני ניסיוני של מוצר תעשייתי חדש שמטרתו לחקור את המוצר החדש.","e":"בתהליך ייצור מוצרים גדולים כגון: מטוסים, ספינות, חלליות וכדומה, נבנים אבות טיפוס שונים, לרבות דגמים מוקטנים, וזאת על-מנת ללמוד על הבעיות הצפויות ולתקנן בעלויות נמוכות, יחסית."},{"u":12,"n":3,"t":"אביון","m":"עני, מרוד, דל, רש, בעל מעט מאד אמצעי מחייה, נזקק.","e":"אחת המצוות הנהוגות בפורים קרויה מתנות לאביונים, לפיה חלה על כל אדם החובה להעניק לפחות מתנה אחת, ללא פחות משני נזקקים."},{"u":12,"n":4,"t":"אבל וחפוי ראש","m":"תחושה קשה לאחר קבלת בשורה רעה או תשובה שלילית.","e":"ארנון השתחרר מצה\"ל אבל וחפוי ראש לאור כל הפגמים והמחדלים אשר נמצאו בפעילות המבצעית עליה פיקד."},{"u":12,"n":5,"t":"אבן דרך","m":"שלב חשוב בחייו של אדם, נקודת ציון משמעותית.","e":"אחת מאבני הדרך החשובות של מפקד סיירת מטכ\"ל לשעבר, אהוד ברק, הייתה פיקודו על כוחות היחידה שהשתלטה על מטוס הסבנה במאי 2791."},{"u":12,"n":6,"t":"אבן נגלה מעל לבו","m":"רווח לו, נשם לרווחה, הוקל עליו, השתחרר מהנטל, הופסקה דאגתו.","e":"לאחר שעודד חזר ארצה מטיולו בדרום אמריקה אבן נגלה מעל לבם של הוריו."},{"u":12,"n":7,"t":"אבן שואבת","m":"מקור להתעניינות ולמשיכה.","e":"לאחר זכייתו של הג'ודוקא אורי ששון במדליית הארד באולימפיאדת ריו 2016 ענף הג'ודו בישראל הפך להיות מעין אבן שואבת לבני הנוער ברחבי הארץ."},{"u":12,"n":8,"t":"אורגניזם","m":"גוף חי המסוגל להתרבות באופן עצמאי.","e":"אין זה פלא כי ניתן למצוא בשלולית החורף אורגניזמים רבים שכן זו רוויה במים."},{"u":12,"n":9,"t":"בגפו","m":"לבדו.","e":"הדייר המבוגר עלה בגפו את גרם המדרגות המוביל לביתו."},{"u":12,"n":10,"t":"בדמעות שליש","m":"בבכי מר, בדמעות ובתחנונים רבים.","e":"הילד בכה בדמעות שליש להוריו שיקנו לו את הצעצוע שרצה."},{"u":12,"n":11,"t":"בהול","m":"מידי, דחוף מאוד.","e":"בהגעתו לבית החולים, החייל הפצוע הועבר באופן בהול לטיפול נמרץ."},{"u":12,"n":12,"t":"בודק בציציות","m":"בדק באופן מעמיק.","e":"לפני קבלתו של יוני לתפקיד החשאי בדקוהו בציציות."},{"u":12,"n":13,"t":"בוסר","m":"לא בשל.","e":"הלימונים שקטפנו בחצר נראים בשלים, אולם כשחתכנו אותם גילינו שעודם בוסריים."},{"u":12,"n":14,"t":"בור","m":"חסר השכלה, נבער.","e":"מכיוון שאני בור בשפה האנגלית ביקשתי מחברי שיעזור לי לתרגם את המאמרים."},{"u":12,"n":15,"t":"גברה ידו","m":"ניצח.","e":"בקרב בין דוד לגלית, גברה ידו של דוד למרות השריון אותו לבש גלית."},{"u":12,"n":16,"t":"גדש","m":"צבר, ערם, מילא עד שלא נותר מקום.","e":"כשדני מזג את המיץ אל תוך הכוס הוא גדש את הכוס."},{"u":12,"n":17,"t":"גדש את הסאה","m":"הגזים בדיבורו או במעשיו, עבר את הגבול.","e":"יוסי גדש את הסאה בחוסר הכבוד שבו דיבר אל מורתו."},{"u":12,"n":18,"t":"דבר על לבו","m":"שכנע אותו, פייס אותו.","e":"אהרון היה אוהב שלום ורודף שלום. מעלתו הייתה בכך שכאשר היה רואה שני אנשים רבים, היה מדבר על לבו של כל אחד מהם וכך מביא לפיוסם."},{"u":12,"n":19,"t":"דידה","m":"צלע, הולך בצעדים אטיים ובהליכה לא בטוחה.","e":"בחזרה מאימון הכדורגל, קובי דידה בהליכתו בשל הכאבים ברגלו."},{"u":12,"n":20,"t":"דמגוג","m":"בעל יכולת שכנוע.","e":"כל פוליטיקאי צריך להיות דמגוג על מנת להעביר את מסריו ולשמור על מקומו."},{"u":12,"n":21,"t":"דרגש","m":"כיסא נמוך, ספסל.","e":"בפארק הנמצא מול ביתנו נוכל לראות דרגשים רבים שנועדו לנוחות התושבים."},{"u":12,"n":22,"t":"הוקיר רגליו","m":"נמנע מלבקר או להגיע, הדיר רגליו.","e":"אם ברצונך לשמור על כספך, עליך להוקיר את רגליך ממקומות בהם מתבצע שימוש במכונות הימורים ומשחקי מזל."},{"u":12,"n":23,"t":"הזם","m":"הפריך טענה של עד, הוכיח שהעד לא היה היכן שטען שהיה.","e":"במשפט שהתקיים השבוע, הנאשם טען שהוא חף מפשע מכיוון שבזמן האירוע הוא נכח בבית הוריו. אולם, עורך הדין התובע הזם את טענותיו של הנאשם."},{"u":12,"n":24,"t":"החכיר","m":"העביר בעלות על נכס או קרקע לתקופת זמן מוגבלת תמורת תשלום.","e":"איש העסקים מחכיר את אחת מדירותיו בתשלום של ₪000,5 לכל חודש."},{"u":12,"n":25,"t":"היה נביא בעירו","m":"הצליח במקום מושבו וזוכה להערכה מסביבתו.","e":"יפית הינה נביאה בעירה בתחום ההוראה המתקנת ולכן היא זוכה להצלחה רבה."},{"u":12,"n":26,"t":"הכביד את לבו","m":"הקשה את ליבו, התעקש, עמד בסירובו.","e":"בטרם שיחרר פרעה את בני ישראל ממצרים, הוא הכביד את לבו וסרב לבקשתו של משה לשחררם."},{"u":12,"n":27,"t":"הכה על חטא","m":"התחרט, ניחם, חזר בו.","e":"אימא הזהירה את רינת שלא לנהוג חזרה בלילה כשהיא עייפה. היא עלולה להירדם על ההגה ולהביא לתאונה, מה שיגרום לה להכות על חטא זה לאורך זמן."},{"u":12,"n":28,"t":"הלך עמו בקרי","m":"התנגד לו, היה לו למכשול.","e":"המורה החדשה שנכנסה לכיתה השתדלה בכל מאודה להיות נחמדה לתלמידים ולהצליח בתפקידה, אך התלמידים הלכו עמה בקרי."},{"u":12,"n":29,"t":"הלנת שכר","m":"עיכוב תשלום השכר לעובד.","e":"עובד אשר מעסיקו הלין את שכרו למעלה מתשעה ימים מהמועד שנקבע בחוק, רשאי להגיש תביעה נגד מעסיקו."},{"u":12,"n":30,"t":"הניח כספו על קרן הצבי","m":"סיכן את כספו.","e":"רון רצה לפתוח בעירו מפעל לסריגה. אולם, חברו הטוב טען שרון מניח את כספו על קרן הצבי מכיוון שעסק זה לא צפוי להצליח."},{"u":12,"n":31,"t":"הפרטה","m":"העברת בעלות מהמדינה לידיים פרטיות.","e":"הפרטת החברות הממשלתיות הביאה לפריחתן הכלכלית."},{"u":12,"n":32,"t":"הרים את קרנו","m":"שיבח אותו.","e":"ראש העיר הרים את קרנו של מנהל בית הספר שזכה בפרס חינוך והביא כבוד רב לעיר."},{"u":12,"n":33,"t":"ולד","m":"תינוק שנולד או בעל חיים בימיו הראשונים.","e":"הולד החדש שהצטרף למשפחתנו דומה במראהו בעיקר לאמי."},{"u":12,"n":34,"t":"זאב בעור כבש","m":"כינוי לאדם צבוע המעמיד פני תם.","e":"בעל חנות הרהיטים נהג כלפינו בגינוני נימוסים גבוהים מהרגיל על מנת שנשתכנע ונקנה אצלו. האופן שבו נהג כלפינו הביא אותי למסקנה שבעל החנות הוא זאב בעור כבש."},{"u":12,"n":35,"t":"זדון","m":"כוונה רעה, רשעות.","e":"דלילה גזרה את שערות ראשו של שמשון מתוך זדון."},{"u":12,"n":36,"t":"זחה דעתו עליו","m":"נחה עליו רוח של גאווה.","e":"לימור סיימה את לימודיה באוניברסיטה בהצטיינות יתרה ולמרות זאת לא זחה דעתו עליו."},{"u":12,"n":37,"t":"זכה מן ההפקר","m":"נהנה ממשהו שלא התאמץ עבורו.","e":"מכונת הפחיות במשרד התקלקלה ולא ניתן היה להכניס אליה מטבעות. עקב כך, כל מי שלחץ על כפתור בחירה קיבל פחית וזכה מן ההפקר."},{"u":12,"n":38,"t":"זלזל","m":"ענף דק, נצר, זמורה, זרד.","e":"בל\"ג בעומר, כאשר האש דועכת מומלץ להוסיף למדורה זלזלים רבים הנדלקים מהר ובכך מגדילים את הלהבה."},{"u":12,"n":39,"t":"חבורה","m":"פצע, חבלה נגע.","e":"אורי החליק ונפל במהלך רכיבה על אופניו. כתוצאה מכך הוא קיבל מספר חבורות ברגליו."},{"u":12,"n":40,"t":"חג","m":"הסתובב, סב.","e":"\"עוגה עוגה עוגה, במעגל נחוגה\"."},{"u":12,"n":41,"t":"חמד לצון","m":"התבדח, התלוצץ.","e":"עומר לא חשב על ההשלכות שיהיו לדבריו על חברו, הוא פשוט חמד לצון."},{"u":12,"n":42,"t":"חפוי ראש","m":"מבויש, נכלם, אבל.","e":"לאחר שהמן הוביל את מרדכי על הסוס, הוא חזר לביתו חפוי ראש."},{"u":12,"n":43,"t":"חתרני","m":"לא נאמן, פועל כדי לקלקל.","e":"הממשלה פועלת רבות על מנת לאתר ארגונים חתרניים הפועלים בקרבה."},{"u":12,"n":44,"t":"טוב מראה","m":"יפה תאר.","e":"מספרים על דוד המלך שהיה אדם טוב מראה."},{"u":12,"n":45,"t":"טפסר","m":"פקיד, לבלר, רשם.","e":"כשהגענו קיבל את פנינו הטפסר אשר רשם בקצרה את הסיבות בגינן ביקשנו להגיש תביעה."},{"u":12,"n":46,"t":"טרשים","m":"סלעים.","e":"שובר הגלים בים בנוי מטרשים רבים המונחים אחד על השני."},{"u":12,"n":47,"t":"ידעוני","m":"קוסם, מכשף, מעלה באוב, מגלה עתידות.","e":"\"אל תפנו אל האבת ואל הידענים\" (ויקרא יט', לא')"},{"u":12,"n":48,"t":"יושב על המדוכה","m":"מתלבט במחשבות.","e":"רונן סיים את שירותו הצבאי וניצב בפני צומת דרכים בחייו. כעת הוא יושב על המדוכה ותוהה האם כדאי לו להתחיל ללמוד או לטייל בחו\"ל."},{"u":12,"n":49,"t":"יצא מדעתו","m":"השתגע.","e":"האם יצאה מדעתה מרוב דאגותיה בעקבות ניתוק הקשר עם בנה השוהה בחו\"ל."},{"u":12,"n":50,"t":"כאחד האדם","m":"ככל האנשים, רגיל ביותר.","e":"שמשון הסביר לדלילה כי אם יאסרוהו במיתרים עשויים ממעיי בהמה, הוא ייחלש ויהיה כאחד האדם."},{"u":12,"n":51,"t":"כבול","m":"קשור, אסור באזיקים אין לו חופש פעולה, מוגבל.","e":"בעקבות היותי עובד מדינה, הנני כבול ביכולתי להביע את דעותיי הפוליטיות."},{"u":12,"n":52,"t":"לא מדבשך ולא מעקצך","m":"לא מן הטוב שבדבר ולא מן הרע שבו.","e":"כשרציתי לפתוח עסק וחיפשתי הלוואות, הבנקאי הסכים אולם, בריבית גבוהה מאוד. ובתגובה עניתי, \"לא מדבשך ולא מעקצך\"."},{"u":12,"n":53,"t":"לאבק","m":"לנקות מאבק.","e":"לקראת חג הפסח הקרב ובא, אמא החלה לאבק את כל השטיחים בביתנו."},{"u":12,"n":54,"t":"מוכיח בשער","m":"מבקר, מגנה, מטיף מוסר לאחרים.","e":"תפקידם של הנביאים בימים עברו היה להוכיח בשער."},{"u":12,"n":55,"t":"מונופול","m":"שליטה בלעדית בתחום מסוים.","e":"לחברת החשמל יש מונופול על אספקת החשמל במדינת ישראל."},{"u":12,"n":56,"t":"מוץ","m":"פסולת התבואה, קליפה.","e":"המוץ העוטף את גרגירי החיטה הוא דק מאוד ומתעופף בקלות ברוח."},{"u":12,"n":57,"t":"מטורזן","m":"מגונדר.","e":"טל הוא אדם מטורזן שתמיד נראה טוב."},{"u":12,"n":58,"t":"מכמורת","m":"רשת דייגים.","e":"רק לאחר שהגיעה הספינה ללב הים, זרקו הדייגים את המכמורת אל המים."},{"u":12,"n":59,"t":"מלגו ומלבר","m":"מבפנים ומבחוץ.","e":"אני מכיר את אחי התאום מלגו ומלבר."},{"u":12,"n":60,"t":"מנחה","m":"מתנה, דורון, שי.","e":"כשבקרתי את דודתי שילדה, הבאתי לה חליפת תינוק כמנחה לתינוק שנולד."},{"u":12,"n":61,"t":"מסוקס","m":"מחוספס.","e":"עורו של התנין הוא עור מסוקס."},{"u":12,"n":62,"t":"מפאת","m":"מפני, משום, בגלל.","e":"זמן הנסיעה של האוטובוס היה ארוך מן הרגיל, מפאת הפקק ששרר במרכז העיר."},{"u":12,"n":63,"t":"מתאבן","m":"(1) התקשה, הפך לאבן. (2) מנה הניתנת כמנת פתחה לפני הארוחה.","e":"המתאבנים שהוגשו לנו בבית המלון היו טעימים באופן מיוחד."},{"u":12,"n":64,"t":"מתווה","m":"קווים כללים לתיאור תכנית פעולה, סקיצה.","e":"המרצה אמר כי עלינו להכין את העבודה שניתנה בהתאם למתווה המופיע באתר הקורס."},{"u":12,"n":65,"t":"מתרס","m":"מחסום רחוב מאולתר.","e":"המפגינים הציבו מתרסים רבים על מנת להביא לחסימת הכביש."},{"u":12,"n":66,"t":"נער חצנו","m":"הסיר מעצמו את האחריות בנושא מסוים.","e":"אחיו של הנאשם בתביעה נער חצנו מכל מעשיו של הנאשם."},{"u":12,"n":67,"t":"נישא","m":"רם, גבוה.","e":"הר החרמון נישא ולכן ניתן לראותו מרחוק."},{"u":12,"n":68,"t":"סטטוס קוו","m":"המצב הקיים, כפי שהוא ללא שינוי.","e":"בעקבות חילופי המנהלים במפעל, נוצר חשש בקרב העובדים לשינוי תנאי ההעסקה שלהם. אולם, המנהל החדש טען ואמר כי ההנהלה לא תשנה את התנאים, אלא תשמור על סטטוס קוו."},{"u":12,"n":69,"t":"סיתת","m":"הקציע והחליק אבנים.","e":"בעל הבית עיצב בעצמו את הפסלים הניצבים בגינת ביתו. נראה כי הוא התברך בכישרון סיתות."},{"u":12,"n":70,"t":"ספיר","m":"אבן יקרה בצבע כחול.","e":"ספיר הייתה האבן היקרה ביותר במאות השנייה עד הרביעית לפני הספירה."},{"u":12,"n":71,"t":"עבדקן","m":"בעל זקן עבה.","e":"סבי ז\"ל היה עבדקן."},{"u":12,"n":72,"t":"עבר את מצותו","m":"הפר את פקודתו.","e":"חייל שעובר על מצוות המפקד עלול לקבל עיכוב ביציאתו הביתה."},{"u":12,"n":73,"t":"ערל לב","m":"אטום רגשית, אכזרי.","e":"החטופים שחזרו מהשבי סיפרו שחוטפיהם היו אנשים ערלי לב."},{"u":12,"n":74,"t":"פגרה","m":"חופשה.","e":"עבור תלמידי בית הספר, החופש הגדול הוא הפגרה הארוכה ביותר במהלך השנה."},{"u":12,"n":75,"t":"פובליציסטי","m":"עיתונאי.","e":"זמן קצר לאחר התרחשות הפיגוע, הגיעו למקום פובליציסטים רבים מארגונים שונים על מנת לסקר את המאורע."},{"u":12,"n":76,"t":"פרובוקציה","m":"התגרות.","e":"במשחקי כדורגל רבים, אוהדי קבוצה אחת מעוררים פרובוקציה בקרב אוהדי הקבוצה השנייה."},{"u":12,"n":77,"t":"פתלתל","m":"מפותל, מסובך.","e":"הכביש המוביל לכפר בו אנו גרים הוא ארוך ופתלתל."},{"u":12,"n":78,"t":"צרור","m":"חבילה.","e":"אמש הדוור הגיע לביתנו עם צרור מכתבים שנשלחו עבורנו."},{"u":12,"n":79,"t":"צג","m":"מסך.","e":"צגו של מכשיר הפלאפון הוא שביר מאוד ולכן יש לשמור עליו מכל פגע."},{"u":12,"n":80,"t":"צדודית","m":"פרופיל, מראה של אדם או אובייקט מין הצד.","e":"הצלם צילם את כלת השמחה בצדודיתה בתמונות רבות."},{"u":12,"n":81,"t":"קבורת חמור","m":"קבורה בזויה, שאינה מכבדת.","e":"\"קבורת חמור יקבר סחוב והשלך מהלאה לשערי ירושלים\" (ירמיה כב', יט')"},{"u":12,"n":82,"t":"קדר","m":"יוצר כלי חרס.","e":"אמנות הקדרות הינה עתיקה מאוד והייתה הדרך העיקרית להכנת כלי מאכל."},{"u":12,"n":83,"t":"קובלנה","m":"תלונה, טענה.","e":"העובד הגיש קובלנה כנגד מעסיקו שלא קיים את תנאי ההעסקה ע\"פ החוזה."},{"u":12,"n":84,"t":"קולמוס","m":"עט, מכשיר כתיבה, נוצה המשמשת לכתיבה.","e":"סופר הסת\"ם טבל את קולמוסו בדיו והחל לכתוב את המגילה על הקלף."},{"u":12,"n":85,"t":"ראוותן","m":"חושף, מציג, אוהב להראות את עצמו ולהרשים אחרים.","e":"מטרתם של חלונות הראווה היא לחשוף בפני העוברים ושבים את תכולת החנות."},{"u":12,"n":86,"t":"רביב","m":"גשם, מטר.","e":"בדרכנו הביתה ירד רביב חזק שהקשה על הראות."},{"u":12,"n":87,"t":"רגב","m":"גוש עפר.","e":"במהלך ההפסקה אורי וקובי הסתכסכו, ולכן אורי השליך רגבים לעברו של קובי."},{"u":12,"n":88,"t":"רדיקלי","m":"קיצוני.","e":"השינוי שחל השבוע במזג האוויר היה רדיקלי ביותר."},{"u":12,"n":89,"t":"שביב","m":"ניצוץ, רשף.","e":"כשהחלה רוני לדבר על ארוסה, עיניה ברקו והופיע בהן שביב."},{"u":12,"n":90,"t":"שבר את לבו","m":"צער אותו, פגע בו.","e":"המפקד שבר את לבו של החייל כאשר הענישו והשאירו שבת בבסיס."},{"u":12,"n":91,"t":"שווה נפש","m":"אדיש.","e":"אמי הינה אקטיבית ודומיננטית מאוד, זאת לעומת אבי שהינו שווה נפש לכל המתרחש."},{"u":12,"n":92,"t":"שוקק חיים","m":"מלא אנשים ופעילות.","e":"מי שיגיע לשוק העירוני המתקיים בכל יום רביעי ייחשף למקום הומה ושוקק חיים."},{"u":12,"n":93,"t":"שור!","m":"ראה, הבט, הסתכל.","e":"\"שורו הביטו וראו, מה גדול היום הזה...\""},{"u":12,"n":94,"t":"שכוי","m":"תרנגול, גבר.","e":"\"...הנותן לשכוי בינה להבחין בין יום ובין לילה\"."},{"u":12,"n":95,"t":"תאב","m":"רוצה, משתוקק, כמה, מתאווה.","e":"כאשר אישה הרה תאבה למאכל מסוים, צריך להשתדל ולהביא לה דבר מאכל זה."},{"u":12,"n":96,"t":"תוכו אכל וקלפתו זרק","m":"למד מהדברים הטובים שבדבר והתעלם מן הרע שבו.","e":"הסוהר לימד זכות על האסיר למרות פשעיו ולכן נאמר עליו תוכו אכל וקלפתו זרק."},{"u":12,"n":97,"t":"תור הזהב","m":"תקופה מוצלחת, ימי זוהר.","e":"מלכותו של שלמה המלך מתוארת כתור הזהב לעם היהודי, אף על פי שהסתיימה בחלוקת הממלכה."},{"u":12,"n":98,"t":"תדיר","m":"לעיתים קרובות, תכוף.","e":"אחותי מבקשת ממני לשמור על ילדיה באופן תדיר."},{"u":12,"n":99,"t":"תמיר","m":"גבוה, זקוף.","e":"מבין כל העצים בגינה, עץ הדקל הוא העץ תמיר ביותר."},{"u":12,"n":100,"t":"תעתוע","m":"הטעיה, הונאה.","e":"קוסמים משתמשים בתעתועי ראייה."},{"u":13,"n":1,"t":"אורחה","m":"קבוצת אנשים או בהמות הנעה בטור, מעין שיירה.","e":"\"וישבו לאכל לחם וישאו עיניהם ויראו והנה ארחת ישמעאלים באה מגלעד\" (ספר בראשית, פרק ל\"ז, פסוק כ\"ה)."},{"u":13,"n":2,"t":"אין נביא בעירו","m":"כינוי לאדם שדבריו אינם משפיעים על סביבתו הקרובה אלא רק לרחוקים ממנו, אדם שאינו זוכה להערכה בסביבתו הקרובה.","e":"אמנים ישראליים רבים חשים כי אין נביא בעירם ולכן קשה להם להצליח בארץ. זאת לעומת התחושות החיוביות שהם מעלים מביקורם בארצות אחרות בעולם."},{"u":13,"n":3,"t":"אין עליו עוררין","m":"אין לכך התנגדות, אין בכך הטלת ספק.","e":"אב המחנך את בנו לקבל את מצוות התורה דורש מבנו לקבל זאת ללא עוררין כלומר, ללא כל התנגדות."},{"u":13,"n":4,"t":"אין תוכו כברו","m":"מחשבותיו אינו תואמות את התנהגותו, צבוע, דו -פרצופי.","e":"איני אוהב להימצא בחברת יאיר שכן לא אחת גיליתי כי אין תוכו כברו, ועליי להודות שאני מתקשה לתקשר עמו."},{"u":13,"n":5,"t":"אפרקדן (או פרקדן)","m":"שכוב על גבו כך שידיו ורגליו פרוסים.","e":"משה שכב אפרקדן בחצר ביתו, תוהה ומביט השמימה."},{"u":13,"n":6,"t":"ארך אפים","m":"סבלן, סלחן, אינו ממהר לכעוס.","e":"\"אל רחום וחנון ארך אפים ורב חסד\" (שמות, לד', ו')."},{"u":13,"n":7,"t":"אשנב","m":"חלון, פתח קטן, צוהר.","e":"אין זה מקרי שהקורס אשנב למתמטיקה הינו מהקורסים הראשונים הנלמדים באוניברסיטה הפתוחה בקרב הסטודנטים הלומדים לתואר ראשון במתמטיקה."},{"u":13,"n":8,"t":"אשפה","m":"נרתיק לנשיאת חצים.","e":"סתיו התחפש בפורים לאינדיאני ולכן הצטייד בחץ וקשת, את חציו נשא באשפה הרתומה לגופו."},{"u":13,"n":9,"t":"בחרוק שנים","m":"התאפקות שלא לחשוף תחושות של רוגז וכעס רב.","e":"המורה חרקה שניה ולא העירה לתלמיד על התנהגותו השלילית."},{"u":13,"n":10,"t":"ביאה","m":"פרוזדור, כניסה, מבואה.","e":"באולם האירועים יש ביאה מפוארת מאוד המובילה למקום שבו מתקיימת החופה."},{"u":13,"n":11,"t":"ביבר","m":"גן חיות.","e":"ממשלת סין העניקה במתנה זוג דובי פנדה לביבר בחיפה."},{"u":13,"n":12,"t":"בין השיטין","m":"בין השורות, רמזי דברים שאינם נאמרים או נכתבים במפורש.","e":"מבין השיטין אני מבינה כי מנהל בית הספר מרוצה מאוד מעבודתי הרבה."},{"u":13,"n":13,"t":"ביעף","m":"במהירות רבה מאוד.","e":"\"תשרי חשון כסלו טבת עברו חלפו ביעף...\" (שנים עשר ירחים – נעמי שמר)."},{"u":13,"n":14,"t":"בית גנזים","m":"ארכיון.","e":"הכתב העתיק ביותר של ספר התורה, המכונה 'כתר ארם צובא' נמצא בבית הגנזים של היכל הספר, הנמצא במוזיאון ישראל בירושלים."},{"u":13,"n":15,"t":"בעטיו","m":"בגללו, באשמתו.","e":"היום איחרתי לעבודתי בשל תאונת דרכים שארעה ובעטיה חסמו את התנועה בכביש שבו אני נוסע."},{"u":13,"n":16,"t":"ברקיע השביעי","m":"בשיא האושר.","e":"מאז אירוסיה, נמצאת הילה ברקיע השביעי."},{"u":13,"n":17,"t":"גמחה","m":"שקע בקיר, המנוצל למטרות שונות.","e":"הדס השתמשה בגמחה שבקיר לצורך אחסון ספרי הלימוד שלה."},{"u":13,"n":18,"t":"גחון","m":"בטן.","e":"תנועתו של הנחש מתבצעת באמצעות זחילה על גחונו."},{"u":13,"n":19,"t":"גלה את אזנו","m":"חשף בפניו, סיפר לו סוד.","e":"יוני גלה את אזנו לרון וסיפר לו שהוא מחבב את הילה."},{"u":13,"n":20,"t":"גפיים","m":"כל אחד מאיברי התנועה המחוברים לגב: הידיים והרגליים בבני אדם, כנפיים וסנפירים בבעלי חיים.","e":"הנחש הוא בעל חיים חסר גפיים."},{"u":13,"n":21,"t":"ד' אמות","m":"מקום מצומצם, הסביבה הקרובה לאדם.","e":"כאשר מבקרים אדם החולה במחלה מדבקת, מומלץ לעמוד לפחות במרחק של ד' אמות ממנו."},{"u":13,"n":22,"t":"דשן","m":"(1) שופע, מלא, פורה. (2) מרוצה מעצמו.","e":"השנה ירד גשם רב ולכן היבול בשדותינו דשן ורענן."},{"u":13,"n":23,"t":"השיא עצה","m":"ייעץ לו.","e":"דוד נמצא בצומת דרכים בחייו, הוא מחפש אדם אשר ישיא לו עצה מתאימה."},{"u":13,"n":24,"t":"התכתש","m":"נאבק, מתקוטט.","e":"ירין ושלומי התכתשו ביניהם באופן אלים במיוחד ולכן הושעו מבית הספר."},{"u":13,"n":25,"t":"האוחז ביד","m":"כינוי למי שהכוח נמצא בידו.","e":"אלון נבחר לראשות המפלגה, אך ידוע שעמיר הוא האוחז ביד ומשפיע על התנהלותה."},{"u":13,"n":26,"t":"האיץ","m":"הגביר מהירות, החיש, דרבן.","e":"עומר התעכב בהעתקת ההסבר מהלוח ולכן המורה האיצה בו."},{"u":13,"n":27,"t":"האריך אפו","m":"נמנע מלכעוס ונוהג בסבלנות.","e":"אמא האריכה אפה כאשר בנה הקטן נכנס ולכלך את הבית במהלך שטיפת הרצפה."},{"u":13,"n":28,"t":"הגיעו לעמק השוה","m":"הגיעו להסכם, התפשרו.","e":"לאחר זמן רב שאני ושרון לא דיברנו, היום שוחחנו בינינו והגענו לעמק השוה."},{"u":13,"n":29,"t":"הדיר","m":"הסיר, מנע.","e":"ראש העיר ביצע עברה פלילית ולכן בית המשפט הדיר אותו מתפקידו."},{"u":13,"n":30,"t":"הומוגני","m":"אחיד.","e":"כל תלמידי שכבת יב' הומוגנים בדעתם לגבי מיקום מסיבת הסיום."},{"u":13,"n":31,"t":"הזדככות","m":"היטהרות, הפיכה לנקי.","e":"ליאור הביע חרטה על מעשיו וטען בפני מכריו כי חש בליבו תחושת הזדככות."},{"u":13,"n":32,"t":"הכה גלים","m":"עורר עניין והתרגשות, עורר תגובות.","e":"השמועה על הזמר המפורסם מחו\"ל המגיע לביקור בישראל התפרסמה במהרה והכתה גלים רבים."},{"u":13,"n":33,"t":"הלין","m":"(1) התלונן. (2) עיכב, השהה. (3) הכניס לביתו אורח ללינה.","e":"המעסיק הלין את השכר לעובדיו ולכן רבים מהם החליטו להתפטר."},{"u":13,"n":34,"t":"ויזואלי","m":"חזותי.","e":"כאשר רוצים ללמד ולהעביר ידע בדרך מעניינת, מומלץ להשתמש בעזרים ויזואליים שונים."},{"u":13,"n":35,"t":"זב","m":"נטף, נזל.","e":"ניב נפל מאופניו באמצע הרכיבה וקיבל מכה בברכו. כתוצאה מכך זב דם ברגלו."},{"u":13,"n":36,"t":"זבדה","m":"שמנת של חלב שהחמיץ.","e":"מהזבדה ניתן להכין חמאה."},{"u":13,"n":37,"t":"זחוח","m":"יהיר, גאוותן, מתנשא.","e":"מאז שיאיר נבחר לראש מועצת התלמידים, הוא מתהלך זקוף וזחוח."},{"u":13,"n":38,"t":"זיקה","m":"קשר.","e":"אבי משרת בקבע שנים רבות לכן יש לי זיקה חזקה מאוד לצבא."},{"u":13,"n":39,"t":"זיקוק","m":"טיהור, ניקוי.","e":"מים מינרליים הינם מים מזוקקים אשר עברו תהליך ניקוי מהחומרים הרעילים."},{"u":13,"n":40,"t":"חדגוני","m":"(1) משעמם. (2) בעל גוון אחד.","e":"ההרצאה שהתקיימה היום הייתה חדגונית, לא הצלחתי להבין מהי מטרתו של המרצה ולאן הוא חותר."},{"u":13,"n":41,"t":"חווק","m":"מדרגה, שלב בסולם.","e":"מרחקם של חווקי הסולם זה מזה אינם אחידים ולכן חששתי לטפס עליו."},{"u":13,"n":42,"t":"חורש מזימות","m":"זומם, מתכנן להרע.","e":"בלק חורש מזימות לעם ישראל ורצה לקללם. אולם, בכל פעם השתבשו האירועים ובמקום קללה עם ישראל קיבל ברכה."},{"u":13,"n":43,"t":"חנווני","m":"בעל חנות.","e":"סבי היה בעבר חנווני. הייתה לנו חנות למוצרי טואלטיקה."},{"u":13,"n":44,"t":"חריט","m":"ארנק.","e":"כאשר אני יוצאת לבלות עם חברותי אני מקפידה לקחת עימי את חריטי ואת מכשיר הטלפון הנייד."},{"u":13,"n":45,"t":"טבור הארץ","m":"מרכז הארץ.","e":"העיר תל אביב הינה טבור הארץ במדינת ישראל."},{"u":13,"n":46,"t":"טווה","m":"שזר, ארג.","e":"בעבר היו טווים חוטים באופן ידני. אולם, כיום יש מכונות שמבצעות פעולה זו באופן אוטומטי."},{"u":13,"n":47,"t":"טולרנטי","m":"סובלני.","e":"דור מגלה טולרנטיות כלפי חבריו לכיתה כאשר הם מביעים דעות המנוגדות לדעותיו."},{"u":13,"n":48,"t":"טרנספורמציה","m":"שינוי צורה, שינוי מבנה.","e":"לאחר ששוחחתי עם המרצה על עבודת ההגשה, ביצעתי טרנספורמציה של תכנון העבודה שלי."},{"u":13,"n":49,"t":"יאה","m":"ראוי, מתאים.","e":"אחד הכללים הנהוגים בכיתתנו הוא לדבר באופן יאה אחד כלפי השני."},{"u":13,"n":50,"t":"יגור","m":"פוחד, חושש.","e":"\"ואשר יגורתי יבוא לי\" (איוב, ג', כה')"},{"u":13,"n":51,"t":"כיד המלך","m":"ברוחב לב, בנדיבות.","e":"\"והשקות בכלי זהב וכלים מכלים שונים ויין מלכות רב כיד המלך\" (מגילת אסתר, א', ז')"},{"u":13,"n":52,"t":"כיסופים","m":"געגועים, כמיהה.","e":"יונתן, שעשה עלייה והגיע לארץ ישראל לבדו, חש כיסופים למשפחתו שנשארה לגור בחו\"ל."},{"u":13,"
