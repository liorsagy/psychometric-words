<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מילים לפסיכומטרי</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--mute:#6b7280;--acc:#2f5d8a;--acc2:#dbe7f3;--ok:#2e7d4f;--bad:#b3392f;--line:#e4e0d6;--warn:#c27a1a}
@media(prefers-color-scheme:dark){:root{--bg:#161a21;--card:#212733;--ink:#eef0f4;--mute:#9aa3b2;--acc:#7fb0e0;--acc2:#2b3a4e;--ok:#5fc08a;--bad:#e8786f;--line:#333a4a;--warn:#e0a550}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
#app{max-width:600px;margin:0 auto;padding:16px 16px 92px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--mute)}
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:500;margin-top:10px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg button{flex:1 1 auto;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
select,input[type=search],textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:90px;direction:ltr;font-size:12px}
label{font-size:14px;color:var(--mute);display:block;margin:10px 0 4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.fc{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.term{font-size:36px;font-weight:700;line-height:1.25}
.hint{color:var(--mute);font-size:14px;margin-top:12px}
.mean div{margin:5px 0;font-size:19px}
.ex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--mute);font-size:15px}
.row{display:flex;gap:10px}
.row .btn{margin-top:12px}
.opt{display:block;width:100%;text-align:right;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.q .term{text-align:center;margin:6px 0 14px}
.qm{font-size:19px;text-align:center;margin:6px 0 14px}
.qm div{margin:4px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0}
.item .h{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.item b{font-size:18px}
.tag{font-size:12px;color:var(--mute);white-space:nowrap}
.dots{letter-spacing:2px;color:var(--acc);font-size:12px;white-space:nowrap}
.item .d{margin-top:8px;font-size:15px}
.item .d .m{margin:3px 0}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-inline-start:6px}
.chip.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.ub{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;cursor:pointer}
.ub span:first-child{width:56px;color:var(--mute)}
.ub .t{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.ub .t i{display:block;height:100%;background:var(--acc)}
.ub .t i.m{background:var(--ok)}
.ub span:last-child{width:34px;text-align:left;color:var(--mute)}
.wk{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.wk i{display:block;background:var(--acc);border-radius:4px 4px 0 0;margin-bottom:3px;min-height:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mute);font-size:13px}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--acc);font-weight:700}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.sum b.big{font-size:44px;display:block;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script id="d" type="application/json">[{"u":1,"n":1,"t":"אבן משחזת","m":"אבן להשחזה ולחידוד של סכינים או חומרים קשים.","e":"כח פיזיקאי יודע כי על מנת להשחיז חומרים קשים במיוחד נכון להשתמש באבן משחזת רכה."},{"u":1,"n":2,"t":"אבנט","m":"(1) חגורה רחבה. (2) גלימה ששימשה את הכוהנים בזמן עבודתם בבית המקדש.","e":"בצבא הודו השימוש באבנט שכיח למדי."},{"u":1,"n":3,"t":"אברה","m":"(1) כנף הציפור. (2) איבר בגוף.","e":"חיים נחמן ביאליק תיאר בשיר \"לבדי\" את אברתה השבורה של השכינה כמטפורה להרס וחורבן היהדות."},{"u":1,"n":4,"t":"אגוצנטרי","m":"אדם המרוכז בעצמו יתר על המידה, זה הרואה עצמו במרכז.","e":"יכולתו של יוחנן לקטוע את דבריי ולדבר על עצמו, פעם אחר פעם, הובילה אותי לחשוב כי חברי הטוב אגוצנטרי."},{"u":1,"n":5,"t":"אד הוק","m":"במיוחד, לשם כך, הנוגע לעניין מסוים.","e":"כשממנים אדם המתמחה בנושא מסוים על מנת לטפל בבעיה מסוימת, אזי זהו מינוי אד הוק."},{"u":1,"n":6,"t":"אדוק","m":"נאמן לרעיון, מסור. דתי.","e":"האישה שפגשתי במסעדה הייתה דתייה אדוקה."},{"u":1,"n":7,"t":"אדן","m":"קורה תחתונה, קורת בסיס.","e":"הנחתי פרחים על אדן החלון."},{"u":1,"n":8,"t":"אדנית","m":"עציץ מוארך על אדן החלון או על מעקה מרפסת.","e":"באדניתי שתלתי צבעוני."},{"u":1,"n":9,"t":"אדרבא","m":"יתר על כן, להיפך.","e":"עובדים בני 50 פלוס אינם איטיים וחלשים יותר. אדרבא – הם העובדים הטובים והמנוסים ביותר."},{"u":1,"n":10,"t":"אדרה","m":"עצם של דג, שלד של דג.","e":"הסועד פשט את בשר הדג מאדרתו."},{"u":1,"n":11,"t":"אובה","m":"רוצה, מסכים, חפץ, חושק.","e":"\"ולא אבו האנשים לשמע לו\" (שופטים, יט', כה')."},{"u":1,"n":12,"t":"אובייקט","m":"(1) דמות, גוף עצם. (2) אדם או דבר שאליהם מכוונת פעולה מסוימת.","e":"המחבל היה אובייקט לחיסול."},{"u":1,"n":13,"t":"באור","m":"פירוש, הסבר, הבהרה.","e":"המורה לתנ\"ך הקדיש את השיעור לבאור הפסוק."},{"u":1,"n":14,"t":"בדחילו ורחימו","m":"ביראת כבוד ובאהבה, בזהירות רבה.","e":"כל צעד צריך לבצע בדחילו ורחימו ובפיקוח הדוק."},{"u":1,"n":15,"t":"בדיה","m":"שקר, כזב, דבר דמיוני ובדוי.","e":"אגדות הן סיפורי בדיה ורחוקות מהמציאות."},{"u":1,"n":16,"t":"בוהמה","m":"אורח חיים חופשי וסוער האופייני בעיקר לאומנים.","e":"רפסודה הוא כלי התחבורה האופייני לאנשי הבוהמה."},{"u":1,"n":17,"t":"בוחל","m":"מואס, מזלזל, מתעב, סולד.","e":"הוא לא בחל בשום עבודה כדי לפרנס את משפחתו."},{"u":1,"n":18,"t":"גא","m":"גאה, יהיר, מתרברב, שחצן, משתבח, מתפאר, מכיר בערך עצמו.","e":"הוא גא בעבודה שביצע."},{"u":1,"n":19,"t":"גבין","m":"גבה.","e":"תפקידם של הגבינים, להגן על העין מפני נזקים."},{"u":1,"n":20,"t":"גבן","m":"מי שעוסק בייצור של גבינה.","e":"הגבן בירושלים מייצר את הגבינות הטובות ביותר בארץ."},{"u":1,"n":21,"t":"דבקה לשונו לחכו","m":"נאלם דום, השתתק.","e":"מרוב התרגשות דבקה לשונו לחכו והצליח רק לסמן בידיו מה רצונו."},{"u":1,"n":22,"t":"דברים בגו","m":"יש טעם וסיבה לדבר.","e":"אם הוחלט לא לתת מידע על פרשה זו, סימן שיש דברים בגו."},{"u":1,"n":23,"t":"דה פקטו","m":"למעשה, מה שקורה בפועל.","e":"בישראל יש חוק האוסר על עישון במקומות ציבוריים אבל דה פקטו, הוא לא נאכף על ידי המשטרה."},{"u":1,"n":24,"t":"האפלה","m":"החשכה, עמום, הסתרה של מקום האור, הטלת סודיות.","e":"במלחמה האפלנו את בתינו בלילות כדי להסתיר את האור מפני האויב."},{"u":1,"n":25,"t":"הבא להרגך השכם להרגו","m":"לאדם מותר להתגונן ולהציל את חייו במחיר חיי מי שמסכן אותו.","e":"לפני הכניסה לשטח האויב, קיבלנו פקודה ממפקדנו שאמר \"הבא להרגך השכם להרגו\"."},{"u":1,"n":26,"t":"הבל הבלים","m":"שטויות, דברים בטלים.","e":"האם הוא העז לטעון כי לא נכח במקום אף על פי שכמה אנשים העידו שראו אותו שם? הבל הבלים!"},{"u":1,"n":27,"t":"הבניה","m":"(1) חיזוק, ביסוס. (2) הפיכת דבר לחלק בלתי נפרד של מבנה. (3) בניה. (4) תהליך סינתזה של תרכובות.","e":"בתחום העוסק בתאוריה הסוציולוגית, בין היתר, יש אזכור למונח \"הבניה חברתית\"."},{"u":1,"n":28,"t":"הגב","m":"תגובה לא רצונית של הגוף על גירוי, רפלקס.","e":"הסועד אכל גבינה מקולקלת וכתוצאה קיבל הגב הקאה."},{"u":1,"n":29,"t":"והא ראיה","m":"זאת הראיה, זאת ההוכחה.","e":"יידיש היא אחת השפות העשירות באוצר מילותיה והא ראיה נמצאת בארכיון של מילון היידיש הגדול."},{"u":1,"n":30,"t":"זבורית","m":"קרקע או סחורה ממין גרוע.","e":"רווחיו של החקלאי ירדו משמעותית כי רכש קרקע זבורית ולכן לא צמח יבול."},{"u":1,"n":31,"t":"חבלי לדה","m":"קשיים המופיעים בתחילתה של דרך חדשה.","e":"בשנותיה הראשונות למדינת ישראל היו חבלי לדה לא קלים."},{"u":1,"n":32,"t":"חגווי","m":"סדק, נקיק.","e":"מי הגשמים עברו דרך חגווי הסלעים."},{"u":1,"n":33,"t":"חגור","m":"כלל הציוד שחייל נושא על גופו.","e":"החייל אחראי על תקינות חגור ו."},{"u":1,"n":34,"t":"חדשים לבקרים","m":"דברים החוזרים ומתרחשים לעיתים קרובות ביותר.","e":"הילד החל להתפרע חדשים לבקרים עד שהוריו החליטו לקחתו לבדיקה מעמיקה."},{"u":1,"n":35,"t":"טבולה רסה","m":"'לוח חלק', חסר ידע.","e":"תינוקות נולדים טבולה רסה ואין להם שום ידע מוקדם."},{"u":1,"n":36,"t":"טוגה","m":"גלימה לבנה חגיגית שלבשו הרומאים והייתה עשויה מאריג דק, נתלתה מעל הכתף והקיפה את הגב.","e":"בחג הפורים, כאשר התחפשתי לרומאי, תחפושתי כללה טוגה."},{"u":1,"n":37,"t":"יבול","m":"תבואה, תנובת הפירות, תוצרת פרי.","e":"השנה יבול הבננות היה מזערי."},{"u":1,"n":38,"t":"יהרג ובל יעבור","m":"דבר שלא יעשה אף פעם.","e":"רצח הוא מעשה שיהרג ובל יעבור!"},{"u":1,"n":39,"t":"יוגב","m":"עובד אדמה, איכר, חקלאי.","e":"היוגב דישן את אדמתו."},{"u":1,"n":40,"t":"כאן קבור הכלב","m":"זה מקור הבעיה, זאת הסיבה, זהו עצם העניין.","e":"דן הודה בפני אביו כי מימיו לא אהב את הדוד בני. אביו ענה לו: \"כאן קבור הכלב\"."},{"u":1,"n":41,"t":"כבד לשון","m":"שמתקשה בדיבור, מגמגם.","e":"\"כי כבד פה וכבד לשון אנכי\" (שמות, ד', י')"},{"u":1,"n":42,"t":"כביר","m":"גדול מאוד.","e":"ניסיון שהתברר כהצלחה כבירה."},{"u":1,"n":43,"t":"כבש","m":"משטח משופע שמשמש לעלייה ולירידה, מעין רמפה. גם","e":"במרבית המוסכים המורשים בישראל ניתן למצוא כבש המשמש להעלאת ולהורדת הרכב בעת הטיפול."},{"u":1,"n":44,"t":"לא מאהבת מרדכי, אלא משנאת המן","m":"המעשה נעשה לא מתוך חיבה לאדם אלא משנאה לאויבו.","e":"במלחמת העולם השנייה ברית המועצות הצטרפה לבעלות הברית ללחום נגד גרמניה לא מאהבת מרדכי, אלא משנאת המן."},{"u":1,"n":45,"t":"לא מניה ולא מקצתיה","m":"כלל וכלל לא, לא היה ולא נברא.","e":"לא ידעתי על עניין זה לא מניה ולא מקצתיה."},{"u":1,"n":46,"t":"מאוי","m":"רצון פנימי, תאווה, חשק.","e":"מאויו של אדם תלויים בחברה בה הוא גדל."},{"u":1,"n":47,"t":"מאום","m":"כלום.","e":"\"אל תשלח ידך אל הנער ואל תעש לו מאומה\" (בראשית, כב', יב')."},{"u":1,"n":48,"t":"מארה","m":"קללה.","e":"המכשפה הטילה מארה על היפיפייה הנרדמת שבעקבות כך ישנה מאה שנים."},{"u":1,"n":49,"t":"מבכר","m":"מועדף, שיש לו יתרון.","e":"האתלט מישראל מבכר משאר האתלטים."},{"u":1,"n":50,"t":"מבריך","m":"(1) מושיב (גמל) על הברכיים. (2) מכופף ענף המחובר לצמח ומכסה אותו אדמה על מנת שיצמיח בה שורשים וענפים חדשים.","e":"\"ויברך הגמלים מחוץ לעיר אל באר המים\" (בראשית, כד', יא')."},{"u":1,"n":51,"t":"מברק","m":"הודעה דחופה קצרה ומהירה הנשלחת בדרך כלל על ידי טלגרף או בדואר.","e":"לפני פרוץ מלחמת יום הכיפורים נשלח מברק לראש ממשלת ישראל שעומדת לפרוץ מלחמה."},{"u":1,"n":52,"t":"מג","m":"מכשף, קוסם.","e":"הודיני היה המג הגדול בכל הזמנים והתמחה בעיקר בלהטוטי קלפים."},{"u":1,"n":53,"t":"מגבב","m":"מונח בערמה בלי סדר.","e":"בגדיה מגבבים בחדר על מיטתה."},{"u":1,"n":54,"t":"מגדל שן","m":"(1) כינוי למקום רם ומבודד. (2) התרחקות מהציבור והתבודדות מתוך יהירות והתנשאות.","e":"כלא אלקטרז היה מגדל שן ובכל זאת הצליחו לברוח ממנו."},{"u":1,"n":55,"t":"מגדן","m":"ממתק, מאפה מתוק.","e":"ביום ההולדת הילדים קיבלו מגדנים."},{"u":1,"n":56,"t":"מגדף","m":"אומר דברי בוז מעליבים.","e":"העם גדף את שר האוצר הנוכחי ובעקבות זאת הוא התפטר."},{"u":1,"n":57,"t":"מגופה","m":"פקק רחב, מסתם, שסתום.","e":"מגופת החבית נפלה וכל הנפט נשפך."},{"u":1,"n":58,"t":"מגנת לב","m":"שברון לב, צער רב.","e":"הודעתך גרמה לי למגנת לב ואין מילים להביע את צערי."},{"u":1,"n":59,"t":"מגל","m":"מכשיר יד לקצירת תבואה שסכינו מעוקמת כמו קשת.","e":"\"שלחו מגל כי בשל קציר\" (יואל, ד', יג')."},{"u":1,"n":60,"t":"נאלם","m":"השתתק, נעשה אילם, נדם.","e":"האנשים נאלמו למשמע קול הנפץ."},{"u":1,"n":61,"t":"נאר","m":"מקולל.","e":"אדם זה נאר משנולד."},{"u":1,"n":62,"t":"נברשת","m":"מנורה מעוטרת וגדולה הנתלית מהתקרה.","e":"בביתם תלויה נברשת עתיקה מאוד שעדיין מאירה."},{"u":1,"n":63,"t":"נגוז","m":"חולף, עובר מהר.","e":"מצב רוחה המדוכדך נגוז בהשמעה את הבשורה המשמחת."},{"u":1,"n":64,"t":"נדבך","m":"(1) שורה של אבנים או לבנים או קורות בבניין. (2) אדם,מעשה או רעיון כל שהוא עליו נבנים דברים.","e":"\"ונדבך של אבנים היה בין כל אחת ואחת\" (משנה)."},{"u":1,"n":65,"t":"סבב בכחש","m":"מרמה, מטעה, מוליך שולל.","e":"מעבידו סובבו בכחש עד שהתגלו שקריו במקרה."},{"u":1,"n":66,"t":"סבוך","m":"מסובך, שקשה להתירו, מפותל ומשולב.","e":"היער היה סבוך ולכן היה קשה לצאת ממנו."},{"u":1,"n":67,"t":"סבוניה","m":"קופסה לחתיכות סבון.","e":"בכיור המטבח סבוניה ושם מונח סבון הכלים."},{"u":1,"n":68,"t":"סברה","m":"דעה, הנחה, השערה.","e":"מחקרו מתבסס על סברות שטרם הוכחו."},{"u":1,"n":69,"t":"עבד כי ימלוך","m":"אדם פשוט שקבל סמכות והחל להתנהג בגבהות לב.","e":"מאז שהוא קיבל את המינוי הוא מתנהג כמו עבד כי ימלוך, כל כך מהר הוא שכח מהיכן הוא בא."},{"u":1,"n":70,"t":"עגורן","m":"מנוף.","e":"באתר הבנייה יש עשרה עגורנים."},{"u":1,"n":71,"t":"עדית","m":"מין משובח של קרקע או סחורה.","e":"שוקולד בלגי הוא העדית שבעדית בתחום השוקולד."},{"u":1,"n":72,"t":"עוגב","m":"חושק, מחזר, מאהב, חומד.","e":"בעל החנות עוגב ללקוחה הזו זמן מה מכיוון שלא ידע כי היא אישה נשואה."},{"u":1,"n":73,"t":"פאתי","m":"שולי.","e":"הוא גר בפאתי העיר רחוק ממרכזה ההומה."},{"u":1,"n":74,"t":"פגיון","m":"כלי נשק חד הארוך מסכין וקצר מחרב.","e":"בתקופת הרנסנס פגיונות היו בשימוש כמעט אצל כל אדם מכיוון שהיה נשק קל לנשיאה ושקל להסתירו."},{"u":1,"n":75,"t":"פדנט","m":"קפדן עד כדי הפרזה, דקדקן.","e":"מחנך הכיתה פדנט ועוסק בקוצו של יוד."},{"u":1,"n":76,"t":"פה מפיק מרגליות","m":"מטיב לנאום ולדבר, מדבר דברי טעם וחוכמה.","e":"הרצאתו של הפרופסור לפילוסופיה הייתה מעניינת, פה מפיק מרגליות."},{"u":1,"n":77,"t":"פואמה","m":"יצירה ספרותית ארוכה הכתובה במתכונת של שיר, לרוב בחרוזים המתבססת על סיפורי עלילה.","e":"חוקר הספרות התלבט האם המסמך שהוא חוקר הינו פואמה או שיר והכריע לטובת הפואמה מכיוון שהיצירה מכילה חרוזים."},{"u":1,"n":78,"t":"פוחח","m":"שובב, פוחז.","e":"נער זה פוחח ולכן הושעה מבית הספר."},{"u":1,"n":79,"t":"צדיה","m":"כוונת זדון, כוונה רעה, מזימה.","e":"הוא פגע בו ללא כל צדיה וביקש סליחה."},{"u":1,"n":80,"t":"צדע","m":"צד המצח ליד האוזן.","e":"כאבים בצדע יכולים להיגרם מצוואר תפוס."},{"u":1,"n":81,"t":"קב","m":"(1) רגל תותבת, מקל עזר לצולע. (2) מידת נפח קדומה (קצת יותר משני ליטרים). (3) מקלל.","e":"נתנו קביים לפצוע על מנת שיוכל ללכת."},{"u":1,"n":82,"t":"קבה","m":"בקתה, סוכה, אוהל.","e":"בנינו קבה לכבוד חג הסוכות."},{"u":1,"n":83,"t":"קבילה","m":"(1) תלונה, קובלנה. (2) הודעה לבית המשפט על הגשת תביעה.","e":"הקבילה הוגשה בתחילת החודש לבית המשפט."},{"u":1,"n":84,"t":"קבל עם ועדה","m":"בגלוי, בפרהסיה.","e":"האדון הצהיר קבל עם ועדה שהוא גנב מחנות התבלינים."},{"u":1,"n":85,"t":"קבס","m":"בחילה, גועל.","e":"המראות שראה במוזיאון המפוחלצים עוררו בו תחושת קבס."},{"u":1,"n":86,"t":"קבסתן","m":"מי שמעורר בחילה, מטריח הרבה.","e":"צריך הרבה כוחות נפשיים כדי להיות בקרבתו של קבסתן."},{"u":1,"n":87,"t":"רבוד","m":"(1) חלוקה לרבדים. (2) הנחת נייר פרגמנט או רדיד אלומיניום בתבנית אפייה, מדף בארון, מגירה וכו'.","e":"ריבדתי את המגירות והמדפים בארון המטבח החדש."},{"u":1,"n":88,"t":"רביד","m":"תכשיט לצוואר.","e":"היא קבלה רביד ליום הולדתה."},{"u":1,"n":89,"t":"רבתי","m":"גדולה – שם לוואי.","e":"ירושלים רבתי, היא בירת ישראל."},{"u":1,"n":90,"t":"שאון","m":"רעש, המולה.","e":"שאון העיר הלך ופסק עם רדת החשיכה עד כדי שקט חרישי."},{"u":1,"n":91,"t":"שאר בשר","m":"קרוב משפחה.","e":"אחי הוא שאר בשרי."},{"u":1,"n":92,"t":"שבכה","m":"מחיצה מסורגת.","e":"השבכה הפרידה בין האסיר לבני משפחתו."},{"u":1,"n":93,"t":"שבע רצון","m":"מרוצה.","e":"הלקוח שבע רצון מהמסעדה."},{"u":1,"n":94,"t":"שבשבת","m":"מתקן המוצב במקום גבוה ומסתובב עם הרוח לקביעת כיוונה ועוצמתה.","e":"הרוח העזה סובבה את השבשבת במהירות."},{"u":1,"n":95,"t":"תאוה","m":"רצון חזק, תשוקה.","e":"תאותו לאוכל גרמה לו לעלות במשקל במהירות רבה."},{"u":1,"n":96,"t":"תאם","m":"(1) צירוף נעים של דברים(צלילים, צבעים, דעות ומנהגים) (2) התאמה, הסכמה הדדית בלעז: הרמוניה","e":"תאם הצלילים של התזמורת היה נהדר."},{"u":1,"n":97,"t":"תאניה","m":"אבל, בכי, יגון.","e":"תאניה יבכו על הנהרגים."},{"u":1,"n":98,"t":"תבן","m":"(1) קש מקוצץ או מפורר הנועד למאכל בהמה. (2) דבר חסר ערך.","e":"רק תבן הוא ואין לייחס לו חשיבות רבה."},{"u":1,"n":99,"t":"תברואה","m":"כלל האמצעים שמטרתם לשמור על בריאות הציבור.","e":"מימן גופרי נחשב לגז רעיל ביותר שיש בו סיכון תברואתי גדול."},{"u":1,"n":100,"t":"תגרה","m":"קטטה, ריב. פחד, מורא.","e":"פחד ותגרה אחזו בה למשמע הרעש הנורא."},{"u":2,"n":1,"t":"אוטונומיה","m":"שלטון עצמי, עצמאות בתחום מוגדר הפוטרת פקיד מכפיפות לפקיד בדרגה גבוהה יותר.","e":"בעבודה אני פועל באופן אוטונומי, הבוס לא מתערב בעבודתי."},{"u":2,"n":2,"t":"אוטופיה","m":"תוכנית, מקום, מדינה או מצב שהם אידיאליים ומושלמים אך אינם יכולים להתקיים במציאות.","e":"הרעיונות הדתיים של גן עדן הם אוטופים."},{"u":2,"n":3,"t":"אומד","m":"מעריך, משער.","e":"השמאי אמד את שווי הדירה."},{"u":2,"n":4,"t":"אומר דרשני","m":"מעורר שאלות, מצריך בדיקה.","e":"שתיקתו הלא אופיינית בעניין אומרת דרשני."},{"u":2,"n":5,"t":"אוניברסלי","m":"עולמי, כללי, מקיף הכל.","e":"הצורך של אדם בחברה הוא צורך אוניברסלי."},{"u":2,"n":6,"t":"אוצר","m":"(1) ממונה על המוצגים במוזיאון. (2) אוגר, שומר, אוסף.","e":"אוצר התערוכה נשא דברים בפתיחתה."},{"u":2,"n":7,"t":"אוצר בלום","m":"(1) אוצר מלא וגדוש. (2) כינוי לאדם בעל ידיעות רבות.","e":"ידידי מתמצא כמעט בכל נושא, ממש אוצר בלום."},{"u":2,"n":8,"t":"אור יקרות","m":"אור בהיר, אור נעים.","e":"נרות החנוכה באור יקרות."},{"u":2,"n":9,"t":"אור שבעת הימים","m":"אור חזק, שפע אור.","e":"\"ואור החמה היה שבעתים כאור שבעת הימים\" (ישעיהו, ל', כו')."},{"u":2,"n":10,"t":"אוריינות","m":"(1) היכולת לקרוא, לכתוב ולשלוט בשפה. (2) בקיאות, חריצות, למדנות.","e":"לפני שנים רבות יכול האוריינות הייתה חוקית רק למעמד האצולה."},{"u":2,"n":11,"t":"אורים ותמים","m":"כינוי למי או מה שזוכים לאמון מוחלט.","e":"מורי הוא האורים ותמים שלי."},{"u":2,"n":12,"t":"אושה","m":"רעש קל, רשרוש, רחש.","e":"לפי אושת העלים אני יודע שיש רוח בחוץ."},{"u":2,"n":13,"t":"בולמוס","m":"(1) תיאבון חולני, אכילה מופרזת. (2) עיסוק בדבר מתוך תאווה לא נשלטת.","e":"לאחר הצום דורית נתקפה בולמוס אכילה."},{"u":2,"n":14,"t":"בזיך","m":"ספל, קערית.","e":"מזגתי מרק אל תוך הבזיך."},{"u":2,"n":15,"t":"בחרות","m":"נעורים.","e":"בימי בחרותו הוא היה יפה תואר."},{"u":2,"n":16,"t":"בטל בששים","m":"ערכו זניח לעומת הכלל, כמות או עניין חסרי השפעה.","e":"הצלחתו של הזמר אנדי ויליאמס בטלה בששים לעומת הצלחתו של מייקל ג'קסון."},{"u":2,"n":17,"t":"ביוגרפיה","m":"חיבור או יצירה המספרת את קורות חייו של אדם.","e":"חוקרים מצאו כתבים עתיקים המתעדים את הביוגרפיה של אחד הפרעונים המצריים ובכך למדו עוד על אורך חייו."},{"u":2,"n":18,"t":"גברדין","m":"אריג שאינו חדיר למים המשמש להכנת מעילים וחליפות נגד גשם.","e":"התופרת השתמשה בגברדין למעילי ולכן לא היה חדיר למים."},{"u":2,"n":19,"t":"גד","m":"(1) מזל, אושר, הצלחה. (2) כוסברה.","e":"דרדס חסר מזל כונה בישגדא בסדרת הילדים דרדסים."},{"u":2,"n":20,"t":"גר","m":"נוכרי, זר, אינו יליד המקום.","e":"הגר היגרה עם משפחתה לפולין לטובת לימודי רפואה."},{"u":2,"n":21,"t":"דהוי","m":"שצבעו נחלש.","e":"לאחר הכביסה, החולצה דהתה ואיבדה מצבעה."},{"u":2,"n":22,"t":"דואלי","m":"זוגי, כפול, משותף לשניים, בעל שני היבטים, או אופי כפול.","e":"יחסה של אמי היה דואלי כלפיי, היא שמחה שאני נוסע לטייל ובו הזמן עצובה שאני נוסע לזמן ממושך."},{"u":2,"n":23,"t":"דוברה","m":"רפסודה, משטח של קורות עצים מחוברות ומושטות על פני המים להעברת סחורה וכדומה.","e":"משהתפרקה הדוברה אפסו סיכויינו לחצות את הנהר."},{"u":2,"n":24,"t":"הגמוניה","m":"שליטה, עליונות, עדיפות.","e":"ההגמוניה של הליכוד קיימת בארץ."},{"u":2,"n":25,"t":"הדריך את מנוחתו","m":"היה טרוד, משהו הפריע לו, הטריד (אחר), לא נתן שלווה","e":"פיטוריו של מר גרוסמן הדריכו את מנוחתו ולכן לא נרדם."},{"u":2,"n":26,"t":"הודאה","m":"התוודות, וידוי, גילוי.","e":"התקבלה הודאה מפי הנאשם במשפט ועל כך יקבל עונש מופחת."},{"u":2,"n":27,"t":"הוכחה","m":"(1) ראיה, עובדה שיש בה כדי לאשר סברה. (2) נזיפה, הטפת מוסר.","e":"הוכחה על התנהגות רעה חייבת להיעשות בבית הספר."},{"u":2,"n":28,"t":"הון","m":"(1) סכום כסף רב. (2) כלל הנכסים, האמצעים והכסף שיש ברשות אדם.","e":"הונו של ביל גייטס נמדד במיליארדים."},{"u":2,"n":29,"t":"הונאה","m":"הטעיה, מרמה, תחבולה.","e":"בעל החנות חשוד בהונאה בכך שמכר את אותו המוצר לאנשים שונים במחירים שונים."},{"u":2,"n":30,"t":"הוסיף נפך משלו","m":"תרם מעצמו.","e":"השחקנית הצעירה הוסיפה נפך משלה לעיצוב דמותה של הגיבורה."},{"u":2,"n":31,"t":"וירטואוז","m":"אמן מיומן מאוד שהגיע לשיאי שלמות טכנית במקצועו.","e":"אין ספק שבגיטרה החשמלית, ג'ימי הנדריקס היה וירטואוז."},{"u":2,"n":32,"t":"ונדטה","m":"גאולת דם, נקמה.","e":"בעולם הערבי ונדטה היא דבר נפוץ."},{"u":2,"n":33,"t":"זה לא כבר","m":"לא מזמן, לפני זמן קצר, לאחרונה.","e":"חזרתי זה לא כבר מטיול של כמה חודשים במזרח."},{"u":2,"n":34,"t":"חורין","m":"חיוור, לבנבן.","e":"מיקי התייבש והפך חורין."},{"u":2,"n":35,"t":"חותה","m":"גורף, אוסף או מעביר גחלים.","e":"אבי חותה את הגחלים שבמדורה כדי להוציא את תפוחי האדמה."},{"u":2,"n":36,"t":"חזיז ורעם","m":"קריאת רוגז לכל הרוחות!","e":"חזיז ורעם! איבדתי את המפתח של הבית."},{"u":2,"n":37,"t":"חזקה","m":"(1) זכות, בעלות. (2) כוח, תוקף. (3) הכפלת מספר בעצמו.","e":"קרקע זאת בחזקת המדינה."},{"u":2,"n":38,"t":"טוזיג","m":"מסיבה בחיק הטבע, פיקניק.","e":"משפחתי קיימה טוזיג ביער ולמזלם לא ירד גשם."},{"u":2,"n":39,"t":"טוטם","m":"אליל השבט בתרבויות פרימיטיביות שמייחסים לו קרבת דם לשבט. הטוטם הוא חפץ, בעל חיים, צמח או מקום הנערצים על- ידי שבטים מסוימים ומשמשים כסמל לשבט או למשפחה.","e":"סביב הטוטם התרכזו טקסים פולחניים."},{"u":2,"n":40,"t":"יומרה","m":"שאיפה של אדם להשיג דברים שלא יוכל להשיגם או שיהיה לו קשה מאוד להשיגם.","e":"יש לה יומרות להיות סופרת אף שלא כתבה דבר."},{"u":2,"n":41,"t":"יוקשת","m":"ספינת מלחמה המניחה מוקשים.","e":"הבריטים ריכזו באזור מסוים באוקיינוס האטלנטי מספר רב של סירות יוקשות ובמשך חמשה ימים הצליחו לפגוע באוניות סחר."},{"u":2,"n":42,"t":"יורה","m":"הגשם הראשון.","e":"היורה הקדים השנה והגיע בתחילת הסתיו."},{"u":2,"n":43,"t":"כבש את יצרו","m":"התגבר על תאוותו.","e":"למרות שחבריי ניסו לפתותי לאכול שוקולד, כבשתי את יצרי וסירבתי."},{"u":2,"n":44,"t":"כבשן","m":"(1) תנור גדול. (2) ביטוי לחום כבד מאוד.","e":"בטיולנו במדבר חשנו כי אנו נמצאים בכבשן ומיד התקדמנו לעבר מקום מוצל וקריר."},{"u":2,"n":45,"t":"כדלקמן","m":"להלן, כמו שכתוב אחר כך.","e":"יש להציג מסמכים אלו כדלקמן: מסודרים לפי האלפבית, מחולקים לנושאים ומנוסחים היטב."},{"u":2,"n":46,"t":"כוננית","m":"ארון מדפים פתוח, תא, מדור.","e":"שמתי את הספרים בכוננית."},{"u":2,"n":47,"t":"לא שזפתו עין","m":"אף אחד לא ראה זאת קודם לכן, לא היה ידוע קודם.","e":"מקומות נידחים אלה, לא שזפתה עין."},{"u":2,"n":48,"t":"לאלתר","m":"עכשיו, ללא עיקוב, באופן מידי.","e":"העובד פוטר לאלתר בשל התפרעותו במקום העבודה."},{"u":2,"n":49,"t":"לתלפיות","m":"היטב, לתפארת.","e":"הכול התרשמו מן הדובר הצעיר שנאומו היה בנוי לתלפיות."},{"u":2,"n":50,"t":"מגלען","m":"מוציא גרעינים מפירות וירקות.","e":"הירקן מגלען את האבוקדו."},{"u":2,"n":51,"t":"מגלף","m":"חורת או מפסל בעץ בעזרת שיוף וחריטה.","e":"הפסל גלף חיילי שחמט מעץ האלון."},{"u":2,"n":52,"t":"מגס","m":"קערת מרק עמוקה.","e":"מידי ערב, מזה כעשור, אני נוהג לשתות מרק במגס אשר קיבלתי במתנה מסבי ז\"ל אשר קיבל זאת במתנה מאביו."},{"u":2,"n":53,"t":"מגרעת","m":"(1) חיסרון, פגם, ליקוי. (2) שקע.","e":"מגרעתו של עובד זה ניכרת בחוסר תפקוד במצבי לחץ."},{"u":2,"n":54,"t":"מדוה","m":"(1) מחלה, כאב. (2) מכאיב, מצער.","e":"הקשיש שכב ימים רבים על ערש דוי לפני מותו."},{"u":2,"n":55,"t":"מדוכה","m":"(1) מכתש – כלי לכתישת חומרים יבשים וקשים. (2) אוכף לרכיבה.","e":"ישב על המדוכה פירושו כי הוא השתתף בדיון יסודי ומעמיק בדבר סוגיה כלשהיא."},{"u":2,"n":56,"t":"מהדס","m":"הולך הליכה מתנדנדת, מדדה.","e":"התינוק מהדס אחרי אמו."},{"u":2,"n":57,"t":"מהין","m":"מעז.","e":"בני ההין לבצע את הצניחה החופשית."},{"u":2,"n":58,"t":"מהלומה","m":"מכה חזקה, חבטה.","e":"הפורץ הלם בבעלי הבית ופצע אותם."},{"u":2,"n":59,"t":"מהמורה","m":"חפירה, בור, שקע, מכשול.","e":"בגלל המהמורות בכביש הרכב סטה לשוליים."},{"u":2,"n":60,"t":"מוגיע","m":"מייגע, מעייף.","e":"האתלט הוגיע את גופו עד ששבר את השיא העולמי."},{"u":2,"n":61,"t":"מוחט","m":"(1) מקנח את האף. (2) מחטט ומגרד.","e":"המרצה התקשה להתרכז בשל אדם שמחט את אפו שוב ושוב במהלך ההרצאה."},{"u":2,"n":62,"t":"מוטורי","m":"קשור בכושר התנועה שבגוף.","e":"יוסי לא יכול להחזיק עיפרון בשל כשל מוטורי."},{"u":2,"n":63,"t":"מונותאיזם","m":"אמונה באל אחד.","e":"היהדות, הנצרות והאסלאם הן דתות מונותאיסטיות."},{"u":2,"n":64,"t":"מוניטין","m":"פרסום טוב לעסק או לאדם.","e":"החלטתי לבטח את רכבי ב\"ביטוחים שאול\" רק בזכות המוניטין שלהם."},{"u":2,"n":65,"t":"מורט עצבים","m":"מעצבן, מרגיז.","e":"הלילה היה מורט עצבים, לא הצלחתי להירדם."},{"u":2,"n":66,"t":"נהי","m":"בכי, קינה.","e":"קול נהי נשמע מבית העלמין."},{"u":2,"n":67,"t":"נוגה","m":"זורח, מאיר באור חזק.","e":"החפץ המבריק נוגה באור השמש."},{"u":2,"n":68,"t":"נוד","m":"נודד, עובר ממקום למקום בלי מגורי קבע.","e":"בשחר ההיסטוריה, האדם המודרני היה נוד ולא התיישב במקום קבע."},{"u":2,"n":69,"t":"נוה","m":"(1) יפה. (2) גר, שוכן. (3) מקום מרעה. (4) מעון, דירה.","e":"נוה גדול בנו לעצמם בני הזוג הטריים."},{"u":2,"n":70,"t":"נוה מדבר","m":"שטח בלב המדבר שיש בו מים וירק ומאפשר מגורי אדם ורעיית צאן.","e":"העדר הושקה בנוה המדבר."},{"u":2,"n":71,"t":"נוהה","m":"נמשך ל,  הולך אחרי, נכסף, משתוקק.","e":"ליבו נוהה אחריה."},{"u":2,"n":72,"t":"נתון בכף הקלע","m":"מתלבט.","e":"המשוחרר הטרי נתון בכף הקלע ואינו יודע מה לעשות."},{"u":2,"n":73,"t":"סהרורי","m":"(1) אדם המתהלך תוך כדי שינה, מוכה ירח. (2) כינוי לאדם הוזה, חולמני.","e":"יש לשמור עליו כי הוא סהרורי ולא מודע למעשיו."},{"u":2,"n":74,"t":"סואן","m":"רועש, הומה.","e":"הרחוב בו אני גר סואן ובלילה קשה להירדם."},{"u":2,"n":75,"t":"סוביקטיביות","m":"התבוננות מזווית ראיה אישית שאינה מתבססת רק על עובדות, אלא גם על תחושות אישיות של הפרט.","e":"הורים רבים הינם סוביקטיבים כלפי ילדיהם, בגישתם, ולכן ירבו להאמין להם גם אם נדמה שהם משקרים."},{"u":2,"n":76,"t":"סובסידיה","m":"סיוע כספי הניתן על ידי הממשלה ליצרן המוצר על מנת להוזיל את המוצר.","e":"במשך שנים נהנים תושבי יהודה ושומרון, חרדים ומגזרים נוספים מסובסידיה בתעריפי התחבורה הציבורית."},{"u":2,"n":77,"t":"סוגיה","m":"(1) עניין מסוים, שאלה או בעיה אשר דנים בו. (2) יחידת לימוד בהלכה התלמודית.","e":"כעת אנו דנים בסוגית חוק הגיוס."},{"u":2,"n":78,"t":"עוגם","m":"נעצב, מצטער, דואג.","e":"\"עגמה נפשי לאביון \" (איוב, ל', כה')."},{"u":2,"n":79,"t":"עול","m":"(1) נטל, מעמסה, טרחה. (2) מוט על צוואר הבהמה שקושרים אליו את הרתמה.","e":"האב לקח על עצמו על עול הפרנסה."},{"u":2,"n":80,"t":"עול ימים","m":"צעיר.","e":"הוא עדיין עול ימים ואין לו ניסיון."},{"u":2,"n":81,"t":"עועים","m":"בלבול חושים, טירוף.","e":"מוחו היה מלא ברעיונות עועים שאין להם כל קשר למציאות."},{"u":2,"n":82,"t":"פוכר","m":"שובר, הורס.","e":"החוטב פוכר את הגזע הארוך כדי שיוכל לסחוב אותו לבקתה ביותר קלות."},{"u":2,"n":83,"t":"פומבי","m":"גלוי, הנעשה לעיני כל.","e":"אדם התפשט בפומבי ולכן נעצר."},{"u":2,"n":84,"t":"פומפוזי","m":"ראוותני, מהודר, יומרני, מצועצע, נפוח.","e":"התנהגותה הפומפוזית של אביבית מגוחכת."},{"u":2,"n":85,"t":"פוסט פקטום","m":"לאחר מעשה, בדיעבד.","e":"פוסט פקטום הבין התלמיד שהיה צריך להשקיע זמן רב יותר בלימוד לבחינות."},{"u":2,"n":86,"t":"פופולרי","m":"עממי, שווה לכל נפש, מקובל על העם, ידוע ברבים, נפוץ.","e":"נשיא המדינה אהוד ופופולרי בקרב הציבור."},{"u":2,"n":87,"t":"פוקע","m":"(1) נסדק, נקרע. (2) התבטל(תוקף).","e":"תוקפו של שובר ההנחה פקע ולכן אין באפשרותנו להשתמש בו."},{"u":2,"n":88,"t":"צובא","m":"מתקהל.","e":"ביום העצמאות תושבי העיר צובאים ברחבת העירייה."},{"u":2,"n":89,"t":"צובת","m":"מחזיק בצבת, אוחזק בחוזקה כמו בצבת.","e":"הלובסטר צובת את מזונו."},{"u":2,"n":90,"t":"קדחתנות","m":"התלהבות מופרזת, פעלתנות יתרה, בהילות רבה.","e":"התלמידים צבעו בקדחתנות את חדר הכיתה."},{"u":2,"n":91,"t":"קדנציה","m":"תקופת כהונה, מילוי תפקיד ציבורי בכיר בתקופת זמן קצובה.","e":"שר הבריאות סיים את הקדנציה לאחר 4 שנות כהונה."},{"u":2,"n":92,"t":"קוגניטיבי","m":"בעברית: הכרני. שייך להכרה, הצדדים המנטליים הקשורים לתהליכי רכישת ידע באמצעות תפיסה שכלית וחשיבתית.","e":"הפסיכולוג חוקר את תהליכי התפיסה הקוגניטיבית אצל ילדים."},{"u":2,"n":93,"t":"קודר","m":"(1) אפל, שחור, כהה. (2) סגרירי, מעונן. (3) עצוב.","e":"לאחר ויכוח,קדרו פניו של הבעל."},{"u":2,"n":94,"t":"קוהרנטי","m":"מגובש, נהיר ומאורגן היטב לוגית או אסתטית.","e":"לסופרת סגנון כתיבה קוהרנטי."},{"u":2,"n":95,"t":"קולח","m":"זורם, שוטף, מתמשך.","e":"השיחה קולחת ונעימה."},{"u":2,"n":96,"t":"רגשת","m":"אלרגיה.","e":"החולה פיתח רגשת לתרופה, ועורו התכסה פריחה."},{"u":2,"n":97,"t":"רדיה","m":"הוצאת דבש מהכוורת או הוצאת מאפה מהתנור.","e":"הכוורן רודה דבש מדי יום ביומו."},{"u":2,"n":98,"t":"רהב","m":"גאווה, יהירות, התרברבות.","e":"רהבו של מיכאל גרם לאנשים להתרחק ממנו."},{"u":2,"n":99,"t":"שגיא","m":"נשגב, עצום, מרומם, כביר.","e":"\"הן אל שגיא ולא נדע\" (איוב, לו', כו')."},{"u":2,"n":100,"t":"שגיון","m":"אשליה כלשהי או רעיון שאדם דבק בו ואינו יכול להשתחרר מכך.","e":"תחושת היותך נרדף היא שגיון שעליך להיפטר ממנו."},{"u":3,"n":1,"t":"אותיות פורחות באויר","m":"מילים וביטויים חסרי משמעות, ריקות מתוכן, שאין להן אחיזה במציאות.","e":"דומה כי תוכנו של הספר שקול לאותיות פורחות באויר ולכן הפסקתי לקרוא אותו."},{"u":3,"n":2,"t":"אזוב","m":"(1) טחב. (2) סמל לקטנות, שפלות.","e":"לאחר שבוע גשום ראיתי אזוב על קירות ביתי."},{"u":3,"n":3,"t":"אזוטרי","m":"סודי, נסתר, שולי.","e":"הקבלה היא תורה אזוטרית וידועה רק לבודדים."},{"u":3,"n":4,"t":"אזלת יד","m":"חוסר אונים, חולשה.","e":"אזלת ידם של חסרי הבית גורמת להם לגנוב."},{"u":3,"n":5,"t":"אזמל","m":"(1) סכין מנתחים. (2) כלי לחיתוך, גילוף, מפסלת.","e":"המנתח והפסל קנו אזמל דומה."},{"u":3,"n":6,"t":"אזנים ערלות","m":"חוסר הקשבה.","e":"כאשר ביקש לשתף את חברו בדבר לא נפל על אזנים ערלות."},{"u":3,"n":7,"t":"אחו","m":"שטח המכוסה עשב למרעה, כר דשא.","e":"הפרות נמצאו באחו לאחר חיפושים."},{"u":3,"n":8,"t":"אחוז אימה","m":"פוחד מאוד.","e":"הילדה הקטנה הייתה אחוזת אימה למראה צילו של העץ בחדרה."},{"u":3,"n":9,"t":"אחז את השור בקרניו","m":"התמודד עם בעיה או אתגר באופן ישיר ובנחישות.","e":"ראש הממשלה אחז את השור בקרניו ופתר את מצוקת הדיור הקשה בארץ."},{"u":3,"n":10,"t":"אחרית","m":"סוף, קץ.","e":"חזון אחרית הימים מתאר את קץ האנושות בדרכים שונות."},{"u":3,"n":11,"t":"אטר","m":"שמאלי.","e":"קשה יותר לשמור על כדורסלן אטר מאשר על כדורסלן ימני, לדברי מאמני."},{"u":3,"n":12,"t":"ביוספרה","m":"האזורים על פני כדור הארץ שיש בהם יצורים חיים.","e":"קיומו של המין האנושי תלוי בהמשך פעילותה התקין של הביוספרה."},{"u":3,"n":13,"t":"ביות","m":"הפיכה של חיית בר לחיית בית.","e":"כלבים בויתו מן הזאב לפני יותר ממאה אלף שנים."},{"u":3,"n":14,"t":"בין המצרים","m":"(1) בצרה, במצוקה. (2) כינוי לימים שבין י\"ז בתמוז ובין ט' באב.","e":"העסק נמצא בין המצרים ויתכן שייסגר."},{"u":3,"n":15,"t":"בין הפטיש לסדן","m":"במצב ללא מוצא, בין שני כוחות או סמכויות, בצרה שאינו יכול להיחלץ ממנה.","e":"הרגשתי בין הפטיש לסדן כאשר חברי ביקש ממני לסייע לו לפטר את חברתי."},{"u":3,"n":16,"t":"בין השמשות","m":"פרק הזמן שבין סוף היום (שקיעת השמש) לבין תחילת הלילה (צאת הכוכבים).","e":"חבריי קבעו לצאת ליום ההולדת בין השמשות."},{"u":3,"n":17,"t":"באבו","m":"בצעירותו, בתחילת דרכו.","e":"מפקד יחידתו כתב עליו במכתב תנחומים למשפחתו: \"גידלתם בן לתפארת והוא נקטף באבו."},{"u":3,"n":18,"t":"גדיים נעשו תישים","m":"מי שהיה קטן הפך להיות גדול.","e":"לאחר שתלמידיי מונו לתפקידי מפתח בצה\"ל חשתי כי הגדיים נעשו תישים."},{"u":3,"n":19,"t":"גדיל","m":"חוטים לקישוט בקצה בגד, ציצית, מפה, לבוש, וילון וכו'.","e":"כמה מן הגדילים של השטיח נתלשו."},{"u":3,"n":20,"t":"גוהר","m":"מתכופף, משתטח.","e":"בזמן פולחן הכוהנים גוהרים כלפי ארון הקודש."},{"u":3,"n":21,"t":"דוגמטי","m":"(1) הנחה או אמונה שאין לערער עליה. (2) אדם צר אופקים ותקיף בדעתו.","e":"הדרך הדוגמטית של חוקי הדת קשה לאנשים מסוימים."},{"u":3,"n":22,"t":"דוללה","m":"פקעת חוטים מאריג שנפרם, סליל, חוט.","e":"נתתי את הדוללה לחתול."},{"u":3,"n":23,"t":"דומן","m":"זבל.","e":"בפרברי העיר נמצא מקום מוזנח ומזוהם וריח הדומן מגיע בתדירות גבוהה."},{"u":3,"n":24,"t":"הזחה","m":"(1) הזזה. (2) הרווח שבתחילת פסקה חדשה משולי הדף.","e":"הזחה בחיבור חשובה מאוד ויש להקפיד בכל פסקה ופסקה."},{"u":3,"n":25,"t":"החכרה","m":"השכרה, מסירה או העברת בעלות לתקופת זמן מוגבלת תמורת תשלום.","e":"המדינה החכירה שטחים לטובת בני המיעוטים."},{"u":3,"n":26,"t":"הטיה","m":"שינוי, הפניה,הסטה של דבר לכיוון מסוים.","e":"הטיתי את הווילון בביתי מכיוון שהשמש הייתה חזקה מידי."},{"u":3,"n":27,"t":"היה לו לזרא","m":"נמאס לו, קצה נפשו.","e":"\"עד חדש ימים עד אשר יצא מאפכם והיה לכם לזרא יען כי מאסתם את יהוה אשר בקרבכם\" (במדבר, יא', כ')."},{"u":3,"n":28,"t":"היה למשל ולשנינה","m":"היה ללעג ולבוז.","e":"מה שקרה לו נהפך למשל ולשנינה בקרב תושבי העיר."},{"u":3,"n":29,"t":"ורד","m":"(1) סמל לאופטימיות. (2) אדום בהיר.","e":"הורדות שליוו את נציג ישראל לאירוויזיון התפוגגו במהרה כאשר לא עברה את חצי הגמר."},{"u":3,"n":30,"t":"וריאציה","m":"גרסה, נוסח.","e":"הלהקה ביצעה את השיר בוריאציה שונה מהמקור."},{"u":3,"n":31,"t":"זהרור","m":"כתם אור, קרן אור.","e":"זהרורים חדרו לחדרי דרך התריס."},{"u":3,"n":32,"t":"חזר על הפתחים","m":"קיבץ נדבות.","e":"הוא הפסיד את כספו והחל לחזר על הפתחים בעיר."},{"u":3,"n":33,"t":"חט","m":"(1) שן חותכת. (2) שן בולטת כעין קרן בפי הפיל וחיות אחרות. (3) מכשיר לעשיית חריצים.","e":"רוב הפילים נהרגים וניצודים בגלל רצונם של ציידים לעקור את חיטיהם."},{"u":3,"n":34,"t":"חיבוץ","m":"(1) בחישת חלב או שמנת לעשיית גבינה. (2) חיבוט וניעור בחוזק וברציפות.","e":"נסענו למחלבה כדי לראות את מלאכת החיבוץ. חיבוץ השטיח היה קשה מנשוא."},{"u":3,"n":35,"t":"חילה את פניו","m":"התחנן, הפציר, ביקש רחמים.","e":"הוא ניסה לחלות את פני המנהל בתקווה שזה יעזור לו בקידום הנושא."},{"u":3,"n":36,"t":"טונדרה","m":"נוף דל צמחייה ומכוסה בשלג ברוב ימות השנה, אופייני לאזור הארקטי.","e":"הטונדרה מאפיינת את נופיהם של אזורים צפוניים כמו סיביר וקנדה."},{"u":3,"n":37,"t":"טופוגרפיה","m":"ענף בגיאוגרפיה העוסק בתיאור פני הקרקע.","e":"על ידי סונר אפשר לסרוק ולחקור את טופוגרפיה של האוקיינוסים."},{"u":3,"n":38,"t":"יושב אהל","m":"אדם שלא מרבה לצאת מביתו, אדם שמקדיש את כל זמנו בעיקר ללימוד תורה.","e":"אדם זה הינו יושב אהל ואין לו חיי חברה."},{"u":3,"n":39,"t":"יחדה ונגדה","m":"קואליציה ואופוזיציה.","e":"הממשלה מורכבת מיחדה ונגדה."},{"u":3,"n":40,"t":"יחיד סגולה","m":"בעל תכונה נדירה שאין לאחרים, יחיד במינו, שמצטיין בתכונותיו.","e":"אחי הוא יחיד סגולה בתחום המחשוב ועל כן קיבל אין ספור הצעות עבודה."},{"u":3,"n":41,"t":"כורת","m":"(1) גוזר, חוטב, חותך. (2) עושה ברית, עושה הסכם.","e":"אברהם כרת ברית עם אלוהיו."},{"u":3,"n":42,"t":"כותפת","m":"רצועת בד על הכתף לקישוט או להצמדת דרגות צבא.","e":"דרגות קצונה נמצאות על כותפות ולא על הזרוע."},{"u":3,"n":43,"t":"כותר","m":"כותרת, שם הכתוב בשער הספר או בראש מסמך.","e":"היום כותר העיתון היה מפתיע במיוחד."},{"u":3,"n":44,"t":"כזה ראה וקדש","m":"דבר שיש לקבלו ללא ערעור או פקפוק.","e":"הקשב למרצה כזה ראה וקדש, הוא הטוב בכל האקדמיה."},{"u":3,"n":45,"t":"לבוד","m":"מחובר, מאוחד.","e":"חיבור בין שני חלקי מחיצה קרוי לבוד."},{"u":3,"n":46,"t":"לביא","m":"אריה.","e":"נסענו לגן החיות כדי לראות לביאים."},{"u":3,"n":47,"t":"מושר","m":"מושמע, ששרים אותו.","e":"האופרה המערבית היא יצירה מוזיקלית ודרמטית ובמה טקסט מושר."},{"u":3,"n":48,"t":"מזה","m":"מתיז נוזלים.","e":"אורן מזה מים על הצמחים בחצרו."},{"u":3,"n":49,"t":"מזור","m":"(1) תרופה, רפואה. (2) מחלה, מכה, כאב.","e":"החולה ביקש מרופאו למצוא לו מזור לכאביו הרבים."},{"u":3,"n":50,"t":"מזח","m":"רציף לספינות, הנמשך מן החוף אל תוך הים או הנהר.","e":"הספינה עגנה לצד המזח."},{"u":3,"n":51,"t":"מזקקה","m":"מקום לזיקוק (טיהור נוזלים) של משקאות אלכוהוליים.","e":"ערכנו סיור במזקקה ולמדנו על תהליך הזיקוק וההכנה של משקה הוויסקי."},{"u":3,"n":52,"t":"מחבוש","m":"מעצר, כליאה.","e":"החייל נשפט ל01 ימי מחבוש."},{"u":3,"n":53,"t":"מחוש","m":"כאב.","e":"לאחר נפילתה חשה הגברת מחושים בגבה."},{"u":3,"n":54,"t":"מחטיא","m":"(1) גורם למישהו אחר לחטאו. (2) מפספס את מטרתו.","e":"הכדורגלן החטיא את שער הניצחון."},{"u":3,"n":55,"t":"מחילה","m":"סליחה.","e":"בעל הבית החליט למחול לפורץ שביקש סליחה."},{"u":3,"n":56,"t":"מחלפה","m":"צמה.","e":"הילדה החליטה לקלוע מחלפות בשערה."},{"u":3,"n":57,"t":"מחלצות","m":"לבוש הדור, בגדי פאר וחג.","e":"לכבוד ערב חג הפסח, אמי ואני לבשנו מחלצות בלבן וקיבלנו מחמאות."},{"u":3,"n":58,"t":"מחמל","m":"מחמד, אהוב, רחום, יקר.","e":"ילדי הוא מחמל נפשי."},{"u":3,"n":59,"t":"מחפה","m":"(1) מגן על אחר מפני אשמה. (2) מגן על חייל מסתער על ידי ירי על האויב. (3) מצפה, מכסה.","e":"בזמן קרב, המחלקה של חברי מחפה על מחלקתי על מנת שנוכל להסתער ללא פגע."},{"u":3,"n":60,"t":"מחצב","m":"כל חומר טבעי הנחצב מן האדמה (בלועזית: מינרל)","e":"אבני הקוורץ הן מחצב שכיח מאוד."},{"u":3,"n":61,"t":"מחריש אזנים","m":"חזק מאוד, רעש רב ביותר.","e":"קול הנפץ היה מחריש אזנים."},{"u":3,"n":62,"t":"נוהר","m":"זורם (המון בני אדם), זורח, מאיר.","e":"ההמון נוהר אל הכיכר להשתתף בהפגנה."},{"u":3,"n":63,"t":"נוטר","m":"(1) שומר. (2) שומר שנאה בלבו.","e":"אל תיטור לו על מעשיו, מחל לו."},{"u":3,"n":64,"t":"נוסך","m":"יוצק, שופך, משרה.","e":"המוזיקה נוסכת בו שלווה ורוגע."},{"u":3,"n":65,"t":"נורמה","m":"נוהג מקובל, מידה קבועה ומוסכמת, סטנדרט.","e":"כמות זיהום האוויר חורגת מהנורמה."},{"u":3,"n":66,"t":"נושע","m":"ניצל מצרה, יש לו ישועה.","e":"הוא נושע מצרתו המרה."},{"u":3,"n":67,"t":"נזם זהב באף חזיר","m":"התקשטות חסרת סיכוי, משל למי שמתהדר בחיצוניותו והוא עצמו ריק מכל תוכן.","e":"לא יועיל השיפוץ המפואר של הכניסה לבניין עם כל העיטורים, כשהבניין עצמו רעוע, סדוק ומתקלף, זה כמו נזם זהב באף חזיר."},{"u":3,"n":68,"t":"נקלה","m":"מבויש, בזוי.","e":"\"ונקלה כבוד מואב בכל למרות ההמון הרב\" (ישעיהו, טז', יד')."},{"u":3,"n":69,"t":"סודר","m":"פיסת בד או סריג לכיסוי הצוואר, הראש או הכתפיים.","e":"הילד לבש סודר צמר."},{"u":3,"n":70,"t":"סונט","m":"מכעיס, מלגלג, מקניט, לועג.","e":"\"אפילו העכבר שלי יותר יפה מהכלב שלך\" סנטה חנה בשמשון."},{"u":3,"n":71,"t":"סחי","m":"לכלוך, אשפה.","e":"ביתם מלא בסחי וזוהמה."},{"u":3,"n":72,"t":"סטואי","m":"אדיש, שליו, מאופק.","e":"בטיפול השיניים גילה שלווה סטואית."},{"u":3,"n":73,"t":"סטיגמה","m":"אות קלון – כתם בשמם הטוב של אדם או קבוצה מסוימת, דעה קדומה.","e":"עם השנים הודבקה לעדות המזרח הסטיגמה שיש להם אוכל טוב."},{"u":3,"n":74,"t":"עורבא פרח","m":"העורב עף – אין לדברים שום יסוד במציאות, לא היה ולא נברא.","e":"הוא מספר סיפורים על עצמו ומתברר שהם עורבא פרח."},{"u":3,"n":75,"t":"עורג","m":"משתוקק, מתגעגע.","e":"היא עורגת אל אביה שלא ראתה שבוע ימים."},{"u":3,"n":76,"t":"עט","m":"התנפל.","e":"העיט עט על טרפו."},{"u":3,"n":77,"t":"עיר","m":"ולד של חמור.","e":"משנולד החל העיר ללכת על רגליו אחרי האתון."},{"u":3,"n":78,"t":"פורף","m":"רוכס, מחבר בכפתור או בסיכה.","e":"יצחק פרף את מעילו בטרם יצא אל הכפר."},{"u":3,"n":79,"t":"פושה","m":"מתרחב, מתפתח לצדדים.","e":"המחלה פשטה בארץ."},{"u":3,"n":80,"t":"פושט עור","m":"גובה מחיר מופקע תמורת סחורתו, נצלן.","e":"בעל החנות הזאת הינו פושט את עורות לקוחותיו."},{"u":3,"n":81,"t":"פותה","m":"פתי, תמים, בצורה תמימה.","e":"הערצתם של הפוליטיקאים אינו בביטחון פותה בהם, אלא במעשיהם בפועל."},{"u":3,"n":82,"t":"פח יקוש","m":"מלכודת.","e":"טמנתי לעכבר פח יקוש."},{"u":3,"n":83,"t":"פטר","m":"(1) כינוי לתינוק הבכור. (2) תחילה, פתיחה.","e":"מצוות \"פדיון הבן\" חלה רק על בן זכר שהיה פטר רחם לאמו, כלומר הוולד הראשון."},{"u":3,"n":84,"t":"צודה","m":"אורב, מתנכל, מתנקש.","e":"האריה צודה לצבי בין השיחים."},{"u":3,"n":85,"t":"צורף","m":"(1) מתיך, מזקק מתכת. (2) מומחה לעבודות כסף וזהב.","e":"הצורף הכין שרשרת ייחודית מזהב לאשתו."},{"u":3,"n":86,"t":"קולס","m":"גבעול, קלח, קנה.","e":"קולסי הסוף משמיעים רעש קל כאשר נושבת רוח."},{"u":3,"n":87,"t":"קומזיץ","m":"מפגש חברתי מסביב למדורה.","e":"עליי להביא תפוחי אדמה לקומזיץ."},{"u":3,"n":88,"t":"קונוונציה","m":"התנהגות תקנית, דרך ביצוע מקובלת על הכול.","e":"החריזה הינה קונוונציה ספרותית ומופיעה רבות בספרות ילדים."},{"u":3,"n":89,"t":"קונוטציה","m":"תחושה נלווית למשמעות המילה, תחושת לוואי.","e":"לצבע האדום יש קונוטציה של אהבה ושל מלחמה."},{"u":3,"n":90,"t":"קונפו רמיזם","m":"אמונה ודרך פעולה על פי המקובל על הרוב ולפי החברה ומוסכמותיה, \"שחייה עם הזרם\".","e":"יש הטוענים שאדם קונפורמיסט נוהג בדרך זו על מנת להרגיש שייכות לחברה בה הוא נמצא."},{"u":3,"n":91,"t":"קונפליקט","m":"סכסוך, ריב, מחלוקת, סתירה, התנגשות.","e":"קונפליקט הפנימי שלו מנע ממנו להחליט על המשך דרכו."},{"u":3,"n":92,"t":"רהה","m":"הססן, פחדן.","e":"הילדה ביישנית ורהה."},{"u":3,"n":93,"t":"רהוט","m":"הנעשה בלא הפסקות ועצירות, שוטף, שגור.","e":"קריאתה של התלמידה הייתה רהוטה."},{"u":3,"n":94,"t":"רובץ לפתחו","m":"נמצא קרוב אליו, באחריותו, באשמתו.","e":"האחריות על ביצוע המעשה רובצת לפתחו של המנהל."},{"u":3,"n":95,"t":"שדה בור","m":"שדה לא מעובד.","e":"שדה זה היה בעבר שדה בור עד שהגיע החקלאי."},{"u":3,"n":96,"t":"שדוף","m":"(1) ריק, חסר תוכן. (2) יבש, מצומק. (3) רזה, כחוש.","e":"ליאור חזר שדוף מטיולו במזרח."},{"u":3,"n":97,"t":"שדמה","m":"שדה תבואה, מטע.","e":"\"שדמות ענבים נגלו לי ליד ביתי, איזה כיף!\""},{"u":3,"n":98,"t":"שה תמים","m":"אדם תמים.","e":"הוא רק נראה שה תמים אך הוא נחש צפע."},{"u":3,"n":99,"t":"תגרן","m":"(1) מוכר, סוחר במסחר זעיר. (2) מי שמרבה להתווכח על המחיר.","e":"הרבה תגרנים בשוק שרוצים שיקנו רק מהם."},{"u":3,"n":100,"t":"תהודה","m":"(1) תגובה. (2) התהוות הדים בתוך כלי נגינה או באולם.","e":"דבריו זכו לתהודה רבה בקרב בעלי הדעה."},{"u":4,"n":1,"t":"איבה","m":"שנאה, עוינות.","e":"במהלך ההיסטוריה בוצעו כלפי היהודים אין ספור פעולות איבה."},{"u":4,"n":2,"t":"אידאולוגיה","m":"השקפה מוסרית או חברתית.","e":"על פי האידאולוגיה הנאצית, הגרמנים היו נעלים מכל גזע אחר."},{"u":4,"n":3,"t":"איוש","m":"(1) הפקדת אדם על ביצוע תפקיד. (2) הצבת אנשים בעמדה.","e":"הלוחמים איישו את עמדת השמירה."},{"u":4,"n":4,"t":"איחז את עיניו","m":"רימה אותו, שיקר לו.","e":"הקוסם איחז את עיניהם של הקהל."},{"u":4,"n":5,"t":"איכף","m":"הניח אוכף על גב סוס.","e":"הרוכב איכף את סוסו לקראת הרכיבה."},{"u":4,"n":6,"t":"אימננטי","m":"(1) כוח, מניע שפועל מבפנים. (2) פנימי, מהותי, כלול בתוך.","e":"תשובתך מעידה על כך שאינך מבינה את דבריי אימננטית ואני מצר על כך."},{"u":4,"n":7,"t":"אין הנחתום מעיד על עיסתו","m":"אדם אינו אמור להעיד על מעשיו כשם שהנחתום (אופה) אינו יעיד על טיב עיסתו.","e":"השופט לא אישר לנאשם להעיד על אופיו שלו שכן לדברי השופט אין הנחתום מעיד על עיסתו."},{"u":4,"n":8,"t":"אין ידו משגת","m":"אין לו די כסף, אין לו אפשרות כלכלית.","e":"אין ידם משגת של הזוג הצעיר מלקנות דירה."},{"u":4,"n":9,"t":"אינהרנטי","m":"טבוע, מובנה, שהוטבעה בו צורה או תכונה.","e":"לכל אדם יש זכות אינהרנטית לחיים."},{"u":4,"n":10,"t":"אינטלקט","m":"שכל, בינה, תבונה, מחשבה, כושר שפיטה.","e":"במבחני אינטליגנציה יש להפעיל את האינטלקט."},{"u":4,"n":11,"t":"אינ טראקציה","m":"יחסי גומלין, הדדיות בין שני גופים או יותר, הכוח ששני גופים מפעילים זה על זה.","e":"מחיאות כפיים הן אינטראקציה בין כפות הידיים."},{"u":4,"n":12,"t":"בירוקרטיה","m":"\"שלטון הפקידות\", גישה קשוחה לפיה אין התחשבות בצורכי האדם הפרטי.","e":"לדעת רבים מדינת ישראל סובלת מעודף בירוקרטיה בכל הנוגע להיתרי בנייה."},{"u":4,"n":13,"t":"בית בד","m":"בית מלאכה לתעשיית שמן מזיתים.","e":"אבי עובד בבית הבד בכפר ומידי פעם אני חוזר לביתי עם ליטר שמן זית."},{"u":4,"n":14,"t":"בית נתיבות","m":"(1) מקום ממנו יוצאים לדרך, שדה תעופה, תחנת רכבת. (2) פרשת דרכים.","e":"כשחזר לארץ הוריו חיכו לו בבית הנתיבות."},{"u":4,"n":15,"t":"ביתר שאת","m":"במידה מוגברת, בעוצמה רבה יותר.","e":"הסערה התגברת ביתר שאת."},{"u":4,"n":16,"t":"בכור","m":"(1) הבשלת הפרי. (2) העדפה.","e":"בכור האחות הצעירה על הבכורה גרם לריב במשפחה."},{"u":4,"n":17,"t":"גוחן","m":"מתכופף.","e":"הילד גחן לשפת הנחל על מנת לאסוף חלוקי נחל."},{"u":4,"n":18,"t":"גז","m":"הורדת הצמר מכבשים.","e":"אבי מבצע גז רק כאשר צמרן של הכבשים עבה מאוד."},{"u":4,"n":19,"t":"גיא","m":"עמק צר ועמוק, מעבר צר בין הרים.","e":"טיילנו בגיא בין שני ההרים."},{"u":4,"n":20,"t":"דון קישוטיות","m":"דון קישוטיות הוא ביטוי המתאר אמונה והתלהבות מדברים דמיוניים וניסיון לבצע פעולות בלתי אפשריות למען אמונה זו.","e":"ליורם התנהגות דון קישוטית ולכן נלקח לאבחון פסיכיאטרי."},{"u":4,"n":21,"t":"דוק","m":"מעטה דקיק, דקות, עדינות.","e":"עיניה כוסו בדוק של דמעות."},{"u":4,"n":22,"t":"דושה","m":"מנוף המופעל ברגל.","e":"עזבתי את דושת הגז על מנת להאט."},{"u":4,"n":23,"t":"היולי","m":"ראשוני, קדמון, לא מעובד.","e":"כיום, מדענים מנסים למצוא את החומר ההיולי ממנו נוצר העולם."},{"u":4,"n":24,"t":"הינו הך","m":"אותו הדבר.","e":"הנהגה וניהול אינם הינו הך, וחשוב לטפח את שניהם."},{"u":4,"n":25,"t":"היפונימיה","m":"הכללות, המצאות בתוך קבוצה, כניסה לתוך ישות גדולה.","e":"נמר הוא היפונים של פנתר המסוגל להגיע, עת מרדף אחר טרפו, למהירות 60 קמ\"ש."},{"u":4,"n":26,"t":"היפותטי","m":"דמיוני, לא מוכח, משוער.","e":"גן העדן הוא מושג היפותטי."},{"u":4,"n":27,"t":"הכביר במילים","m":"דיבר הרבה.","e":"סוכן המכירות הכביר במילים במטרה לשכנע את הלקוח."},{"u":4,"n":28,"t":"ותו לא","m":"לא עוד, לא יותר, בלבד.","e":"הוא יודע רק את השפה העברית ותו לא."},{"u":4,"n":29,"t":"זוג","m":"(1) דופן הפעמון. (2) פעמון שקושרים לצוואר בעלי חיים.","e":"על צווארן של כבשים נהוג לקשור זוג."},{"u":4,"n":30,"t":"חיפזון","m":"מהירות רבה.","e":"בני ישראל יצאו ממצרים בחיפזון."},{"u":4,"n":31,"t":"חכלילי","m":"אדום.","e":"השמש צבע את העננים בגוונים חכליליים של שקיעה."},{"u":4,"n":32,"t":"חלב","m":"שומן הנמצא בבעלי חיים ומשמע בעיקר לתעשיית נרות וסבון.","e":"נר זה מיוצר מחלב."},{"u":4,"n":33,"t":"חלבן","m":"מוכר חלב.","e":"החלבן מגיע העירה כל בוקר וכל ערב."},{"u":4,"n":34,"t":"טורבינה","m":"מנוע אשר מופעל באמצעות זרם של מים או באמצעות אדים.","e":"לפני ימים אחדים הוקמה טורבינה שלישית במפעל ההידרו חשמלי של חברת החשמל."},{"u":4,"n":35,"t":"טוריה","m":"מעדר רחב, את.","e":"יוסי עדר את אדמת חצרו טוריה במרץ רב."},{"u":4,"n":36,"t":"יין בן חמץ","m":"כינוי לאדם טוב שהוא בן למשפחה נבזית.","e":"במשפחת העבריינים רק הנכד הגדול הוא יין בן חמץ."},{"u":4,"n":37,"t":"ימה","m":"אגם גדול.","e":"ימת באי קל מכילה יותר מים מכל הימות הגדולות שבצפון אמריקה ביחד."},{"u":4,"n":38,"t":"יניקה","m":"(1) מציצה, שאיבה. (2) מציצת חלב מן השד. (3) קבלת השפעה.","e":"הצמח ניזון על ידי יניקת מלחים ונוזלים מהקרקע."},{"u":4,"n":39,"t":"כחוש","m":"רזה, דל.","e":"החולה הפך כחוש בגלל תרופות המדכאות את התיאבון."},{"u":4,"n":40,"t":"כחמר ביד היוצר","m":"כינוי למי שניתן להשפיע עליו בקלות, נאמר לרוב על אדם חלש וחסר אופי.","e":"הוא תמיד עושה כל מה שמבקשים ממנו כחמר ביד היוצר."},{"u":4,"n":41,"t":"כיבוד","m":"(1) מתן כבוד, הוקרה. (2) מאכל ומשקה שמגישים לאורח.","e":"כיבדתי את חבריי שהתארחו בביתי."},{"u":4,"n":42,"t":"כון לדעת גדולים","m":"הביע רעיון שהביעו כבר גדולים ממנו.","e":"דן כון לדעת גדולים בשאלת האם האל קיים."},{"u":4,"n":43,"t":"לבירינת","m":"מבוך, מבוי סתום.","e":"אחת השיטות להיחלץ מלבירינת היא להיצמד לקירות."},{"u":4,"n":44,"t":"לגין","m":"כד, בקבוק.","e":"לגין יין זה עוצב בתקופת הרנסאנס."},{"u":4,"n":45,"t":"מחשה","m":"שותק, מחריש, דומם.","e":"המדריך החשה את חניכיו הרועשים."},{"u":4,"n":46,"t":"מחשל","m":"(1) מעוצב באש. (2) מחוזק לאחר עמידה בניסיון קשה, מחוזק.","e":"הפלדה חושלה בחום גבוה מאוד."},{"u":4,"n":47,"t":"מחתרת","m":"(1) תנועה לא חוקית הלוחמת בשלטון. (2) חפירה מתחת לקרקע כדי להיכנס או לצאת ממנו בהסתר.","e":"המחתרת של המורדים פעלה בסתר."},{"u":4,"n":48,"t":"מט לנפל","m":"רעוע, לא יציב.","e":"הפיגום של בניין זה מט לנפל ומסוכן."},{"u":4,"n":49,"t":"מטיל אימה","m":"מפחיד, מבהיל.","e":"המסכה שקנה לחג הפורים הטילה אימה על אחיו התינוק."},{"u":4,"n":50,"t":"מטלל","m":"רטוב או מכוסה בטל.","e":"השדה היה מטלל בעלות השחר."},{"u":4,"n":51,"t":"מטפה","m":"מיכל ממולא בנוזל כימי לכיבוי שריפות.","e":"בכל מקום חייב להיות מטפה לביטחון."},{"u":4,"n":52,"t":"מטפורה","m":"שימוש במאפיינים של דבר אחד כדי לתאר דבר אחר.","e":"שם מטפורי לגמל הוא ספינת המדבר."},{"u":4,"n":53,"t":"מטר","m":"(1) גשם. (2) כינוי לדברים הנזרקים או נופלים בשפע.","e":"מטר כדורים נורה על הישוב."},{"u":4,"n":54,"t":"מטרונית","m":"אשת המעמד הגבוה, אשת אצולה.","e":"המטרונית הגיעה לנשף לבושה בהידור."},{"u":4,"n":55,"t":"מטת סדום","m":"מגבלה שקשה להסתגל אליה, מצב שאינו מאפשר כל פעולה.","e":"הקיץ האחרון היה כמטת סדום לכל עובדי האדמה."},{"u":4,"n":56,"t":"מיגור","m":"כליה, השמדה (של אויב). הבסה, הנחלת מפלה. הכחדה, העלמה, חיסול.","e":"ממשלת ישראל בעד מיגור הטרור."},{"u":4,"n":57,"t":"מיגע","m":"מעייף מאוד, גורם להרגשת עומס וכובד.","e":"המבחן של סוף השנה קשה ומיגע."},{"u":4,"n":58,"t":"מימים ימימה","m":"מתמיד, מאז ומעולם, בכל שנה ושנה.","e":"אנו חוגגים חג זה מימים ימימה."},{"u":4,"n":59,"t":"מימרה","m":"פתגם, אמרה.","e":"מקורה של המימרה \"ואהבת לרעך כמוך\" (ויקרא, יט',יח')."},{"u":4,"n":60,"t":"נחיל","m":"(1) להקת דבורים. (2) מספר עצום של יצורים בתנועה. (3) עדת בעלי חיים.","e":"נחיל דגים שחה אל מול הצוללנים וחסם את שדה ראייתם."},{"u":4,"n":61,"t":"נחר","m":"יבש מאוד.","e":"בקיץ האדמה נחרה."},{"u":4,"n":62,"t":"נחרך","m":"נשרף קצת.","e":"הטבח חרך את העוף."},{"u":4,"n":63,"t":"נחשתים","m":"אזיקים, כבלי מתכת לאסירים.","e":"האסיר בנחשתים ואינו יכול לברוח."},{"u":4,"n":64,"t":"נטה חסד","m":"התייחס אליו בחיבה, היה סימפטי כלפיו, הפגין רחמים וחמלה.","e":"האדון נטה חסד לחסר הבית ודאג לו לארוחה."},{"u":4,"n":65,"t":"סטראוטיפ","m":"בעברית: הטפס. דעה קדומה, הכללה על אדם מסוים בדרך כלל על פי שייכותו לקבוצה חברתית מסוימת, מראהו החיצוני וכדומה.","e":"בתחילת דרכה של מדינת ישראל הסטראוטיפ החברתי השלילי על אנשי עדות המזרח מנע מהם רבות."},{"u":4,"n":66,"t":"סטרוקטורלי","m":"מבני, שיש לו מבנה קבוע.","e":"ישנם גבישים בעלי מבנה סטרוקטורלי."},{"u":4,"n":67,"t":"סיג","m":"(1) גדר. (2) הגבלה, מגבלה.","e":"החוק החדש שם סיגים לחברות ההייטק."},{"u":4,"n":68,"t":"סיוד","m":"צביעה או מריחה בסיד.","e":"הצבע סייד את קירות הבית."},{"u":4,"n":69,"t":"סיזיפי","m":"קשה ומפרך, ללא תועלת וסיום.","e":"העבודה בשדה הייתה סיזיפית."},{"u":4,"n":70,"t":"עיר מקלט","m":"(1) עיר שרוצח בשגגה בורח אליה, שם הוא מוגן מפני גאולת דם(בתקופת המקרא). (2) מקום מחסה ומפלט.","e":"\"ואת הערים, אשר תתנו ללוים--את שש-ערי המקלט, אשר תתנו לנס שמה הרצח \" (במדבר, לה', ו')."},{"u":4,"n":71,"t":"עכור","m":"לא צלול, קודר.","e":"מי השתייה היו עכורים וכן לא ראויים לשתייה."},{"u":4,"n":72,"t":"על אפו ועל חמתו","m":"נגד רצונו, למרות התנגדותו.","e":"מדינת ישראל קמה על אפם ועל חמתם של הרבה מדינות שכנות."},{"u":4,"n":73,"t":"על נקלה","m":"בקלות, ללא בעיות.","e":"עברתי את מסלול המכשולים הזה על נקלה בזכות אימוניי הקשים."},{"u":4,"n":74,"t":"פטרון","m":"1. תומך, מגן, אפוטרופוס. 2. אדון. 3. בעל בית או עסק.","e":"ללא פטרון נאלץ מוצרט להתמודד עם הסיכונים של קריירה עצמאית."},{"u":4,"n":75,"t":"פטריוט","m":"נאמן ומסור למולדתו.","e":"סבי היה פטריוט ולכן התנדב לצבא ונשאר בו יותר משצרך."},{"u":4,"n":76,"t":"פטרנליזם","m":"קשר שבמסגרתו מתייחסים למבוגרים כאל ילדים ונשללת זכותם לשלוט בחייהם. השקפה המניחה שהנהלת הארגון צריכה להיות בעלת גישה הומנית ואבהית כלפי העובדים ומעורבת ברווחתם, כדרך אב המספק צרכי ילדיו.","e":"חקיקה פטרנליסטית היא חקיקה המיועדת להגן על האזרח מפני עצמו. במקרים בהם האזרח עלול לנהוג באופן שיסכן אותו חקיקה זו מגבילה את יכולתו להחליט ולפעול באופן עצמאי. דוגמת החובה לחגור חגורות בטיחות."},{"u":4,"n":77,"t":"פיד","m":"אסון, צרה.","e":"חטאיהם של בני ישראל הביאו פיד גדול לארץ."},{"u":4,"n":78,"t":"פילנתרופ","m":"1. אוהב אדם. 2. תורם מכספו לנזקקים, נדיב, רחב לב.","e":"הברון רוטשילד היה פילנתרופ שפעל רבות למען היהודים."},{"u":4,"n":79,"t":"פימה","m":"בשר תפוח מתחת לסנטר הנראה כסנטר נוסף.","e":"לאחר שרזה, נעלמה פימתו מתחת לצווארו."},{"u":4,"n":80,"t":"צחצוח חרבות","m":"1. ויכוח חריף, התנצחות, פולמוס נרגש. 2. הכנות לקרב.","e":"בכל יום ישנו צחצוח חרבות על נושא הבחירות."},{"u":4,"n":81,"t":"צי","m":"שיירה של אניות, כלל כלי השייט של המדינה.","e":"הצי האמריקני הוא הצי הגדול ביותר בעולם."},{"u":4,"n":82,"t":"קונצנזוס","m":"הסכמה כללית ומוחלטת.","e":"בישיבת המועצה קונצנזוס מוחלט לגבי הורדת מחירי הארנונה למשרתי מילואים."},{"u":4,"n":83,"t":"קוף","m":"חור בראש המחט להשחלת חוט.","e":"אבי לא מצליח להשחיל את חוט התפירה בקוף ולכן אמי עזרה לו."},{"u":4,"n":84,"t":"קוצב","m":"קובע מידה וכמות לדבר.","e":"השנה קצבה הממשלה תקציב חינוך גדול יותר מבכל שנה שקדמה לה."},{"u":4,"n":85,"t":"קוצה","m":"אגודת שיער, תלתל.","e":"קוצת שיערי נצבעה בזהב בזמן שקיעת השמש."},{"u":4,"n":86,"t":"קוצו של יוד","m":"עיסוק בפרטי פרטים, דבר קטן מאוד וחסר חשיבות.","e":"אמור את העיקר ואל תתעכב על קוצו של יוד."},{"u":4,"n":87,"t":"קור","m":"1. חוט דקיק שהעכביש מפריש כדי ליצור רשת ללכידת חרקים. 2. משל לדבר רופף וחלש.","e":"טווית קורי העכביש הינה מלאכת אומנות ממש."},{"u":4,"n":88,"t":"רוגטקה","m":"כלי נשק קר הבנוי מגומייה מתוחה על שני צדיו של מוט מפוצל.","e":"הילדים שלחו זה על זה אבנים בעזרת הרוגטקה."},{"u":4,"n":89,"t":"רוטן","m":"מתלונן, מתמרמר בעיקר בלחישה, הוגה מילים באופן לא ברור מתוך תרעומת ורוגז.","e":"הילד לא הפסיק לרטון על האוכל שאי מו הכינה."},{"u":4,"n":90,"t":"רוכס","m":"סוגר בקרס או בכפתורים או ברוכסן, מחבר, מצרף.","e":"האדון רכס את מכנסיו."},{"u":4,"n":91,"t":"שובך","m":"תיבה או מבנה למגורי יונים.","e":"בחצר ביתו בנה שובך ליונים."},{"u":4,"n":92,"t":"שווה בנפשך","m":"תדמיין לך, תאר לך.","e":"שווה בנפשך איזה נזק יכל להיגרם אם היו מוציאים לפועל את תכניתם הזדונית."},{"u":4,"n":93,"t":"שוחה","m":"בור, חפירה, מלכודת חפירה.","e":"האיכרים חפרו שוחות על מנת לזרוע את השדה."},{"u":4,"n":94,"t":"שוכך","m":"נחלש, נרגע, מתמעט.","e":"\"וחמת המלך שככה\" (אסתר, ז', י')."},{"u":4,"n":95,"t":"שומה","m":"בליטה כהה ובולטת על פני העור.","e":"אפשר לזהות את גבריאלה בקלות לפי השומה שעל לחייה."},{"u":4,"n":96,"t":"שומה עליו","m":"מוכרח, חייב, חובה מוטלת עליו.","e":"שומה על המורה להחדיר בתלמידים סקרנות."},{"u":4,"n":97,"t":"תובעני","m":"דיבור או מבע שיש בו משום תביעה או דרישה.","e":"ירון תובעני ואינו מתחשב בצורכי האחרים."},{"u":4,"n":98,"t":"תוואי","m":"1. מסלול, דרך. 2. חלק מסומן של שטח שייסלל עליו כביש.","e":"לפני היציאה לטיול בדקנו את תוואי הדרך."},{"u":4,"n":99,"t":"תחפיף","m":"שמפו.","e":"שטפתי את שיערי בתחפיף בעל ניחוח הדרים."},{"u":4,"n":100,"t":"תיבת פנדורה","m":"משל לסוד תמים לכאורה שגילויו עשוי לחשוף פשעים או פרשיות מביכות, מקור צרות ופורענויות.","e":"הדלפת הפרטים החשאיים עלולה לפתוח תיבת פנדורה רצינית."},{"u":5,"n":1,"t":"אינטרס","m":"טובת הנאה, עניין, תועלת.","e":"פרסום המידע המודיעיני נוגד את אינטרס הביטחוני של המדינה."},{"u":5,"n":2,"t":"אינפלציה","m":"תהליך עליית מחירים.","e":"אינפלציה הינה אחת הסכנות האורבות עת ניהול מדיניות כלכלית שגויה במדינת ישראל."},{"u":5,"n":3,"t":"אישוש","m":"ביסוס, אימות, אישור.","e":"החוקר אישש את טענתו עת חקירתו."},{"u":5,"n":4,"t":"אכול","m":"השחתה של מתכת בתהליך כימי, קורוזיה.","e":"המזלג הייתה מאוכלת ולכן לא ניתן לאכול איתה עוד."},{"u":5,"n":5,"t":"אל יתהלל חגר כמפתח","m":"אל לאדם להתרברב ולהתפאר במעשים שטרם ביצע אותם בהצלחה.","e":"מבקר המדינה דרש מהמועמדים לראשות הממשלה לא לומר דברים שאין ביכולתם לבצע והפציר – אל יתהלל חגר כמפתח."},{"u":5,"n":6,"t":"אלגנטי","m":"הדור, לבוש ומסודר בטוב טעם.","e":"לעורך דין זה תמיד מראה אלגנטי."},{"u":5,"n":7,"t":"אלטרואיזם","m":"זולתנות, אהבת הזולת יתר על המידה, העדפת טובת הזולת על טובתך האישית.","e":"חבריי אלטרואיסטים ולכן דואגים לי יתר על המידה."},{"u":5,"n":8,"t":"אליבא","m":"לפי, על פי, לשיטת, לדעת, לפי דבריו של.","e":"שמעון טוען כי ראה את ראובן אמש, אך אליבא ראובן לא כך הדבר."},{"u":5,"n":9,"t":"אליבי","m":"ראיה שהנאשם מביא כדי להוכיח שלא נכח במקום הפשע בשעת ביצועו.","e":"החשוד סיפק למשטרה אליבי מוצק ועל כן שוחרר."},{"u":5,"n":10,"t":"אליטה","m":"עילית, המעמד העליון. קבוצה של אנשים בעלי כוח כלכלי השולטים בכלכלה, פוליטיקה ובמידע.","e":"מאפייניה הייחודיים של קבוצת אליטה מזכים אותה ביחס מועדף על פני יתר החברה."},{"u":5,"n":11,"t":"אליטיסטי","m":"עליתני, אמונה או גישה הגורסת שאליטה היא קבוצה מצומצמת של אנשים המחזיקה בייחוד מסוים מצד כישוריה או מצד מוצאה.","e":"האליטיזם \"נשפך\" ממך, גערה יערה בבן זוגה מיכאל עת אמר לה כי לעולם לא יילמד במכללה."},{"u":5,"n":12,"t":"בכי תמרורים","m":"בכי מר, בכי גדול, התייפחות.","e":"לאחר הפסד קבוצת הכדורגל באליפות, בכו האוהדים בכי תמרורים."},{"u":5,"n":13,"t":"בכל רמ״ח אבריו","m":"בכל גופו ונפשו, כל כולו, בכל מאודו.","e":"עובד מסור צריך להתחייב לעבודתו בכל רמ״ח אבריו."},{"u":5,"n":14,"t":"בכפיפה אחת","m":"ביחד, בצוותא.","e":"סיימנו את עבודת ההגשה בכפיפה אחת."},{"u":5,"n":15,"t":"בכר","m":"ולד של גמל.","e":"הנאקה מסוגלות להניק את הבכר במשך ימים רבים ללא שתייה."},{"u":5,"n":16,"t":"בלדה","m":"שיר לירי המבוסס על אגדה או על מסורת עם.","e":"שאול טשרניחובסקי כתב בלדות על שאול המלך. את רובן אני זוכר עד עצם היום הזה."},{"u":5,"n":17,"t":"גילדה","m":"אגודה של אנשים בעלי אינטרס משותף.","e":"גילדת הסוחרים דרשה הפחתת מיסוי על הסחר הימי."},{"u":5,"n":18,"t":"גלב","m":"ספר.","e":"לאחר ששיערי ארך הלכתי לעופר, חברי הגלב, להסתפר."},{"u":5,"n":19,"t":"גלובליזציה","m":"הפיכה לכלל עולמי בכל תחומי החיים.","e":"הסכמי סחר בין לאומיים מבצעים גלובליזציה בכלכלה העולמית."},{"u":5,"n":20,"t":"דטרמיניזם","m":"אמונה בקיום סיבה חיצונית לכל המתרחש בטבע ולרצון האדם.","e":"בעולם דטרמיניסטי אין שום אקראיות."},{"u":5,"n":21,"t":"דיאלקט","m":"ניב מבטא, וריאציה של לשון המיוחסת לאזור מסוים או לאוכלוסייה מסוימת, להג, פטפוט.","e":"חוקרי המודיעין סברו כי הדיאלקטיקה במדינות ערב השתנתה במרוצת מא ות השנים האחרונות."},{"u":5,"n":22,"t":"דידקטי","m":"ששייך לתורת ההוראה, לימודי, חינוכי.","e":"המדריך הדגים דרך דידקטית מצוינת להעביר את הכמות הרבה של המידע בזמן קצוב ובאופן מעניין."},{"u":5,"n":23,"t":"הכצעקתה","m":"האם הדברים באמת חמורים כפי שמתקבל הרושם?","e":"אם הגיעו כל כך הרבה תלונות של אזרחים, יש לבדוק בדחיפות הכצעקתה."},{"u":5,"n":24,"t":"הלבין את פניו","m":"בייש,העליב,בזה,השפיל.","e":"השוטר הלבין את פניו של אדם חף מפשע עת עצר אותו על לא עוול בכפו."},{"u":5,"n":25,"t":"הלימה","m":"(1) התאמה. (2) הכאה, הרבצה, דפיקה.","e":"השמלה הולמת אותך, רעייתי היקרה, אני מקווה שתשכילי להתלבש כך מידי יום ביומו."},{"u":5,"n":26,"t":"הלעטה","m":"פיטום, האבסה, האכלה בכמות מרובה.","e":"החוואי הלעיט את הפרות יתר על המידה, כך ללא ספק."},{"u":5,"n":27,"t":"המיה","m":"קול, נהימה.","e":"המית חיות המדבר נשמעת מידי לילה במדבר יהודה."},{"u":5,"n":28,"t":"השתמטות","m":"התחמקות ממילוי חובה.","e":"יוני השתמט מגיוס לצבא."},{"u":5,"n":29,"t":"זוטא","m":"קטן, זעיר.","e":"מדוע הטרדתני בעניין זוטא זה?"},{"u":5,"n":30,"t":"חלד","m":"עולם, תבל, תקופת חיים של בן אדם.","e":"\"שמעו זאת כל העמים האזינו כל ישבי חלד\" (תהילים, מט', ב')."},{"u":5,"n":31,"t":"חלום באספמיה","m":"חלומות בלתי מציאותיים, שלא ניתן לממשם.","e":"יורם רוצה לקנות לעצמו רכב יוקרה, במצבו הנוכחי הוא חולם חלומות באספמיה."},{"u":5,"n":32,"t":"חלכאי","m":"עלוב, מסכן.","e":"התחנה המרכזית בתל אביב מלאה בחלכאים."},{"u":5,"n":33,"t":"חלק הארי","m":"החלק העיקרי.","e":"השיחה גלשה למקומות לא ענייניים ויושבי השולחן שכחו את החלק הארי שלה."},{"u":5,"n":34,"t":"טיב","m":"(1) איכות. (2) אופי. (3) מהות.","e":"טיבו של יין נמדד בזמנו בתוך החבית."},{"u":5,"n":35,"t":"טין","m":"עפר שקוע באפיקי נחלים ומשמש חומר ליצירת כלים, בוץ.","e":"טיילנו בנחלי הצפון ורגלינו צופו בטין."},{"u":5,"n":36,"t":"יערן","m":"שומר יערות, מי שמגדל עצי יער.","e":"היערן קם השכם בבוקר על מנת לבצע את עבודתו נאמנה."},{"u":5,"n":37,"t":"יפעה","m":"יופי רב, הדר.","e":"יפעת שונית האלמוגים מרהיבה."},{"u":5,"n":38,"t":"יצא בשן ועין","m":"יצא בנזק כבד, יצא בהפסד גדול.","e":"הימורו של משה בקזינו גרם לו לצאת בשן ועין."},{"u":5,"n":39,"t":"כיל","m":"כוונן כלי מדידה, ביצע התאמות.","e":"הטכנאי כיל את מכשיר הטלפון."},{"u":5,"n":40,"t":"כל אימת","m":"כל הזמן, בכל פעם.","e":"כל אימת שיורד גשם אין באפשרותי לתלות כביסה."},{"u":5,"n":41,"t":"כל בר בי רב","m":"כל אדם, כל אחד.","e":"כל בר בי רב יודע פעולות חשבון בסיסיות."},{"u":5,"n":42,"t":"כל הפוסל במומו פוסל","m":"כל מי שפוסל אחרים, פוסל אותם כיוון שהוא מזהה בהם פגם שיש בו.","e":"הפסק לבקר את מעשיי ואותי בכל הזדמנות. זכור שכל הפוסל במומו פוסל."},{"u":5,"n":43,"t":"לדידי","m":"לדעתי, מבחינתי.","e":"הביקורות לא היו נלהבות, אך לדידי זו הייתה הצלחה."},{"u":5,"n":44,"t":"לואט","m":"לוחש.","e":"הילד לואט לחברו סוד."},{"u":5,"n":45,"t":"מינות","m":"כפירה באל, בדת ובתורה.","e":"הכנסייה מגנה אנשים החוטאים במינות ודורשת שיבואו על עונשם."},{"u":5,"n":46,"t":"מיתוס","m":"(1) אגדה על מעשי האלים בימי קדם, תופעות טבע ומאורעות העוסקים בשאלות הקיום המהותיות. (2) דבר אגדי שלא היה ולא נברא.","e":"האמונה בחייזרים בגדר מיתוס ולכן אין לייחס חשיבות למידע כוזב על נושא זה."},{"u":5,"n":47,"t":"מכבנה","m":"סיכה לשיער.","e":"עצבתי את שיערי בעזרת מכבנה."},{"u":5,"n":48,"t":"מכבש","m":"מכשיר או מכונה להפעלת לחץ ודחיסה.","e":"לאחר סלילת הכביש נסע עליו המכבש כדי ליישרו."},{"u":5,"n":49,"t":"מכורה","m":"מולדת, מקום מוצא.","e":"הגעגועים למכורתו הדירו שינה מעיניו."},{"u":5,"n":50,"t":"מכמין","m":"מחביא, מטמין, מסתיר.","e":"האב הכמין את האפיקומן לפני שילדי הבית ימצאוהו."},{"u":5,"n":51,"t":"מכמן","m":"אוצר, מטמון, סוד.","e":"מכמנו של מלך מצריים לא התגלה עד היום הזה."},{"u":5,"n":52,"t":"מלאם","m":"רכוש פרטי שנהפך לרכוש לאומי, מופקע לטובת המדינה.","e":"בזמן המלחמה רכבים פרטיים הולאמו לטובת המדינה."},{"u":5,"n":53,"t":"מלודרמה","m":"מחזה דרמטי הפונה אל רגשות הצופים באמצעים רגשניים ומעורר רגשנות מופרזת.","e":"צפינו במחזה מלודרמטי בתיאטרון ויצאנו עם מדמעות."},{"u":5,"n":54,"t":"מלוחית","m":"סלט.","e":"לארוחת הערב אכלתי מלוחית מתובלת."},{"u":5,"n":55,"t":"מלחלח","m":"מרטיב קצת, גורם לדבר שיהיה לח.","e":"הכלב מלחלח את גופו כדי לקררו."},{"u":5,"n":56,"t":"מלנכוליה","m":"דכאון קשה וממושך, עיצבון, מרה שחורה.","e":"לאחר הפסדו באולימפיאדה, המתאבק שקע מלנכוליה עמוקה."},{"u":5,"n":57,"t":"מן הפח אל הפחת","m":"מצרה אחת לצרה אחרת יותר גדולה.","e":"נפלנו מן הפח אל הפחת, המכונית שקנינו לא רק פגומה אלא גם גנובה."},{"u":5,"n":58,"t":"מני אז","m":"מאז, מהזמן ההוא, מלפני זמן רב.","e":"מה הסיבה שאין לו רישיון? הרי מני אז החל את שיעורי הנהיגה ועדיין לא סיים."},{"u":5,"n":59,"t":"מנתץ","m":"מנפץ, מרסק.","e":"הכוס נוצתה לרסיסים בגלל רעידת האדמה."},{"u":5,"n":60,"t":"נטול","m":"שאין בו דבר מה, ללא.","e":"הקפה נטול קופאין."},{"u":5,"n":61,"t":"נטש","m":"(1) פורץ, מתפשט. (2) נעזב, ננטש.","e":"קרב קשה נטש בין הוויקינגים לאנגלו-סקסונים."},{"u":5,"n":62,"t":"ניואנס","m":"(1) דקויות, רמזים עדינים, בין השורות. (2) גוון, הבדל קל בצבע או בצליל.","e":"בדבריו היה נתן לשמוע המון ניואנסים המכוונים לבחירה בו."},{"u":5,"n":63,"t":"ניח","m":"(מכשיר) קבוע במקומו, כגון טלפון או כלי ירייה.","e":"חסרון של מחשב ניח הוא שאין באפשרותנו להזיז אותו ממקום למקום."},{"u":5,"n":64,"t":"ניחן ב-","m":"(1) התאפיין ב-,הייתה לו תכונה. (2) מוענק לו, יש לו.","e":"הוא ניחן ביכולת טיפוס מרשימה."},{"u":5,"n":65,"t":"סיח","m":"סוס צעיר, ולד של סוס.","e":"הסוסה המליטה סיח."},{"u":5,"n":66,"t":"סילוף","m":"מסירת עובדות שלא בנאמנות למציאות, הוצאה מהקשר.","e":"עורכת הדין מסלפת את האמת כדי להגן על מרשה."},{"u":5,"n":67,"t":"סימולציה","m":"הדמיה, חיקוי התנאים האמיתיים לשם תרגול.","e":"בצבא מבצעים סימולציות רבות של מצבי לחימה כדי להביא את הלוחמים כמה שיותר קרוב למצב אמת."},{"u":5,"n":68,"t":"סימפוזיון","m":"כינוס מיוחד להשמעת דעות בנושא מסוים,בעיקר בנושאי מדע וחברה.","e":"בעקבות הסימפוזיון שמרצי החוג לפיזיקה קיימו הוחלט לשלוח חללית ישראלית לחקור את הירח."},{"u":5,"n":69,"t":"סימפוניה","m":"יצירה מוזיקלית לתזמורת, בדרך כלל בעלת ארבעה פרקים.","e":"האזנתי לסימפוניה החמישית של בטהובן."},{"u":5,"n":70,"t":"על רגל אחת","m":"בקצרה, בחיפזון.","e":"התלמיד הכין את שיעורי הבית על רגל אחת לאורך כל השנה ולכן ציוניו היו נמוכים."},{"u":5,"n":71,"t":"עלה נדף","m":"חלש וחסר אונים.","e":"אדם זה הוא כמו עלה נדף, ואין לו האומץ למחות."},{"u":5,"n":72,"t":"עלה על יצועו","m":"שכב לישון.","e":"החוואי עלה על יצועו בשעה מוקדמת מכיוון שקץ עוד לפני עלות השחר."},{"u":5,"n":73,"t":"עלוה","m":"כל עלי הצמח.","e":"עלות העץ נשרה בסתיו."},{"u":5,"n":74,"t":"פיקטיבי","m":"בדוי, עשוי למראית עין, מדומה, דמיוני, מזויף.","e":"הזוג נישא באופן פיקטיבי על מנת לקבל אזרחות במדינה."},{"u":5,"n":75,"t":"פיר","m":"חפירה, מנהרה, מכרה.","e":"בבניין החדש חפרו פיר למעלית."},{"u":5,"n":76,"t":"פיתום","m":"אדם המדבר מהבטן בלי להזיז את שפתיו.","e":"אמנים המשתמשים בבובה בעת שהם מדברים דיבור פיתום ויוצרים אשליה שהבובה היא שמדברת."},{"u":5,"n":77,"t":"פכים קטנים","m":"פרטים קטנים, זוטות.","e":"בעבודה זו יש לשים לב לפכים קטנים ביותר."},{"u":5,"n":78,"t":"פלאח","m":"איכר, חקלאי. חסר תרבות, גס רוח.","e":"בשדות עובדים כמה פלאחים מהכפר."},{"u":5,"n":79,"t":"פלבאי","m":"איש ההמון, אדם פשוט, נחות מעמד.","e":"אין חולקים על כך שיואב אדם פלבאי."},{"u":5,"n":80,"t":"פריון","m":"(1) כמות, הספק, תפוקה, תוצרת. (2) פוריות – יכולת להביא צאצאים.","e":"משהחלה עלייה בפריון העבודה במדינה, השתפרה כלכלתה."},{"u":5,"n":81,"t":"צידוד","m":"תמיכה בדעה או מחלוקת, עמידה לצד מישהו.","e":"העם צידד בטיעונו של ראש הממשלה."},{"u":5,"n":82,"t":"ציה","m":"מדבר, שממה, ישימון.","e":"במערב הארץ יש שפע של נהרות ונחלים, ובמזרחה – ציה."},{"u":5,"n":83,"t":"קטום","m":"שקצהו חתוך.","e":"יש לקטום את קצהו של פרי זה כדי לאכול אותו."},{"u":5,"n":84,"t":"קטנוני","m":"(1) דבר חסר חשיבות. (2) אדם המייחס חשיבות לדברים פחותי ערך.","e":"הוא קטנוני ומתעסק בתפל במקום בעיקר."},{"u":5,"n":85,"t":"קטר","m":"הקרון הראשון ברכבת המושך את שאר הקרונות.","e":"הקטר עצר ובעקבותיו כל שאר הקרונות."},{"u":5,"n":86,"t":"קיטוב","m":"ניגוד קיצוני בין שני דברים, פילוג, הפרדה.","e":"החברה הפכה מקוטבת בעקבות גל המחאות האחרון."},{"u":5,"n":87,"t":"קיקיוני","m":"שנעשה בפזיזות ואין לו קיום לאורך זמן, ארעי.","e":"תוכניתם אלא תוכנית קיקיונית."},{"u":5,"n":88,"t":"קלון","m":"בזיון, חרפה, השפלה.","e":"מעשיו הביאו קלון על משפחתו."},{"u":5,"n":89,"t":"רוצע","m":"מנקב, דוקר.","e":"צריך לרצוע חור נוסף בחגורה כדי שיהיה אפשר לסגרה."},{"u":5,"n":90,"t":"רחיים","m":"זוג אבנים המונחות אחת על השנייה, התחתונה קבועה והעליונה סובבת עליה,","e":"\"קחי רחים וטחני קמח\" (ישעיהו, מז', ב')."},{"u":5,"n":91,"t":"רחיים על צוארו","m":"יש עליו עול כבד.","e":"שמירת סוד כמוס זה הינו כרחיים על צוארי ולכן אני מוכרח לספרו."},{"u":5,"n":92,"t":"רפלקסיבי","m":"(1) קשור לתגובה לא רצונית של הגוף(רפלקס). (2) מאפיין פועל שנעשה על עצמו.","e":"התלבש הוא פועל רפלקסיבי, משום שמשמעותו הלביש את עצמו."},{"u":5,"n":93,"t":"שומר סף","m":"(1) שוער. (2) כינוי לאנשים שתפקידם לשמור ולהורות על כללי התנהגות בתחומים מסוימים ובמוסדות שלטון ולפקח על קיומם.","e":"כשנכנסנו לבניין שומר הסף קיבל את פנינו ופתח לנו את הדלת."},{"u":5,"n":94,"t":"שועה","m":"נותן את דעתו, בעיקר לאדם המבקש עזרה.","e":"\"וישע ה' אל הבל ואל מנחתו\" (בראשית, ד', ד')."},{"u":5,"n":95,"t":"שזירה","m":"יצירת חוט על ידי שילובם של סיבים זה בזה בתנועה סיבובית. שילוב זה בזה.","e":"מוכרת הפרחים שזרה זר מפרחים שביקשתי."},{"u":5,"n":96,"t":"שחוח","m":"כפוף, בראש מורכן.","e":"גבו היה שחוח בגלל עבודתו המפרכת."},{"u":5,"n":97,"t":"שחון","m":"חם ויבש, מחוסר גשמים.","e":"אזור זה שחון מאוד ולכן הצמחייה בו דלה."},{"u":5,"n":98,"t":"תכלה","m":"תכלית, סוף, קץ,גבול.","e":"כל מה שיש לו תכלה יש לו תחילה."},{"u":5,"n":99,"t":"תכלית","m":"(1) מטרה,יעד סופי. (2) מידה מרובה (תכלית השלמות – חסר פגמים). (3) סיום, קצה.","e":"\"כי אם נאמר שיש תכלית לחיים, המשמעות של כך היא, שלחיים יש מטרה מסוימת\""},{"u":5,"n":100,"t":"תלאובה","m":"להט השמש, יובש, חום מדברי.","e":"התלאובה הייתה קשה מנשוא ולכן הפסקנו את הטיול."},{"u":6,"n":1,"t":"אללי","m":"מילת קריאה להבעת צער.","e":"אללי לי אם לא אעבור את המבחן הקרוב, איני רוצה להיכשל ולהישאר שנה."},{"u":6,"n":2,"t":"אלמה","m":"אגודת שיבולים, צרור קרני אור.","e":"ילדי הגן הכינו אלמות שיבולים לכבוד חג השבועות."},{"u":6,"n":3,"t":"אלמנט","m":"רכיב,חלק,מרכיב, יסוד.","e":"האלמנט המרכזי בגוף האדום הוא מים."},{"u":6,"n":4,"t":"אלמנך","m":"לוח שנה.","e":"אחד מראשוני ממציאי האלמנכים היה האמריקני בנג'מין פרנקלין בן המאה ה-81."},{"u":6,"n":5,"t":"אלנטית","m":"מגבת.","e":"לאחר שיצא מבריכת השחייה התעטף באלנטית."},{"u":6,"n":6,"t":"אמביוול נטי","m":"דו משמעי, שיש בו רגשות מנוגדים בעת אחת.","e":"רגשותיי אמביוולנטים כלפי סרט זה, מצד אחד אני לא אוהב את ז'אנר הפעולה ומצד שני הסרט ריתק אותי לכיסא."},{"u":6,"n":7,"t":"אמפתיה","m":"רגש של הזדהות עם האחר, חיבה.","e":"חברתי בכתה לאחר שפוטרה מעבודתה וחשתי אמפתיה כלפיה."},{"u":6,"n":8,"t":"אמרי שפר","m":"דברי חוכמה, פתגמים.","e":"המורה ציטטה אמרי שפר המיוחס לפילוסוף וההוגה המפורסם."},{"u":6,"n":9,"t":"אמת מים","m":"תעלה להובלת מים.","e":"בתקופת המצור על ירושלים, בנו אמת מים על מנת להוביל מים לעיר."},{"u":6,"n":10,"t":"אמתחת","m":"שק גדול, ילקוט.","e":"קניתי לבני אמתחת חדשה לכבוד תחילת שנת הלימודים."},{"u":6,"n":11,"t":"אנונימי","m":"עלום שם, ששמו אינו מוכר.","e":"כתבי הסתרים נכתבו על ידי אנונימי ועד היום אין החוקרים יודעים מי המחבר."},{"u":6,"n":12,"t":"בלשן","m":"מומחה לשון, חוקר לשון או שפות.","e":"אבשלום קור הינו בלשן ישראלי המתמחה בשמות משפחה."},{"u":6,"n":13,"t":"במישרין","m":"באופן ישיר.","e":"אור אמר לקרן במישרין כל מה שחשב עליה."},{"u":6,"n":14,"t":"במפגיע","m":"בתוקף, בלי ויתורים, נמרצות.","e":"העובדים דורשים במפגיע את זכויותיהם."},{"u":6,"n":15,"t":"במשורה","m":"במידה מעטה.","e":"יש להקפיד לאכול לחם במשורה, שכן כמות גדולה עלולה להזיק לבריאות."},{"u":6,"n":16,"t":"בן בליעל","m":"רשע, נבל, רע לב.","e":"מוכר החנות היה בן בליעל מכיוון שגבה סכומים מופקעים מאנשים תמימים."},{"u":6,"n":17,"t":"בן לויה","m":"שותף מלווה.","e":"כלבו שימש כבן לויה לדרך."},{"u":6,"n":18,"t":"גלום","m":"נמצא בתוך, כלול.","e":"גלומות בו תכונות נהדרות."},{"u":6,"n":19,"t":"גלוסקמה","m":"ארון קבורה.","e":"גלוסקמתו של החייל המנוח הייתה מעוטרת."},{"u":6,"n":20,"t":"גלת הכותרת","m":"השיא, הפסגה, החלק החשוב ביותר.","e":"גלת הכותרת של איינשטיין הייתה תורת היחסות."},{"u":6,"n":21,"t":"דיונה","m":"בעברית: חולית. גבעת חול.","e":"בדרום אמריקה ניתן לעשות סקי על דיונות חול."},{"u":6,"n":22,"t":"דיוקן","m":"תיאור אומנותי של פני האדם על ידי ציור, פסל או צילום.","e":"הצייר וינסנט ואן גוך צייר מעל לשלושים דיוקנאות עצמיים של פניו."},{"u":6,"n":23,"t":"דיצה","m":"שמחה, ששון.","e":"חשתי דיצה כשקיבלתי הודעת קבלה לאוניברסיטה."},{"u":6,"n":24,"t":"דל","m":"(1) עני, אביון, רש. (2) מועט, פחות ערך.","e":"שכלו דל וקשה ללמדו."},{"u":6,"n":25,"t":"המציאות טפחה על פניו","m":"נאלץ להתפכח מדמיונותיו.","e":"שנים חשבתי כי אכילת ממתקים הכרחית לבריאות אך המציאות טפחה על פניי."},{"u":6,"n":26,"t":"הן","m":"מילת הסכמה.","e":"היא אמרה לי הן כאשר הזמנתי אותה."},{"u":6,"n":27,"t":"הניא","m":"שכנע, משפיע ומונע שלא לעשות.","e":"הגשם הניא את הילדים מלצאת לשחק בחוץ."},{"u":6,"n":28,"t":"הסרת לוט","m":"חשיפה של משהו, הרמת כיסוי.","e":"טקס סמלי שבו מרימים כיסוי מעל שלט או יצירת אומנות, לרוב לשם חניכה של מבנה חדש נקרא טקס הסרת הלוט."},{"u":6,"n":29,"t":"הסתגלות","m":"היכולת להתרגל למצבים ותנאים חדשים.","e":"דובי הקוטב משילים את פרוותם ובכך מסתגלים להתחממות הקוטב."},{"u":6,"n":30,"t":"התאבק בעפר רגליו","m":"ללמד ממנו.","e":"הסו-שף התאבק בעפר רגליו של השף ולבסוף נהפך לשף גם הוא."},{"u":6,"n":31,"t":"זך","m":"נקי, טהור, צלול, צח.","e":"שמן הזית המלאכותי זך יותר מהטבעי, אך בריא פחות."},{"u":6,"n":32,"t":"חמה","m":"כעס גדול, זעם, קצף.","e":"חטאם של בני ישראל עוררו את חמתו של אלוהים."},{"u":6,"n":33,"t":"חמור גרם","m":"טיפש, עקשן.","e":"אתה חמור גרם! לעולם לא תצליח בלימודיך!"},{"u":6,"n":34,"t":"חמס","m":"עוול, גזל, שוד.","e":"החמס שהתבצע בבנק ובו נגנב סכום גדול של כסף, גרם להגברת מערך האבטחה באזור."},{"u":6,"n":35,"t":"חמרמרת","m":"\"הנג- אובר\".","e":"אנשים המרבים לשתות אלכוהול יחושו ביום שלמחרת חמרמרת."},{"u":6,"n":36,"t":"טינה","m":"שנאה עזה.","e":"שומר טינה אדם שאינו מתרצה."},{"u":6,"n":37,"t":"טירה","m":"עפיפון.","e":"הילדים העיפו את טירה שהכינו בגן."},{"u":6,"n":38,"t":"יצא המרצע מן השק","m":"התגלה, נחשפה האמת שניסו להסתירה.","e":"רק אחרי המון שנים יצא המרצע מן השק והוא נעמד לדין."},{"u":6,"n":39,"t":"יצא מכליו","m":"התפרץ, איבד את שלוותו.","e":"כששמע יוסי שפוטר מעבודתו יצא מכליו וגער על כל מי שנקרה בדרכו."},{"u":6,"n":40,"t":"יצהר","m":"שמן זך, שמן טרי.","e":"\"והיא לא ידעה כי אנכי נתתי לה הדגן והתירוש והיצהר \" (הושע, ב', י')."},{"u":6,"n":41,"t":"כלה","m":"כיסוי, רשת מעל למיטה למניעת עקיצות יתושים וזבובים.","e":"המטיילים ישנו תחת כילות בגלל כמות היתושים."},{"u":6,"n":42,"t":"כלונס","m":"מוט, עמוד, קביים.","e":"ענפי הצמח התפתלו סביב הכלונס שהוצב בערוגה."},{"u":6,"n":43,"t":"כליל","m":"שלם, גמור, שאין חסר בו כלום.","e":"הנייר נשרף כליל ולכן עלינו לשכתבו מחדש."},{"u":6,"n":44,"t":"כלימה","m":"חרפה, בושה.","e":"הפושע חש כלימה לאחר שהבין את חומרת מעשיו."},{"u":6,"n":45,"t":"לוחך","m":"תולש בפיו(את העשב) ואוכל.","e":"הפרות לוחכות עשב בשדה."},{"u":6,"n":46,"t":"ליברליזם","m":"השקפת עולם הדוגלת בהשלטת עקרונות החירות והשוויון בין בני האדם.","e":"המפלגה הזו הם אנשים ליברלים ולא שמרנים."},{"u":6,"n":47,"t":"מסה","m":"(1) מאמר על נושא עיוני(בגישה סובייקטיבית). (2) ניסיון, מבחן. (3) ייאוש, צער.","e":"פוגל קיבץ מסה זו את רעיונותיו המרכזיים."},{"u":6,"n":48,"t":"מסוג","m":"(1) ממוין לפי סוגים. (2) מוגדר לפי דרגת הסודיות(בצנזורה הצבאית).","e":"הסיווג הביטחוני של מסמך זה הוא מסוג ביותר ולכן לא כל אדם מורשה לקרוא אותו."},{"u":6,"n":49,"t":"מסכית","m":"(1) מקשיב. (2) שותק.","e":"\"הסכת ושמע ישראל\" (דברים, כז', ט')."},{"u":6,"n":50,"t":"מסמר שער","m":"מחריד, מזעזע.","e":"הידיעה שפורמה במבזק החדשות סמרה את שערי."},{"u":6,"n":51,"t":"מסעד","m":"משענת.","e":"אבי נשען על מסעד הספה."},{"u":6,"n":52,"t":"מסקל","m":"(1) מסלק את האבנים. (2) סוקל, רוגם באבנים.","e":"שבט ההרים מסקל אנשים שנכנסים לשטחו בכך מרחיקם."},{"u":6,"n":53,"t":"מסתופף","m":"(1) מבקר לעיתים קרובות. (2) מוגן, חוסה.","e":"החיות מסתופפות בצל עץ האלון."},{"u":6,"n":54,"t":"מסתת","m":"מחליק ומקציע אבן.","e":"הפסלים באיי הפסחא סותתו עוד לפני שהועברו למקום הימצאם."},{"u":6,"n":55,"t":"מעוז","m":"(1) מקום מבוצר, מחסה. (2) גבורה, חוזק.","e":"הלוחמים התבצרו במעוזם לאחר ההתקפה של האויב."},{"u":6,"n":56,"t":"מעילה","m":"(1) שימוש פרטי בכספי אחרים שלא ברשות. (2) הפרת אמון.","e":"בגידה היא מעילה באמון."},{"u":6,"n":57,"t":"מעמעם","m":"מטושטש, מעורפל, מוכהה, בהיר פחות.","e":"כאשר החל המופע המנורות עומעמו."},{"u":6,"n":58,"t":"מעקש","m":"פיתול בדרך, מכשול.","e":"דרכו של יוסף אל התואר הייתה רצופה מעקשים אך לבסוף צלח בהצטיינות."},{"u":6,"n":59,"t":"מעשנה","m":"ארובה.","e":"הנוצרים מאמינים כי בחג המולד סנטה קלאוס שולח מתנות דרך מעשנות בבתים."},{"u":6,"n":60,"t":"מפח נפש","m":"אכזבה גדולה, ייאוש.","e":"אי קבלתה לעבודה גרמה לה מפח נפש."},{"u":6,"n":61,"t":"מפטיר","m":"(1) אומר דבר בסוף מעשה. (2) משחרר, פוטר.","e":"המפטיר סגר את הכינוס בדברי ברכה ותודה."},{"u":6,"n":62,"t":"ניכור","m":"חוסר שייכות, תחושת זרות.","e":"כשעבר לעיר אחרת הרגיש ניכור כלפי הסביבה החדשה."},{"u":6,"n":63,"t":"נים ולא נים","m":"שינה לא עמוקה ולא רציפה.","e":"הוא שכב במיטתי ונים ולא נים."},{"u":6,"n":64,"t":"סימפטום","m":"תסמין, סימן לליקוי, סימן היכר לתופעה כלשהי.","e":"נדודי שינה הם סימפטום למתח נפשי."},{"u":6,"n":65,"t":"סינתטי","m":"מלאכותי, מזויף, לא אמתי.","e":"רכשנו לגינתנו דשא סינתטי."},{"u":6,"n":66,"t":"עלום","m":"נעלם, לא ידוע, נסתר.","e":"העתיד עלום מעיני."},{"u":6,"n":67,"t":"עמד מנגד","m":"ראה את הנעשה ולא הושיט עזרה.","e":"בעת שהאיש הוכה, כל העוברים ושבים ברחוב עמדו מנגד."},{"u":6,"n":68,"t":"עמום","m":"מטושטש, מעורפל.","e":"בשעות הלילה ראייתי הופכת עמומה וקשה לי לרחוק למרחק."},{"u":6,"n":69,"t":"עמיל","m":"סוכן, מתווך.","e":"כאשר יימכר הבית, העמיל אשר מטפל בענייני המכירה ירוויח עמלה של אחוז וחצי מהמכירה."},{"u":6,"n":70,"t":"פלגמטי","m":"חסר מרץ, אדיש, עצלן.","e":"העובד היה פלגמט ולכן סיים את עבודתו באיחור של שבוע."},{"u":6,"n":71,"t":"פלוני","m":"אדם כלשהו, מישהו, לא ניתן לזהותו, אינו מוכר.","e":"המנוח הינו פלוני ולכן לא הגיע איש להלווייתו."},{"u":6,"n":72,"t":"פלח","m":"(1) משמש כינוי לכל אחד מן החלקים הנפרדים של פרי ההדר העטופים קרום. (2) חלק.","e":"הילד ביקש מאמו פלח מהתפוז שאכלה."},{"u":6,"n":73,"t":"פלחן","m":"טקס דתי ומכלול הפעולות הכלול בו כדי לרצות את האל.","e":"בפלחן האל היווני זאוס, היה נהוג להקריב חזיר."},{"u":6,"n":74,"t":"פלייה","m":"הסרה, פשיטה, הוצאה.","e":"חוטב העצים פלה את פרוותם של הדובים שמצא מתים."},{"u":6,"n":75,"t":"פלך","m":"מחוז, אזור מדיני.","e":"בפלך הצפוני של הארץ נחלים רבים."},{"u":6,"n":76,"t":"ציוויליזציה","m":"(1) חלק התרבות האנושית המתבטא בהתפתחות הטכנולוגיה וכלל מאפייניה. (2) תרבות.","e":"חלק מהציוויליזציה הבודהיסטית הוא התרבות הלמאיסטית אשר רווחת בטיבט."},{"u":6,"n":77,"t":"ציקלון","m":"(1) כינוי לסערה טרופית חזקה. (2) ילקוט, תרמיל.","e":"הציקלון החריב את כל האי ולמזלנו פינו אותנו בזמן."},{"u":6,"n":78,"t":"קלוקל","m":"גרוע, פגום, מקולקל, תפל, חסר ערך.","e":"התייר ביקש חדר ללילה בשפה קלוקלת וכמעט לא מובנת."},{"u":6,"n":79,"t":"קלחת","m":"(1) סיר גדול. (2) מערבולת, מהומה.","e":"בתוך כל הקלחת לא שמעתי את דבריך."},{"u":6,"n":80,"t":"קלפטומניה","m":"נטייה חולנית לגנוב.","e":"קלפטומן אינו בהכרח אדם חסר כל."},{"u":6,"n":81,"t":"קלת","m":"סל לפירות, טנא.","e":"בחג השבועות ממלאים קלתים בפירות."},{"u":6,"n":82,"t":"קמור","m":"עשוי בצורת כיפה, עשוי כקשת הבולטת כלפי חוץ.","e":"למסגדים מבנה כיפה קמורה."},{"u":6,"n":83,"t":"קמין","m":"אח, תנור גדול בנוי בקיר ומוסק בדרך כלל מעצים, תנור.","e":"הקמין בביתי מחמם מאוד."},{"u":6,"n":84,"t":"קרנס","m":"פטיש כבד.","e":"הפועל הלם בברזל בעזרת הקרנס."},{"u":6,"n":85,"t":"רחמנא ליצלן","m":"יצילנו האל, אלוהים ישמור.","e":"רחמנא ליצלן! שיטפון מתקרב."},{"u":6,"n":86,"t":"רטוריקה","m":"אומנות הנאום והשכנוע העוסקת ביכולת השימוש בשפה ציורית ובתכסיסים לשוניים על מנת להעביר מסר או לשכנע את קהל היעד.","e":"שכיחותה של הרטוריקה בנאומים של פוליטיקאים, גבוהה."},{"u":6,"n":87,"t":"ריבה","m":"עלמה, בחורה, נערה.","e":"ריבה יפה זו, הייתה בתו של המלך."},{"u":6,"n":88,"t":"רפרפת","m":"מאכל קינוח המכיל עמילן, פודינג, חביצה.","e":"יושבי השולחן הזמינו רפרפת לקינוח הסעודה."},{"u":6,"n":89,"t":"שחת זמנו לריק","m":"בזבז זמן.","e":"כאשר היה מובטל שחת זמנו לריק ובזבז את כספו."},{"u":6,"n":90,"t":"שיוף","m":"שיוף וגירוד בפצירה והחלקת עץ.","e":"הנגר שיף את השולחן ולאחר מכן צבע אותו."},{"u":6,"n":91,"t":"שיח ושיג","m":"דיון, דיאלוג, משא ומתן.","e":"אין לנהל איתו שיח ושיג מכיוון שאין לו תרבות דיבור."},{"u":6,"n":92,"t":"שכיח","m":"מצוי, נפוץ, שקורה לעיתים קרובות.","e":"מחשב ביתי הוא דבר שכיח בימינו."},{"u":6,"n":93,"t":"שלהי","m":"סוף, החלק האחרון של תקופה מסוימת.","e":"השלכת התחילה בשלהי הקיץ."},{"u":6,"n":94,"t":"שלומיאל","m":"ביש מזל וחסר תושייה, לא יוצלח.","e":"הוא שלומיאל - בכל דבר שהוא נוגע נכשל."},{"u":6,"n":95,"t":"שלח יד בנפשו","m":"התאבד.","e":"הזמר שלח יד בנפשו כשהיה בגילופין."},{"u":6,"n":96,"t":"שלחופה","m":"צב.","e":"השלחופה המבוגר בעולם היה בן מאתיים חמישים וחמש שנים."},{"u":6,"n":97,"t":"שלשלת","m":"(1) שרשרת, שורה של חוליות המחוברות זו בתוך זו. (2) שורה של אירועים הבאים זה אחר זה, השתלשלות. (3) רציפות.","e":"חיית הפרא הייתה קשורה לחומה שלשלות כדי שלא תוכל להשתחרר."},{"u":6,"n":98,"t":"תלי תלים","m":"שפע.","e":"המורה הטיל על תלמידיו תלי תלים של שיעורי בית."},{"u":6,"n":99,"t":"תמוה","m":"מוזר, מפליא, מפתיע, לא מובן.","e":"יציאת הוריו לחופשה הייתה תמוה בעיניו מכיוון שרק חזרו."},{"u":6,"n":100,"t":"תמוכין","m":"(1) תמיכה מוסרית או חוקית. (2) הסתמכות על אדם או על דבר כדי לתת תוקף לפעולה.","e":"המדען לא הצליח למצוא תמוכין לטענותיו ולכן לא קיבל מימון למחקר."},{"u":7,"n":1,"t":"אנוס","m":"(1) מוכרח, נאלץ. (2) יהודי מומר בעל כורחו ושומר מצוות בסתר.","e":"אני אנוס ללכת מכיוון שאני מאחר."},{"u":7,"n":2,"t":"אניגמה","m":"חידה, תעלומה, מסתורין.","e":"כתב סתרים זה הינו אניגמה בעיני החוקרים."},{"u":7,"n":3,"t":"אנין","m":"עדין, בעל טעם מעודן.","e":"השף בעל אנינות טעם ולכן מסעדה זו מצליחה."},{"u":7,"n":4,"t":"אנפילה","m":"נעל בית.","e":"בכניסה לבית היו מונחות אנפילאות מצמר."},{"u":7,"n":5,"t":"אנקה","m":"אנחה, בכי, גניחה.","e":"המטופל השמיע אנקת כאב בזמן הזריקה."},{"u":7,"n":6,"t":"אנקול","m":"קרס, וו שראשו כפוף.","e":"על דלת הכניסה לבית יש אנקול עליו אפשר לתלות מעילים."},{"u":7,"n":7,"t":"אסותא","m":"(1) רפואה. (2) ברכה למתעטש.","e":"אין משיחין בסעודה, ואפילו מי שמתעטש בסעודה אסור לומר לו אסותא."},{"u":7,"n":8,"t":"אסכולה","m":"זרם מדעי, חברתי או חינוכי.","e":"האסכולה החברתית בימי הביניים הייתה מחולקת למעמדות."},{"u":7,"n":9,"t":"אסנה","m":"אסון רב נזק ורב נפגעים, קטסטרופה.","e":"אסנה אירעה במכרה, ורבים נהרגו."},{"u":7,"n":10,"t":"אספלט","m":"בעברית: חמר. זפת, חומר שחור ודביק הנמצא באדמה, משמש לזיפות כבישים, בניה וציפוי גגות.","e":"הכבישים נבנים מאספלט."},{"u":7,"n":11,"t":"אספלנית","m":"תחבושת, אגד, פלסטר.","e":"בזמן אימון נפל החייל ונפצע, החובש שם אספלנית על מקום הפציעה על מנת לעצור את הדימום."},{"u":7,"n":12,"t":"בנפשו הדבר","m":"הדבר חשוב לו ביותר, גורלו תלוי בכך.","e":"אנו חייבים לטפח את הדור הבא ולתת לו חינוך מעולה כי בנפשנו הדבר."},{"u":7,"n":13,"t":"בנקל","m":"בקלות.","e":"מי שמרמה הוא למעשה עצלן, הרוצה להשיג דברים בנקל, ללא מאמץ או במינימום של השקעה."},{"u":7,"n":14,"t":"בעדנא דרתחא","m":"בשעת כעס.","e":"בעדנא דרתחא דנית אינה שולטת בעצמה."},{"u":7,"n":15,"t":"בעינים כלות","m":"בכמיהה רבה, בקוצר רוח.","e":"היא ציפתה לבואו בעינים כלות."},{"u":7,"n":16,"t":
