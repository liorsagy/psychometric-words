n":53,"t":"לא אחת","m":"מדי פעם, מספר פעמים.","e":"אמא נזפה בדניאל ואמרה לו: \"לא אחת ביקשתי ממך לסדר את חדרך לכבוד האורחים שצפויים להגיע, מדוע טרם עשית זאת?\"."},{"u":13,"n":54,"t":"לא בכדי","m":"לא לשווא, לא לחינם.","e":"\"החזאי הודיע שעתיד לרדת גשם ולכן לא בכדי אני אומרת לך לקחת איתך מטריה\"."},{"u":13,"n":55,"t":"לא יסלא בפז","m":"יקר מאוד, בעל ערך רב (לעיתים ערך רגשי).","e":"תרומתם של ארגוני החסד למשפחות הנזקקות לא תסלא בפז."},{"u":13,"n":56,"t":"מאכלת","m":"סכין שחיטה.","e":"\"על שום מה נקראת מאכלת? על שם שאוכלת את הבשר\" (רש\"י בחומש בראשית, כב', ו')"},{"u":13,"n":57,"t":"מבואר","m":"מפורש, מוסבר.","e":"המורה העבירה לנו את החומר באופן מבואר היטב כך שאפילו לא היה צורך לשאול שאלות."},{"u":13,"n":58,"t":"מגבית","m":"גביית כספים בדרך מסודרת למען מטרה.","e":"לקראת החגים, עמותות חסד שונות קיימו אירועי מגבית ברחבי העיר כדי לאסוף תרומות להמשך פעילותן."},{"u":13,"n":59,"t":"מגלב","m":"שוט.","e":"בתחרות רכיבת הסוסים, הרוכבים הניפו מגלבם וכך סימן לסוסים להתחיל ברכיבה."},{"u":13,"n":60,"t":"מדון","m":"ריב, קטטה, עימות.","e":"אביו של יוסי הזהיר אותו להתרחק ממספר חברים שלו. לטענתו, ילדים אלה הם אנשי מדון ולכן עדיף שלא ליצור קשר עימם."},{"u":13,"n":61,"t":"מובאה","m":"ציטוט.","e":"כאשר ברצוני להוכיח את דבריי מתוך מקור כתוב, אכתוב את דברי הכתוב הרלוונטיים בתוך מובאה."},{"u":13,"n":62,"t":"מונוגמיה","m":"שמירת אמונים לבן/בת זוג.","e":"אחד מהתנאים הבסיסיים להצלחת הזוגיות היא מונוגמיה של שני בני הזוג."},{"u":13,"n":63,"t":"מוסרה","m":"חבל לרתימת בהמה לעגלה.","e":"לפני יציאתו לדרך, חיזק העגלון את מוסרות מרכבתו."},{"u":13,"n":64,"t":"מחד גיסא","m":"מצד אחד.","e":"מחד גיסא אני נהנה מאוד מעבודתי הנוכחית. מאידך, השכר אינו מספיק לי."},{"u":13,"n":65,"t":"מיאוס","m":"גועל, תיעוב.","e":"מאסתי בעבודתי הנוכחית ולכן אני מחפש עבודה חדשה."},{"u":13,"n":66,"t":"מכונף","m":"בעל כנפיים.","e":"המאפיין המשותף לכל סוגי העופות הוא היותם מכונפים."},{"u":13,"n":67,"t":"מליץ יושר","m":"סנגור, מלמד זכות.","e":"איתי הליץ יושר על אחיו וסיפר להוריהם שאיתמר פינה בעצמו את האשפה."},{"u":13,"n":68,"t":"נאור","m":"(1) מלא אור. (2) משכיל. (3) כינוי לאלוקים.","e":"המרצה בכיתתי הינו אדם נאור המתמצה בתחומים רבים."},{"u":13,"n":69,"t":"נבדל","m":"שונה מאחרים.","e":"אלירן אינו אוהב לשחק כדורגל ובכך נבדל מחבריו לכיתה."},{"u":13,"n":70,"t":"נדדה שנתו","m":"לא הצליח להירדם.","e":"\"בלילה ההוא נדדה שנת המלך\" (מגילת אסתר, ו', א')"},{"u":13,"n":71,"t":"נחה עליו הרוח","m":"קיבל השראה.","e":"כאשר נחה עליו הרוח, הוא מצליח לכתוב שירים נהדרים."},{"u":13,"n":72,"t":"נחתום","m":"אופה.","e":"הנחתום בשכונתנו יודע להכין דברי מאפה טעימים במיוחד."},{"u":13,"n":73,"t":"נכלם","m":"מבויש, נעלב.","e":"ליאם הקטן עמד נכלם לאחר שקיבל עונש."},{"u":13,"n":74,"t":"סאון","m":"רעש, המולה.","e":"מי שיגיע למרכז העיר ביום שישי יגלה כי נמצאים בו המון אנשים ויש סאון רב."},{"u":13,"n":75,"t":"סביר","m":"מתקבל על הדעת, אפשרי, הגיוני.","e":"אחזור מהעבודה בשעה ארבע אחה\"צ ולכן סביר שנוכל להיפגש בשעה חמש."},{"u":13,"n":76,"t":"סגפן","m":"מתענה, מתנזר.","e":"אנורקסיה נובעת סגפנות של מניעת אוכל ושתיה מהגוף."},{"u":13,"n":77,"t":"סולידריות","m":"הזדהות, שותפות לרגשות האחר.","e":"החיילים בפלוגה החלו בשביתה כהפגנת סולידריות עם חברם. לטענתם, הוא נענש שלא בצדק."},{"u":13,"n":78,"t":"עב","m":"ענן, נשיא.","e":"כאשר השמים מתכסים בעבים רבים וכהים, זהו סימן לבואו של הגשם."},{"u":13,"n":79,"t":"עביט","m":"כלי קיבול לנוזלים.","e":"לאחר לידתו של אחי, אמי קנתה עביט מיוחד ובעזרתו היא מקלחת אותו."},{"u":13,"n":80,"t":"עגום","m":"עצוב.","e":"מאז שגילה אריאל כי לא התקבל לעבודה שליבו חפץ, נפשו עגומה."},{"u":13,"n":81,"t":"עוין","m":"שונא.","e":"\"ויהי שאול עוין את דוד\" (שמואל א', יח', ט')"},{"u":13,"n":82,"t":"פג","m":"התבטל, נגמר תקפו. פרי בוסר, לא בשל. ולד שנולד לפני זמנו.","e":"תוקף הדרכון שלי פג לפני חודש. לכן, עלי לחדש אותו לפני הטיסה."},{"u":13,"n":83,"t":"פוגרום","m":"פרעות, מעשי אלימות.","e":"לפני הקמת המדינה נעשו פוגרומים בקהילות שונות של יהודים ברחבי העולם."},{"u":13,"n":84,"t":"פור","m":"גורל, מזל.","e":"מחקרים שהתקיימו בנוגע למשחקי הפור, הראו כי אחוז גבוה ממשחקים אלו מתקיים בערי הפריפריה."},{"u":13,"n":85,"t":"פרודיה","m":"יצירה שמטרתה ללעוג ליצירה אחרת, חיקוי הומוריסטי.","e":"השבוע עלתה לשידור פרודיה חדשה העוסקת בחיקויים של מנהיגים שונים בארץ ובעולם."},{"u":13,"n":86,"t":"צפיחית","m":"דבר מתוק.","e":"שחר הקטן אוהב לאכול צפיחיות. לכן, אמי אופה עוגיות לעיתים קרובות. לטענתה, עדיף ששחר יאכל צפיחיות שהוכנו בבית שאין בהן חומרים משמרים."},{"u":13,"n":87,"t":"צרות עין","m":"קינאה, יחס שלילי להצלחת הזולת.","e":"נמרוד הביט צרות עין על הצלחתו של שלומי במבחן במתמטיקה."},{"u":13,"n":88,"t":"קשיה","m":"שאלה קשה.","e":"היום בשיעור היסטוריה למדנו על עליות היהודים לארץ לאחר קום המדינה. יש לי הרבה קשיות לגבי אורח חייהם של תושבי המדינה בתקופה זו בהיסטוריה."},{"u":13,"n":89,"t":"קלות ראש","m":"חוסר רצינות, זלזול.","e":"הנהג הפוגע התייחס בקלות ראש לתמרורים המצויים לאורך הכביש בו נסע, לא התאים את נהיגתו למצב הכביש ולכן גרם לתאונה הקטלנית."},{"u":13,"n":90,"t":"קרטל","m":"מספר חברות המתאגדות למונופול ובכך מונעים תחרות חופשית.","e":"בארצות הברית הקרטל אסור על פי החוק והמשטרה מקפידה על כך."},{"u":13,"n":91,"t":"רופס","m":"רך, חלוש, רופף.","e":"איתי ונועם התקוטטו ביניהם בהפסקה. המורה שגילתה זאת, חייבה אותם להשלים. בסופו של דבר התקיימה ביניהם לחיצת יד רופסת."},{"u":13,"n":92,"t":"רז","m":"סוד, תעמולה.","e":"לפני שסבתי נפטרה, היא גילתה לאמי את רזי הכנת תבשילי השבת שלה."},{"u":13,"n":93,"t":"ריבוני","m":"עצמאי, אוטונומי.","e":"מדינת ישראל היא מדינה ריבונית ואינה כפופה לשלטון של מדינה אחרת."},{"u":13,"n":94,"t":"שם מבטחו","m":"סמך עליו, בטח בו.","e":"אנו מפקידים את כספנו בידי הבנק ושמים את מבטחנו בו שישמור על הכסף היטב."},{"u":13,"n":95,"t":"שנף","m":"וניל.","e":"הגלידה האהובה עלי ביותר היא גלידה בטעם שנף עם תות."},{"u":13,"n":96,"t":"שעה קלה","m":"זמן קצר.","e":"היום הזדמן לי לבקר את סבתי לשעה קלה. למרות שהביקור היה קצר, הוא שימח אותה מאוד."},{"u":13,"n":97,"t":"תרוד","m":"כף לבחישה.","e":"במהלך הכנת מרק, כדאי לבחוש אותו לעיתים קרובות. התרוד הוא כלי שיכול לסייע בכך."},{"u":13,"n":98,"t":"תשואה","m":"(1) רווח מהשקעה. (2) קריאת עידוד ומחיאת כפיים.","e":"בסוף ההופעה עלו תשואות רבות מהקהל הנלהב."},{"u":13,"n":99,"t":"תשר","m":"(1) טיפ, תוספת תשלום מעבר למחיר שנקבע. (2) מתנה, תשורה, דורון.","e":"המלצרית שירתה את הלקוחות ביחס אדיב במיוחד ולכן הם נתנו לה תשר גבוהה."},{"u":13,"n":100,"t":"תשתית","m":"(1) בסיס, יסוד. (2) המערך הכולל של משאבים שנדרשים לפעולה מסוימת.","e":"לפני שיחלו לאכלס את אזור המגורים החדש, יגיע מפקח מטעם העיריה לבדוק שכל תשתיות הנחוצות לסביבת מגורים בוצעו באופן הטוב והבטיחותי ביותר."},{"u":14,"n":1,"t":"אבד עליו הכלח","m":"התיישן, כבר לא חיוני כבעבר.","e":"אחי אינו מוכן להיפטר משעונו למרות אבד עליו הכלח."},{"u":14,"n":2,"t":"אבות אכלו בסר ושני בנים תקהינה","m":"הצאצאים נענשים על מעשיהם הרעים של אבותיהם.","e":"\"בימים ההם לא יאמרו עוד אבות אכלו בסר ושני בנים תקהינה. כי אם איש בעוונו ימות\" (ירמיהו, לא', כח')."},{"u":14,"n":3,"t":"אבן בוחן","m":"אמת מידה, מדד (קריטריון).","e":"אבן בוחן לזוגיות טובה היא הנאמנות והכבוד שרוכשים בני הזוג אחד כלפי השני."},{"u":14,"n":4,"t":"אבק אדם","m":"אנשים חסרי זהות.","e":"דן הרגיש כאבק אדם בשיחה שיזם עם מנהליו, שכן הם אינם הקשיבו לדבריו."},{"u":14,"n":5,"t":"אהבה אפלטונית","m":"אהבה ללא קשר פיזי.","e":"רן ודינה טוענים שיש ביניהם אהבה אפלטונית כך שהם רק חברים טובים ולא מעבר."},{"u":14,"n":6,"t":"אוגדן","m":"תיקיה.","e":"לא אחת, ביקש ממני אבי לסדר את כל מסמכיי באוגדן."},{"u":14,"n":7,"t":"אותיות של קדוש לבנה","m":"אותיות גדולות במיוחד.","e":"סבי סובל מלקות בראייה לכן עליו לקרוא רק ספרים הכתובים באותיות קדוש לבנה."},{"u":14,"n":8,"t":"אותיות של טל ומטר","m":"אותיות זעירות.","e":"במבחן נדרש עליי לענות תשובה בשורה אחת בלבד, אך זה לא הספיק לי. על כן, רשמתי באותיות של טל ומטר."},{"u":14,"n":9,"t":"בא בטרוניה עמו","m":"טען טענות קשות נגדו.","e":"הורי החטוף התנגדו להתנהלותו של ראש הממשלה בנוגע לטיפול בבנם ועל -כן בא בטרוניה עמו."},{"u":14,"n":10,"t":"בבואה","m":"השתקפות, דמות המשתקפת.","e":"כשאני מסתכלת על ביתי אני רואה בבואה של עצמי בעבר."},{"u":14,"n":11,"t":"בדימוס","m":"לשעבר, בגמלאות.","e":"ראש הממשלה בדימוס נעצר בחשד למתן שוחד בעת מילוי תפקידו."},{"u":14,"n":12,"t":"בוצר","m":"קוטף ענבים.","e":"שחף נתפס בוצר בכרם שאינו שייך לו."},{"u":14,"n":13,"t":"בורסקאי","m":"מעבד עורות.","e":"דודי בורסקאי ולו עורות מכל הצבעים."},{"u":14,"n":14,"t":"ביעור","m":"סילוק, השמדה, חיסול שיטתי.","e":"חז\"ל קבעו כי יש בערב ליל חג הפסח לבער את כל החמץ שברשותנו."},{"u":14,"n":15,"t":"בית נכות","m":"מוזיאון.","e":"בבית נכות, בית התפוצות, ניתן לראות תערוכות המציגות את ההיסטוריה של העם היהודי."},{"u":14,"n":16,"t":"גאות","m":"עליית מפלס מי הים.","e":"בזמן גאות יש להתרחק משפת הים."},{"u":14,"n":17,"t":"גביר","m":"אדם עשיר, אמיד.","e":"למרות היותו גביר, דן הרגיש כי עושרו אינו מספיק לו."},{"u":14,"n":18,"t":"גשפנקה","m":"חותם, אישור.","e":"רק לאחר שהועדה המקומית לתכנון ובנייה נתנה גשפנקה לקבלן, הוא יכל לבנות את הבית."},{"u":14,"n":19,"t":"דא עקא","m":"זו הצרה, זו הבעיה.","e":"שליו סיים את לימודי ההנדסה בהצטיינות, דא עקא העבודה בתחום לא עניינה אותו."},{"u":14,"n":20,"t":"דאז","m":"בעת ההיא.","e":"לפני כעשר שנים, נרצח מפכ\"ל המשטרה דאז, ורק היום פוענח הרצח."},{"u":14,"n":21,"t":"דדוקציה","m":"הסקה מהכלל אל הפרט.","e":"דדוקציה מוגדרת ההפך מאינדוקציה בה המסקנות מתקבלות מהפרט אל הכלל."},{"u":14,"n":22,"t":"דיאלוג","m":"שיחה בת לפחות שני משתתפים.","e":"בפרויקט גשרים לשלום מנסים ליצור דיאלוג בין תלמידים ממוצא ערבי לתלמידים ממוצא יהודי."},{"u":14,"n":23,"t":"הסלמה","m":"החרפה, הקצנה.","e":"לאחרונה, ניתן לראות הסלמה במצב הביטחוני, וזאת בעקבות ההתססה ברשתות החברתיות."},{"u":14,"n":24,"t":"העתיק","m":"הזיז ממקומו.","e":"מטר העתיק את מקום מושבו מבאר-שבע אל זיכרון יעקב שבצפון."},{"u":14,"n":25,"t":"הצפין","m":"החביא, הסתיר, הכמין.","e":"שי הצפין את טבעת הנישואין מחברתו טרם הציע לה."},{"u":14,"n":26,"t":"הקשה את לבו","m":"סירב לסלוח או לוותר.","e":"רונית ביקשה מאלי סליחה עשרות פעמים לאחר שפגעה בו, אך אלי הקשה את לבו."},{"u":14,"n":27,"t":"הרהר על מדותיו","m":"חשד בו.","e":"דוד טען שלא היה לו חלק בביצוע השוד, לטענתו הוא חזר למוטב, אך בכל זאת חוקר המשטרה הרהר על מדותיו."},{"u":14,"n":28,"t":"השליך נפשו מנגד","m":"סיכן את חייו.","e":"יואב היה מוכן להשליך נפשו מנגד בשביל חברו לקרב."},{"u":14,"n":29,"t":"השתאה","m":"התפלא, נדהם, השתומם.","e":"רונן השתאה לנוכח התנהגותו המוזרה של גלעד."},{"u":14,"n":30,"t":"השתנקות","m":"היחנקות.","e":"הנאשם השתנק לנוכח האשמות שהופנו נגדו."},{"u":14,"n":31,"t":"התבדה","m":"טעה.","e":"שלומי הודה כי התבדה ולכן התנצל בפני שלומית."},{"u":14,"n":32,"t":"התגודדו","m":"נאספו, התקהלו.","e":"לאחר פטירתו של הנשיא, שמעון פרס, רבים התגודדו כדי להיפרד ממנו בפעם האחרונה."},{"u":14,"n":33,"t":"התחוור","m":"התברר.","e":"לאחר התחוור לבעלי החברה כי העובד מעל בכספי החברה הוא החליט לפטרו לאלתר."},{"u":14,"n":34,"t":"זמר","m":"(1) קצץ ענפים. (2) אדם שמתפרנס משירה.","e":"הגנן זמר ענפים מהעץ בגינה במיומנות."},{"u":14,"n":35,"t":"זן","m":"סוג, מין.","e":"ישנם זנים רבים של פרחים, אך פרח מזן זה לא ראיתי מימיי."},{"u":14,"n":36,"t":"זרה מלח על הפצעים","m":"הוסיף על צערו.","e":"ארתור לא הסתפק בללעוג לדנה אלא זרה מלח על הפצעים בכך שאף פרסם דברים מביכים עליה."},{"u":14,"n":37,"t":"חאן","m":"אכסניה, מלון אורחים, פונדק.","e":"בנימין התלבט האם לנסוע לאילת עם חבריו שכן מחירי בתי-המלון היו גבוהים מאוד, חבריו אמרו לו שאפשר ללון בחאן ולאו דווקא במלון."},{"u":14,"n":38,"t":"חבוש","m":"קשור, אסור.","e":"כ- 48 שעות לאחר היעדרותו נמצא אלון חבוש לעץ באזור שכוח אל."},{"u":14,"n":39,"t":"חדלון","m":"חורבן, הרס.","e":"המלחמה בסוריה גובה הורגים רבים וגורמת חדלון רב וכואב לחלק ניכר מהאוכלוסייה."},{"u":14,"n":40,"t":"חוילה","m":"וילה.","e":"משפחת הרשקוביץ חסכה רבות בדי לקנות את חוילה שברשותם."},{"u":14,"n":41,"t":"חתר","m":"(1) שואף למען מטרה מסוימת. (2) תנועה בתוך המים.","e":"הסטודנט חתר לקבל ציון טוב בבחינה ועל-כן הוא השקיע רבות."},{"u":14,"n":42,"t":"טובין","m":"נכסים, סחורות, מרכולת.","e":"הסוחר מכר את הטובין בשוק במחיר המשתלם לכל יד."},{"u":14,"n":43,"t":"טחוב","m":"לח, רטוב.","e":"ליאור הוציא את המכנס מהמייבש למרות שהוא היה טחוב."},{"u":14,"n":44,"t":"טחן מים","m":"פעל לשווא, עשה דבר לא יעיל.","e":"איני נכנסת לתרגולים בסטטיסטיקה, שכן לעניות דעתי המתרגל טוחן מים."},{"u":14,"n":45,"t":"טחו עיניו מראות","m":"התכחש לדברים כפי שהם.","e":"מצבו הכלכלי של יוסי היה בשפל, אך למרות זאת טחו עיניו מראות והוא המשיך לבזבז."},{"u":14,"n":46,"t":"ידו על העליונה","m":"ניצח.","e":"יואב סיים את הקרב כשידו על העליונה, ולכן אורו פניו."},{"u":14,"n":47,"t":"יושב קרנות","m":"בטלן, לא עושה דבר.","e":"אמו של נהוראי, מאוכזבת ממנו שכן לטענתה הוא יושב קרנות ולא עושה דבר בנוגע לחייו."},{"u":14,"n":48,"t":"יחידי סגלה","m":"אנשים יוצאי דופן בתכונותיהם, שאין הרבה כמותם.","e":"לאחר לכתו של הרבי מלובביץ', רבים ספדו לו באומרם שהוא היה יחיד סגלה בדורו."},{"u":14,"n":49,"t":"יפוי כח","m":"הזכות לעשות דבר- מה בשמו של אחר.","e":"כאשר אמו של חנן חשה כי היא מאבדת מצלילותה היא נתנה לבנה יפוי כח על נכסיה."},{"u":14,"n":50,"t":"כאבל בין חתנים","m":"אדם עצוב הנמצא בין אנשים שמחים.","e":"ביום חתונת בתו חש האב כאבל בין חתנים שכן אינו אהב את בחיר ליבה."},{"u":14,"n":51,"t":"כבד פה","m":"מגמגם, כבד לשון.","e":"משה רבנו היה אדם כבד פה ולמרות זאת היה אחד מהמנהיגים הגדולים של עם -ישראל."},{"u":14,"n":52,"t":"לא דבים ולא יער","m":"לא היו דברים מעולם.","e":"טליה טוענת שראתה אמש את חן מסתובבת בחברת אנשים מפוקפקים, אך מכיוון שחן שוהה בחו\"ל עם משפחתה, אני יודע לא דבים ולא יער."},{"u":14,"n":53,"t":"לא מנה ולא מקצתה","m":"מוטעה לחלוטין, לא קרה מעולם.","e":"החוקרים מאשימים את תמיר ברצח בת זוגו, אך תמיר טוען: לא מנה ולא מקצתה!"},{"u":14,"n":54,"t":"לאה","m":"עייף, יגע.","e":"לאחר משמרת עמוסה בעבודה יוסי היה לאה ורק חיכה להגיע לביתו."},{"u":14,"n":55,"t":"לבה את היצרים","m":"גרם למהומה, עורר סערת רגשות.","e":"משפטו של חנן לבה את היצרים, שכן הוא נאמר לא בזמן ולא במקום."},{"u":14,"n":56,"t":"לטנטי","m":"חבוי, כמוס.","e":"רועי השביע את עידו שלא יספר את דבריו לאיש אלא ישמור עליהם באופן לטנטי."},{"u":14,"n":57,"t":"ליל שמורים","m":"לילה ללא שינה.","e":"בימים הראשונים לאחר לידת בנה בילתה דנה לא מעט לילות שמורים מכיוון שהיה בוכה בלילות."},{"u":14,"n":58,"t":"לפדות","m":"להחזיר, להשיב.","e":"מצוות פדיון שבויים נחשבת למצווה בעלת חשיבות רבה בתורה."},{"u":14,"n":59,"t":"מאיר עיניים","m":"בהיר וברור.","e":"המורה אוהבת לקרוא את כתב ידי שכן לטענתה הוא מאיר עיניים."},{"u":14,"n":60,"t":"מבוי סתום","m":"ללא מוצא.","e":"אריאל השקיע מחשבה רבה על מציאת פתרון לבעיה, אך בסופו של היום הגיע מבוי סתום."},{"u":14,"n":61,"t":"מבעית","m":"מבהיל, מפחיד אימת.","e":"אבי לא הצליח לחזור לשנתו באותו הליל לאחר שהתעורר מסיוט מבעית."},{"u":14,"n":62,"t":"מגד","m":"מתוק.","e":"רונן החזיר את הקפה למוכרת מכיוון שהוא היה מגד מדי."},{"u":14,"n":63,"t":"מלקוש","m":"גשם מאוחר בסוף עונת הגשמים.","e":"המלקוש הגיע השנה רק בחודש מאי."},{"u":14,"n":64,"t":"מסק","m":"קטף זיתים.","e":"אדם מסק כדי להכין מהם שמן."},{"u":14,"n":65,"t":"מעושה","m":"מלאכותי.","e":"דנה עברה לא מעט ניתוחים פלסטיים עד שהמראה שלה נראה מעושה ולא טבעי."},{"u":14,"n":66,"t":"מצחין","m":"מסריח.","e":"יואב התעצל לזרוק את הפח בביתו עד שנדף ממנו ריח מצחין."},{"u":14,"n":67,"t":"מרזח","m":"משתה.","e":"המלך אחשוורוש ערך מרזח מפואר בו הזמין את כל שריו ועבדיו."},{"u":14,"n":68,"t":"משונן","m":"מחודד, מלוטש.","e":"הלהב של הסכין היה משונן היטב."},{"u":14,"n":69,"t":"מתבדר","m":"מתפזר ברוח.","e":"בזמן משב הרוח העלים התבדרו בגינה."},{"u":14,"n":70,"t":"מתי מספר","m":"מעט אנשים.","e":"להפגנה מול בית ראש הממשלה הגיעו מתי מספר, דבר שגרם לאכזבתם של המארגנים."},{"u":14,"n":71,"t":"נפלה רוחו","m":"התייאש.","e":"לאחר שנכשל חמש פעמים בבחינה, נפלה רוחו של ליאור."},{"u":14,"n":72,"t":"נקי כפים","m":"ישר, שאינו לוקח שוחד.","e":"אחת מהתחייבותו של שופט הוא להיות נקי כפים אשר שופט ביושר."},{"u":14,"n":73,"t":"נשא עיניו","m":"קיווה, ציפה.","e":"מוטי נשא עיניו להוריו שיעזרו לו במימון שכר הלימודים."},{"u":14,"n":74,"t":"נתפס בקלקלתו","m":"נתפס בהתנהגות רעה.","e":"חבר הכנסת נתפס בקלקלתו שכן צולם במדבר בטלפון בזמן נהיגה."},{"u":14,"n":75,"t":"סטטוס","m":"מצב, עמדה, מעמד.","e":"כרגע הסטטוס של שלי הוא רווקה, לכן היא פנויה להצעות."},{"u":14,"n":76,"t":"סנטימנטלי","m":"רגיש, רגשני.","e":"אורי לא היה מוכן לזרוק את חולצתו למרות שהייתה קטנה עליו מכיוון שהיה לה ערך סנטימנטלי עבורו."},{"u":14,"n":77,"t":"סתגלן","m":"אדם המסתדר בכל מצב.","e":"חלי לא דאגה כשבנה טס לעבוד בחו\"ל כי ידעה שהוא סתגלן."},{"u":14,"n":78,"t":"סתם את הגולל","m":"סגר באופן סופי.","e":"אלי חלם כל חייו לעשות צניחה חופשית, אך לאחר התקף הלב שעבר, רופאו אסר עליו לעשות זאת לאלתר ובכך סתם את הגולל על חלומו."},{"u":14,"n":79,"t":"עזבון","m":"ירושה.","e":"רחל דאגה לעת זקנה לכתוב עזבון כך שילדיה לא יריבו על הכסף שנותר ברשותה לאחר לכתה."},{"u":14,"n":80,"t":"עילג","m":"מגמגם.","e":"יהודה היה אדם עילג, מה שהקשה מאוד על דיברו."},{"u":14,"n":81,"t":"על כרעי תרנגלת","m":"לא יציב.","e":"משפחתו של החולה התבקשה להגיע באופן בהול לבית החולים שכן מצבו היה על כרעי תרנגלת."},{"u":14,"n":82,"t":"עלם","m":"בחור צעיר.","e":"יוחאי היה עלם כשנולד לו בן ראשון."},{"u":14,"n":83,"t":"עשוי לבלי חת","m":"אין בלבו כל פחד.","e":"מפקדיו של רועי מתארים אותו כאדם העשוי לבלי חת."},{"u":14,"n":84,"t":"פגע","m":"אסון, מכשול, אירוע קשה.","e":"הפגע שפקד את מרים גרם לה לדכאון קשה ולכן הצטרכה טיפול תרופתי."},{"u":14,"n":85,"t":"פוביה","m":"פחד.","e":"לדניאל יש פוביה מנחשים ועל-כן הוא אינו יכול להתקרב אליהם."},{"u":14,"n":86,"t":"פולמוס","m":"ויכוח, מחלוקת.","e":"בקרב חוקרים רבים יש פולמוס האם קיים כוח עליון או לא."},{"u":14,"n":87,"t":"פושט יד","m":"קבצן.","e":"אבי לימד אותי שבכל פעם שאני רואה אדם הפושט יד יש לי לעזור לו במה שאוכל."},{"u":14,"n":88,"t":"צביון","m":"אופי.","e":"מדינת ישראל היא בעלת צביון יהודי."},{"u":14,"n":89,"t":"צוק עתים","m":"זמנים קשים, שעת חירום.","e":"בצוק עתים, אנשים מאמינים נושאים עיניהם למרום."},{"u":14,"n":90,"t":"צחיח","m":"יבש, חרב.","e":"המדבר נחשב לעזור צחיח המאופיין במזג אוויר חם ובצמחיה מעוטה."},{"u":14,"n":91,"t":"קובע","m":"קסדה, כובע מגן.","e":"החוק מחייב לחבוש קובע בעת רכיבה על אופניים בכבישים לא- עירוניים."},{"u":14,"n":92,"t":"קבעת","m":"כוס, גביע.","e":"הקבעת שאיתה מקדש אבי בכל ימי שישי יקרה לליבו שכן ניתנה לו כמתנה מאביו."},{"u":14,"n":93,"t":"קוטל קנים","m":"אדם פשוט וחסר השכלה (נאמר בדר\"כ כזלזול).","e":"חיים נחשב לאדם קוטל קנים בקרב חבריו ולכן הם מבטלים את דבריו או אינם מקשיבים לו."},{"u":14,"n":94,"t":"קולגה","m":"עמית.","e":"מאור ויוסי הכירו בתור קולגות לעבודה אך הקשר שלהם התהדק והם נהפכו גם לחברים טובים."},{"u":14,"n":95,"t":"ריצה","m":"פייס.","e":"דימה נאלץ לבטל את הפגישה עם נופר, אך הוא דאג לרצות אותה על כך."},{"u":14,"n":96,"t":"רפה","m":"חלש, כהה.","e":"נועם הרגיש רפה בשל מחלתו הקשה."},{"u":14,"n":97,"t":"שורר","m":"קיים, נוכח.","e":"בעקבות גל הטרור השורר בירושלים, הוחלט לתגבר את כוחות הביטחון בעיר."},{"u":14,"n":98,"t":"שרף","m":"חומר נוזלי היוצא מצמחים.","e":"הפקת שרף מצמחים מסוימים עשויה להועיל למציאת תרופות."},{"u":14,"n":99,"t":"תל","m":"הגבהה מלאכותית של פני הקרקע שבוצעה על ידי האדם או בעל חיים, ערימה.","e":"ארכיאולוגים רבים לא יודעים למנות את מספר הפירמידות שיש במצרים עתה מכיוון שחלקן נראות כתל של עפר"},{"u":14,"n":100,"t":"תשובה נצחת","m":"תשובה מכרעת.","e":"יש הטוענים כי תשובתו נצחת של המועמד היא זו שגרמה לו לזכות באהדת הקהל."},{"u":15,"n":1,"t":"אימתי","m":"מאיים, מפחיד.","e":"בזמן סערות הים נראה בעיני שמואל כאימתי."},{"u":15,"n":2,"t":"אינטגרציה","m":"מיזוג, איחוד.","e":"שר החינוך מעוניין ליזום תוכנית אינטגרציה בין תלמידים יהודים לערבים."},{"u":15,"n":3,"t":"איש מדון","m":"אדם האוהב לריב, סכסכן.","e":"אמי ביקשה שאתרחק משלומי מכיוון שהוא איש מדון."},{"u":15,"n":4,"t":"אספקלריה","m":"מראה.","e":"אספקלריה של הקיר מי הכי יפה בעיר?"},{"u":15,"n":5,"t":"אצבע צרדה","m":"האצבע האמצעית בכף היד.","e":"האמה מכונה אצבע צרדה."},{"u":15,"n":6,"t":"אפיפית","m":"וופל.","e":"סבתי אוהבת לאכול אפיפית בטעם לימון."},{"u":15,"n":7,"t":"אפריון","m":"מושב כבוד המיועד לנשיאה ע\"י מס' אנשים.","e":"בעבר מלכים היו נישאים ממקום למקום בעזרת אפריון."},{"u":15,"n":8,"t":"ארכאי","m":"אדם סבלני שאינו ממהר לכעוס.","e":"הראל נחשב לאדם מאוד ארכאי, בחיי לא ראיתי אותו מרים את קולו."},{"u":15,"n":9,"t":"ארכיפלג","m":"קבוצת איים.","e":"הוואי הוא ארכיפלג באוקיינוס השקט."},{"u":15,"n":10,"t":"באו מים עד נפש","m":"נמאס, עד קצה גבול היכולת.","e":"המתחרה הרגיש שבאו מים עד נפש ועל כן הוא החליט לפרוש מהתחרות."},{"u":15,"n":11,"t":"באותות ובמופתים","m":"באופן משכנע, בעזרת הוכחות.","e":"לפי האמונה היהודית הקב\"ה הוציא את עם- ישראל באותות ובמופתים ממצרים."},{"u":15,"n":12,"t":"בגד שרד","m":"מדים רשמיים.","e":"בזמן שירותו הצבאי חויב דוד לבוא עם בגדי שרד."},{"u":15,"n":13,"t":"במטותא","m":"בבקשה, אנא.","e":"במטותא ממך הכיני לי כוס נס."},{"u":15,"n":14,"t":"בראש חוצות","m":"בגלוי, בפרהסיה.","e":"רן ורינה הודיעו בראש חוצות על לידת בנם הראשון."},{"u":15,"n":15,"t":"בתה","m":"שדה מוזנח ושומם, ישימון.","e":"לוי הפסיק לטפח את השדה שברשותו ולכן הוא הפך לבתה."},{"u":15,"n":16,"t":"גיס חמישי","m":"כינוי לבוגדים מבית.","e":"אחי הגדיל תמיד הזהיר אותי מלסמוך על דוד חיים שכן רבים מהמשפחה ראו בו גיס חמישי."},{"u":15,"n":17,"t":"גרע","m":"החסיר.","e":"רון גרע משיעורים רבים במהלך הסמסטר, ועל-כן נכשל במבחנו."},{"u":15,"n":18,"t":"גת","m":"בור המשמש לדריכת ענבים כדי ליצר יין.","e":"בעבר היו נוהגים לייצר יין באמצעות גת."},{"u":15,"n":19,"t":"דרבון","m":"זירוז, האצה.","e":"המעסיק דרבן את העובדים שיגבירו את קצב העבודה כדי לסיים את הפרויקט בתאריך המיועד."},{"u":15,"n":20,"t":"דמעות תנין","m":"בכי לא אמתי, מתוך צביעות.","e":"איני מאמינה ליפעת, לעניות דעתי דמעותיה הן דמעות תנין."},{"u":15,"n":21,"t":"דפי","m":"פגם, רבב.","e":"התנהגותה של לימור ראויה לשבח, שכן לא היה בה שום דפי."},{"u":15,"n":22,"t":"דר","m":"גר.","e":"בגיל 20 יואב דר בבית שקנה בעצמו."},{"u":15,"n":23,"t":"דבלול","m":"קצה חוט או שערה.","e":"דבלולים על מצחה של בתיה הפריעו לה לראות את הדרך."},{"u":15,"n":24,"t":"דש בעקביו","m":"מזלזל באחרים.","e":"טל מגנה את התנהגותו של דוד שכן הוא דש בעקביו של סובביו."},{"u":15,"n":25,"t":"האיר עיניו","m":"הסביר, גרם לו להבין.","e":"המרצה האיר את עיניו של הסטודנט ובכך עזר להצלחתו במבחן."},{"u":15,"n":26,"t":"הבליג","m":"התאפק, לא הגיב.","e":"רן הקניט את יונתן מול חבריו אך יונתן בחר להבליג על דבריו."},{"u":15,"n":27,"t":"הגיף","m":"סגר, נעל, הבריח.","e":"אוריאל הגיף את חלון ביתו בעקבות רעש הבניה שנשמע מבחוץ."},{"u":15,"n":28,"t":"הגליה","m":"גירוש אדם ממקום מושבו לארץ זרה.","e":"עם ישראל הוגלו מארצם לאחר חורבן בית שני."},{"u":15,"n":29,"t":"הדוניזם","m":"רדיפת תענוגות, נהנתנות.","e":"לפי גישת ההדוניזם תכליתו של האדם היא ליהנות בחייו."},{"u":15,"n":30,"t":"הדרן","m":"קטע נוסף לאחר סיום הופעה.","e":"לאחר כשכל הקהל היה בטוח כי ההופעה הסתיימה הפתיע האמן בהדרן."},{"u":15,"n":31,"t":"הולל","m":"פורק עול, חי חיי הוללות.","e":"לפני נישואיו יקיר היה ידוע כרווק הולל."},{"u":15,"n":32,"t":"הוקיע","m":"גינה, ביקר.","e":"אילנית הוקיע את התנהגותה של חברתה לאחר שזו גידפה ילדה ללא סיבה."},{"u":15,"n":33,"t":"הוקיר","m":"כיבד, העריך.","e":"במפגש אינטימי ומרגש בבית הנשיא בירושלים הוקירו נשיא המדינה ורעייתו את פועלם של אומנים, שהיגרו מברית המועצות, לתרבות הישראלית."},{"u":15,"n":34,"t":"הטמין","m":"החביא, הסתיר, הצפין, הכמין.","e":"שלא כחוק, החוקר הטמין אוסף ראיות שיכלו לזכות את הנאשם ממאסר."},{"u":15,"n":35,"t":"הכלאה","m":"שילוב בעלי- חיים או צמחים ממינים שונים.","e":"הנקטרינה היא תוצר של אפרסק ולא הכלאה של אפרסק ושזיף."},{"u":15,"n":36,"t":"וטו","m":"סמכות הנתונה ליחיד או לקבוצה למנוע פעולה מסוימת.","e":"במועצת הביטחון של האו\"ם יש לחמש מדינות זכות וטו."},{"u":15,"n":37,"t":"ויברציה","m":"רעידה, תנודה מהירה.","e":"בהופעתה של הזמרת, גופי נאחז ויברציות, וזאת בשל הערצתי ארוכת השנים לה."},{"u":15,"n":38,"t":"חופף","m":"זהה לגמרי.","e":"האידאולוגיה של המפלגה חופפת לערכים שאני מאמין בהם ועל -כן אבחר בה בבחירות הקרובות."},{"u":15,"n":39,"t":"חטא בשפתיו","m":"נכשל בדבריו.","e":"אדם חטא בשפתיו בכך שהאשים את נועם בדבר שלא עשה."},{"u":15,"n":40,"t":"חלחלה","m":"רעד, בהלה, חיל, פיק.","e":"בעת מתן פסק הדין בנוגע למשפטו של יוסף, עברה בו חלחלה שכן הבין את גודל החומרה במעשה שביצע."},{"u":15,"n":41,"t":"חם מזג","m":"עצבני.","e":"שי ידוע כאדם חם מזג ולכן חבריו משתדלים שלא להכעיסו."},{"u":15,"n":42,"t":"חקוק","m":"חרוט.","e":"משפטה של סבתי בטרם הלכה לעולמה יהיה חקוק בזיכרוני לעד."},{"u":15,"n":43,"t":"טמן בחובו","m":"הכיל בתוכו.","e":"העובד הסתייג מהמאבק בהנהלה שכן לטענתו מאבק מסוג זה טומן בחובו השלכות חמורות."},{"u":15,"n":44,"t":"טפל","m":"לא העיקר.","e":"כשהבנתי שהעושר הוא טפל ומה שחשוב באמת הוא האושר הפנימי חיי נעשו טובים יותר."},{"u":15,"n":45,"t":"יצא נקי מנכסיו","m":"הפסיד את כל רכושו.","e":"השקעתו של רונן בבורסה ירדה לטמיון ובעקבות כך הוא יצא נקי מנכסיו."},{"u":15,"n":46,"t":"יקיצה","m":"התעוררות משינה.","e":"הבקרים האוהבים על נועה הם אלו שבהם היא מתעוררת ביקיצה טבעית."},{"u":15,"n":47,"t":"ירכתיים","m":"החלק האחורי של הספינה.","e":"הילדים שחקו בירכתיים של הספינה בזמן שהוריהם משגיחים עליהם."},{"u":15,"n":48,"t":"כבידה","m":"כוח המשיכה.","e":"כבידה הוא הכוח החלש ביותר מבין כוחות היסוד."},{"u":15,"n":49,"t":"כחוש","m":"רזה, דק, צנום.","e":"אחד מהמראות שזעזעו אותי בזמן שהותי באפריקה הייתה של ילד כחוש המבקש צדקה."},{"u":15,"n":50,"t":"לא משתמע לשתי פנים","m":"חד משמעי.","e":"אין זה ייתכן שהבנת את דבריי אחרת, אמרתי אותם באופן שלא משתמע לשתי פנים."},{"u":15,"n":51,"t":"לאשורו","m":"במדויק.","e":"הפעלולן הבין את הסיכון במעשה לאשורו אך בכל זאת רצה לבצע אותו."},{"u":15,"n":52,"t":"לגיטימי","m":"חוקי, קביל.","e":"רונן מסתייג מצורת התנהלותה של חני ואף טוען כי היא פועלת בצורה שאינה לגגיטימית."},{"u":15,"n":53,"t":"לויאלי","m":"נאמן, שומר אמונים.","e":"רונית שיתפה את מתנאל בכל סודותיה הכמוסים מכיוון שראתה בו אדם לויאלי."},{"u":15,"n":54,"t":"מהוה","m":"שחוק, בלוי, דהוי, מרופט.","e":"סתיו רצתה לזרוק את השולחן בביתה כי בעיניה הוא נראה מהוה."},{"u":15,"n":55,"t":"מהתלה","m":"בדיחה.","e":"באמצע השיעור נועם סיפר מהתלה וכל הנוכחים בכיתה צחקו."},{"u":15,"n":56,"t":"מוגף","m":"סגור.","e":"התריסים בביתו של צחי תמיד מוגפים ולכן אף-פעם אין בביתו אור שמש."},{"u":15,"n":57,"t":"מולקולה","m":"מספר אטומים הקשורים בקשר כימי, פרודה.","e":"מולקולת חמצן מורכבת משני אטומים זהים."},{"u":15,"n":58,"t":"מונולוג","m":"שיחת יחיד.","e":"בזמן ההצגה השחקן פתח במונולוג על מצבו האישי."},{"u":15,"n":59,"t":"מוסר כליות","m":"חרטה, נקיפות מצפון.","e":"אסף הרגיש מוסר כליות לאחר שראה את חברתו בוכה בגללו."},{"u":15,"n":60,"t":"מועד","m":"חג.","e":"המועד שאני הכי אוהב הוא שבועות."},{"u":15,"n":61,"t":"מזמרה","m":"מספריים המיועדות לקיצוץ ענפים.","e":"יוסי קיצץ את הענפים בגינתו באמצעות מזמרה."},{"u":15,"n":62,"t":"מישב בדעתו","m":"רגוע, שליו.","e":"הסכמתי לדבר עם יונתן רק לאחר שנרגע מכעסו והיה מישב בדעתו."},{"u":15,"n":63,"t":"מכלב","m":"שדכן, מהדק.","e":"המזכירה הידקה את כל המסמכים באמצעות מכלב."},{"u":15,"n":64,"t":"מלא כרמון","m":"בעל ידע רב בהרבה תחומים.","e":"חבריו של ישי כינו אותו מלא כרמון, בשל ידיעותיו הרבות."},{"u":15,"n":65,"t":"מלבב","m":"משמח, מרגש.","e":"לראות את ילדי משחקים יחדו בחצר היה מראה מלבב."},{"u":15,"n":66,"t":"נאקה","m":"נקבת הגמל.","e":"מדריך הטיולים חידש בפני כי נקבת הגמל נקראת נאקה."},{"u":15,"n":67,"t":"נבער","m":"חסר השכלה.","e":"אדיר היה אדם נבער, אך בכל זאת התעשר."},{"u":15,"n":68,"t":"נדם","m":"השתתק.","e":"קולו של אביגדור נדם את בראותו חברו הטוב נפצע."},{"u":15,"n":69,"t":"נהיר","m":"ברור, בהיר.","e":"בעקובות ההסבר המפורט של המורה החומר היה נהיר יותר."},{"u":15,"n":70,"t":"נזר","m":"כתר, עטרה.","e":"לראשו של המלך היה מונח נזר."},{"u":15,"n":71,"t":"נחמה פרתא","m":"נחמה מועטה.","e":"לאחר לכתו של יצחק בשל מחלה ממושכת, בני משפחתו ראו נחמה פרתא בכך שלא יסבול יותר."},{"u":15,"n":72,"t":"סגידה","m":"הערצה.","e":"ראש ממשלת ישראל בדימוס, דוד בן גוריון, היה אדם שזכה לסגידה בחייו ולאחר לכתו."},{"u":15,"n":73,"t":"סגלגל","m":"אליפסה, בצורת ביצה.","e":"משרדו של נשיא ארצות הברית בבית הלבן בנוי בצורת סגלגל."},{"u":15,"n":74,"t":"סוקר","m":"מתבונן.","e":"בהיותי סוקר את הרחוב הבחנתי בילדה קטנה בוכה."},{"u":15,"n":75,"t":"סוריאליסטי","m":"על מציאותי.","e":"לאחר שהות ממושכת בחו\"ל המצב הביטחוני בארץ נראה לדני סוריאליסטי."},{"u":15,"n":76,"t":"עב בשר","m":"שמן, כבד משקל.","e":"ירידתו של גיא במשקל הייתה קיצונית, מאדם עב בשר הפך לאדם כחוש."},{"u":15,"n":77,"t":"עבותות","m":"חבלים עבים.","e":"בחדשות נמסר כי החושד כפת את הקורבן עבותות כדי שלא תוכל לנוס."},{"u":15,"n":78,"t":"עגונה","m":"אישה שבעלה נעלם ולא נתן לה גט.","e":"תמי ארד, אשתו של רון ארד, היא אישה עגונה שכן לא ידוע מה עלה בגורל בעלה."},{"u":15,"n":79,"t":"עוול","m":"חוסר צדק.","e":"הנאשם טוען כי במשפט נעשה עמו עוול וכי השופט החמיר עם ענשו."},{"u":15,"n":80,"t":"פחת","m":"גירעון, חיסרון.","e":"יונתן מכר את רכבו במחיר הנמוך משקנה בגלל פחת שהחסיר ממנו כתוצאה מהבלאי שצבר."},{"u":15,"n":81,"t":"פלבל","m":"גלגל את עיניו.","e":"לימור חשה שירון מזלזל בדבריה שכן במהלך השיחה פלבל את עיניו מס' פעמים."},{"u":15,"n":82,"t":"פלצור","m":"חבל שבקצהו לולאה ללכידת חיות, לאסו.","e":"הסייס השתמש בפלצור כדי ללכוד את הסוס."},{"u":15,"n":83,"t":"פסח על שתי הסעפים","m":"התלבט, היסס.","e":"הלל פוסחת על שתי הסעפים האם להתגייס לצבא או לעשות שירות לאומי."},{"u":15,"n":84,"t":"צדקנות","m":"התחסדות.","e":"אביעד אינו מאמין לדברי הצדקנות של רונן, בעיניו הוא מעוות את המציאות כפי שנוח לו."},{"u":15,"n":85,"t":"צחור","m":"לבן.","e":"הכלה ביקשה זר משושנים צחורים שכן צבעם מתאים לצבע שמלתה."},{"u":15,"n":86,"t":"קולגיאליות","m":"נאמנות בין חברים.","e":"ביחידה שלנו הקולגיאליות היא ערך עליון, ולכן אנו מאוד מגובשים."},{"u":15,"n":87,"t":"קומץ","m":"כמות קטנה.","e":"אם תוסיפו קומץ מלח לחלב, הוא יישאר טרי זמן רב יותר."},{"u":15,"n":88,"t":"קנדסות","m":"מעשי שובבות.","e":"מעשי הקנדסות של רועי עברו כל גבול."},{"u":15,"n":89,"t":"רבבה","m":"עשרת אלפים.","e":"כרבבה של מתפללים הגיעו לכותל בערב ראש השנה."},{"u":15,"n":90,"t":"רדה","m":"(1) שלט ביד רמה. (2) אסף דבש מהכוורת.","e":"הכוורן רדה דבש מהכוורת."},{"u":15,"n":91,"t":"רפיון רוח","m":"חולשה נפשית, ייאוש.","e":"רונית חשה רפיון רוח לאחר שתוצאות הבדיקה שעשתה היו שליליות."},{"u":15,"n":92,"t":"שביס","m":"כיסוי ראש.","e":"נשים דתיות נוהגות לאחר החתונה לכסות את ראשם בשביס."},{"u":15,"n":93,"t":"שחל","m":"אריה, כפיר.","e":"השחל מכונה גם מלך החיות."},{"u":15,"n":94,"t":"שאול","m":"גיהינום, תופת.","e":"אדם שרצח אדם אחר דינו להגיע אל השאול."},{"u":15,"n":95,"t":"שאט","m":"בוז, תיעוב.","e":"עשהאל חש שאט נפש כלפי חברו לאחר ששיקר לו."},{"u":15,"n":96,"t":"שוקת","m":"כלי עמוק המיועד להשקיית בהמות.","e":"הרפתן משקה את הפרות באמצעות השוקת."},{"u":15,"n":97,"t":"תבל","m":"עולם, יקום.","e":"קראתי לבתי תבל מכיוון שהיא כל עולמי."},{"u":15,"n":98,"t":"תהה על קנקנו","m":"בחן, בדק.","e":"המעסיק תהה על קנקנו של העובד, שכן רצה לדעת האם יוכל לקדם אותו."},{"u":15,"n":99,"t":"תוגה","m":"עצב, יגון, דכדוך.","e":"לאחר מות אביו, ניתאי נמלא תוגה."},{"u":15,"n":100,"t":"תוכו כברו","m":"ישר, אמתי, לא צבוע.","e":"עדיאל אמר לחננאל שהוא יכול לסמוך על דבריו של המוכר כי הוא ידוע כאדם תוכו כברו."},{"u":16,"n":1,"t":"אבחה","m":"תנופה.","e":"הלוחם הרג את האויב באבחה אחת."},{"u":16,"n":2,"t":"אבות החשבון","m":"ארבע פעולות החשבון הבסיסיות: חיבור, חיסור, כפל וחילוק.","e":"המורה למתמטיקה ביקשה מהתלמידים לתרגל היטב את אבות החשבון."},{"u":16,"n":3,"t":"אבן נגף","m":"מכשול.","e":"אבני נגף אינם אמורים לייאש אותך, אלא לחשל אותך בדרך למטרה!"},{"u":16,"n":4,"t":"אבסורדי","m":"לא הגיוני.","e":"התנהלותו של המנהל אבסורדית בעיניי שכן דבריו נוגדים כל הגיון."},{"u":16,"n":5,"t":"אדמת טרשים","m":"אדמה המרובה בסלעים הקשה לעיבוד חקלאי.","e":"החקלאי אינו רצה לקנות אדמה זו למרות מחירה הזול מכיוון שלטענתו מדובר באדמת טרשים."},{"u":16,"n":6,"t":"אוד","m":"חתיכת עץ שלא נשרפה לחלוטין.","e":"יום לאחר ל\"ג בעומר ניתן לראות אודים רבים במקומות שבהם היו המדורות."},{"u":16,"n":7,"t":"אוזניים לכותל","m":"יש מי שעלול להאזין לשיחה.","e":"אילנה סירבה לספר לדורית את סודה בטלפון בטענה שאוזניים לכותל."},{"u":16,"n":8,"t":"אובניים","m":"מכשיר המשמש ליצירת כלי חרס.","e":"בעזרת אובניים האומנית יוצרת כלי חרס."},{"u":16,"n":9,"t":"בדיעבד","m":"לאחר מעשה.","e":"טל הודה כי בדיעבד המעשה שעשה היה טעות והוא מצר על כך."},{"u":16,"n":10,"t":"בדעה צלולה","m":"מתוך מחשבה.","e":"השופט הגיע מסקנה כי הנאשם ביצע את המעשה בדעה צלולה תוך ידיעה בחומרתו."},{"u":16,"n":11,"t":"בוסתן","m":"גן.","e":"בבוסתן שליד ביתי ניתן למצוא צמחים רבים."},{"u":16,"n":12,"t":"בורית","m":"סבון.","e":"יש לשטוף בכל בוקר וערב את הפנים עם בורית כדי לשמור על עור נקי."},{"u":16,"n":13,"t":"ביגמיה","m":"גבר הנשואי לשתי נשים בו זמנית.","e":"ביגמיה הייתה מותרת עד לחרם דרבנו גרשון מאז לגבר מותר להינשא לאישה אחת בלבד."},{"u":16,"n":14,"t":"בית מרזח","m":"פאב, בר, מסבאה.","e":"איילה עובדת כברמנית הבית המרזח."},{"u":16,"n":15,"t":"גדה","m":"שפת הנהר.","e":"אמו של דוד הזהירה אותו לא להתקרב לגדה שמא ייפול לנהר."},{"u":16,"n":16,"t":"גומה","m":"חור, שקע.","e":"ליונתן יש גומות בלחיים הבולטות כאשר הוא מחייך."},{"u":16,"n":17,"t":"גלה את לבו","m":"התוודה, סיפר את סודותיו.","e":"חי גלה את לבו בפני אנה וציפה ממנה שלא תספר על כך לאיש."},{"u":16,"n":18,"t":"דאבה","m":"צער, יגון.","e":"יונית נתמלאה דאבה למשמעה הידיעה המצערת."},{"u":16,"n":19,"t":"דברי חלקות","m":"מילות חנופה.","e":"דברי החלקות שאתה אומר אינן עושות עליי רושם שכן אתה ידוע כאדם פלרטטן."},{"u":16,"n":20,"t":"דו פרצופי","m":"צבוע.","e":"יואב נתפס בעייני כאדם דו פרצופי לכן איני מאמינה לדבריו."},{"u":16,"n":21,"t":"דומיננטי","m":"בולט, עיקרי, בעל נוכחות.","e":"אילן היה מאוד דומיננטי באירוע לכן לא ייתכן כי פספסת את נוכחותו."},{"u":16,"n":22,"t":"הלך לאבדון","m":"נהרס, הושמד.","e":"דני השאיר בטעות את המחשב בגינת ביתו בזמן שירד גשם סוער בחוץ, ולכן כל הקבצים שהיו בו הלכו לאבדון."},{"u":16,"n":23,"t":"הלך שולל","m":"הוטעה, רומה.","e":"רונן הלך שולל אחרי דבריה של הודיה שכן היא רצתה רק לנצל אותו."},{"u":16,"n":24,"t":"הלצה","m":"בדיחה.","e":"ההלצה שסיפר יוסי בפני חבריו לא הצחיקה אותם."},{"u":16,"n":25,"t":"המיר","m":"החליף.","e":"חנן המיר בחנות את החולצה שקיבל במכנס שאהב."},{"u":16,"n":26,"t":"העז פנים","m":"התחצף.","e":"שחף העז פנים בפני הוריו ועל כן קיבל עונש."},{"u":16,"n":27,"t":"הצטנפות","m":"התכרבלות, התקפלות.","e":"אדית אוהבת להצטנף בפוך בזמן שקר בחוץ."},{"u":16,"n":28,"t":"התבוסס","m":"התפלש.","e":"הגננת שמה לב שהילד התבוסס בצרכיו אך לא מהירה להחליף לו עד אשר התחיל לבכות."},{"u":16,"n":29,"t":"התערטל","m":"התפשט.","e":"המשטרה עצרה אלמוני שהתערטל בפומבי."},{"u":16,"n":30,"t":"התקשט בנוצות זרים","m":"התפאר בדברים שלא עשה.","e":"ירין אוהב להתקשט בנוצות זרים ולקחת עליהם קרדיט."},{"u":16,"n":31,"t":"התרצה","m":"הסכים.","e":"נפתלי התרצה למשמע דברי בנו."},{"u":16,"n":32,"t":"ונדליזם","m":"השחתת רכוש פרטי או ציבורי ללא סיבה, ברבריות.","e":"ישנם בעלי צימרים באילת שלא מסכימים להשכיר לבני נוער מכיוון שלרוב הם גורמים לונדליזם במקום."},{"u":16,"n":33,"t":"ז'אנר","m":"סגנון.","e":"זוהר ארגוב נחשב לאחד מגדולי וחשובי הזמרים הישראלים, ממובילי הז'אנר המזרחי."},{"u":16,"n":34,"t":"זב חוטם","m":"כינוי גנאי לאדם חסר ניסיון.","e":"המנהלת התעצבנה על העובדת החדשה שלא מילאה את עבודתה כראוי ואף כינתה אותה זב חוטם."},{"u":16,"n":35,"t":"זבן","m":"מוכר בחנות.","e":"שרית ביקשה מהזבן שיעשה לה הנחה עבור השמלה."},{"u":16,"n":36,"t":"זוהמה","m":"לכלוך, סחי, רפש.","e":"לאחר חג הפסח הכינרת התמלאה בזוהמה מעשרות המטיילים שפקדו אותה."},{"u":16,"n":37,"t":"זולת","m":"חוץ מ...","e":"כל השכבה יצאה לטיול שנתי זולת יותם שחלה."},{"u":16,"n":38,"t":"חוטם","m":"אף.","e":"נווה הניח את משקפיו על קצה החוטם."},{"u":16,"n":39,"t":"חרך","m":"חריץ צר.","e":"דרך החרך בתקרה החטוף יכל לקבל מעט אור שמש."},{"u":16,"n":40,"t":"חשך עליו עולמו","m":"קרה לו אסון כבד.","e":"דוד חש כי חשך עליו עולמו לאחר הפיגוע בו נהרגו אשתו ובנותיו."},{"u":16,"n":41,"t":"חתול בשק","m":"מה שטיבו אינו ידוע בוודאות.","e":"נדב קנה את הבית במחיר מאוד מוזל, מה שגרם לו לחשוש שמא קנה חתול בשק."},{"u":16,"n":42,"t":"טרוניה","m":"תלונה, טענה.","e":"יואב בא בטרוניה כלפי מורתו לאנגלית שלא ייחסה להשקעתו חשיבות בשכלול ציון המגן."},{"u":16,"n":43,"t":"יבב","m":"התייפח, בכה.","e":"יוגב יבב לאחר שאמו לא הסכימה לו לצאת לגינה."},{"u":16,"n":44,"t":"יד רוחצת יד","m":"תעזור לי ואעזור לך.","e":"שתי התאגידים הסכימו שבפרויקט הקרוב הם יפעלו יחדו בצורה של יד רוחצת יד כדי למקסם רווחים."},{"u":16,"n":45,"t":"כלאחר יד","m":"בלי כוונה מיוחדת, כבדרך אגב.","e":"יש להתפלל בכוונה מעמיקה ולא כלאחר יד רק כדי לצאת ידי חובה."},{"u":16,"n":46,"t":"כנף הבגד","m":"קצה הבגד.","e":"קריעת כנף הבגד של שאול על-ידי דוד משמשת גם כמוטיב סמלי, שכן בסופו של דבר מלכות שאול התפקרה ודוד מלך תחתיו."},{"u":16,"n":47,"t":"לא לקק דבש","m":"היה צריך להתאמץ.","e":"יהודה לא לקק דבש במהלך לימודי התואר, אלא היה צריך להתאמץ ולהשקיע רבות."},{"u":16,"n":48,"t":"לאבות","m":"לרצות.","e":"הבן רצה לאבות את אביו ולכן ביצע את המטלה שהטיל עליו."},{"u":16,"n":49,"t":"לדאבונו","m":"לצערו.","e":"לדאבונו של דימה לא נותרו כרטיסים להופעה של הזמר שאהב."},{"u":16,"n":50,"t":"לוט בערפל","m":"לא ברור, לא ידוע.","e":"מצבו של הפצוע לוט בערפל, רק בסיום הניתוח הרופאים יוכלו להסביר באופן ברור מה מצבו."},{"u":16,"n":51,"t":"לשון סגי נהור","m":"שימוש במשמעות ההפוכה של המילה.","e":"המנהל אינו היה מרוצה מעצלנותו של העובד, ומכנה אותו \"חרוץ\" בלשון סגי נהור."},{"u":16,"n":52,"t":"מלגו","m":"מבפנים.","e":"אני מכירה אותו ממלגו, לכן איני מאמינה למילות החנופה שלו."},{"u":16,"n":53,"t":"ממיר","m":"מחליף.","e":"יורם ממיר את מכשיר הפלאפון שלו למכשיר חדיש יותר."},{"u":16,"n":54,"t":"מן השיתין","m":"מן היסוד.","e":"בעל החברה החליט לטפל בבעיית השחיתות בחברתו מן השיתין."},{"u":16,"n":55,"t":"מנטלי","m":"שכלי, רגשי.","e":"המתמודדים סיפרו כי מעבר לקושי הפיזי בתחרות הם התמודדו גם עם קושי מנטלי."},{"u":16,"n":56,"t":"מסואב","m":"מלוכלך, מזוהם.","e":"חדרו של ניתאי היה כה מסואב עד שניתן היה לראות עטיפות של חטיפים זרוקים על הרצפה."},{"u":16,"n":57,"t":"מסיק","m":"קטיף זיתים.","e":"במועד המסיק יצאנו אני ואבי לקטוף זיתים בשומרון."},{"u":16,"n":58,"t":"מפוברק","m":"מזויף.","e":"יואב תבע את תמיר על כך שכתב מסמך מפוברק בשמו."},{"u":16,"n":59,"t":"מצדד","m":"תומך.","e":"חן מצדד בטענותיה של שילת, מכיוון שלדעתו היא צודקת."},{"u":16,"n":60,"t":"מקלעת","m":"צמה.","e":"אמי אפתה חלות בצורת מקלעת לכבוד שבת."},{"u":16,"n":61,"t":"מרחשת","m":"מחבת.","e":"הכנתי חביתה באמצעות מרחשת."},{"u":16,"n":62,"t":"מפולפל","m":"בעל מחשבה חדה וחריפה.","e":"הסטודנט היה מפולפל ולכן המרצה הציע לו לעבוד כמתרגל."},{"u":16,"n":63,"t":"מתנשא","m":"מתפאר, מתגאה.","e":"איני אוהבת את התנהגותו של רון בעייני הוא מתנשא ללא סיבה מוצדקת."},{"u":16,"n":64,"t":"נחשול","m":"גל גדול.","e":"בזמן סופה ניתן לראות נחשולים רבים בים."},{"u":16,"n":65,"t":"נישול","m":"גירוש, הדחה, ביטול מעמד.","e":"המורה נישל את דוד מהכיתה לאחר שהתחצף אליו בפומבי."},{"u":16,"n":66,"t":"נמוך רוח","m":"צנוע.","e":"נווה היה אדם נמוך רוח שאף פעם לא התפאר במעשיו."},{"u":16,"n":67,"t":"נסק","m":"המריא.","e":"המטוס נסק אל על תוך שניות ספורות."},{"u":16,"n":68,"t":"נתן דפי","m":"הטיל בו פגם.","e":"עמית נתן דפי בדבריו של חברו אופיר, למרות שלא היה לו סיבה לכך."},{"u":16,"n":69,"t":"סיף","m":"חרב, פגיון.","e":"בעבר כל לוחם היה יוצא למלחמה עם סיף בידו כדי להכניע את האויב."},{"u":16,"n":70,"t":"סייפא","m":"סוף.","e":"בסייפא של דבריי אבקש להודות לקב\"ה."},{"u":16,"n":71,"t":"סקנדל","m":"שערורייה.","e":"חבר הכנסת גרם לסקנדל נוסף לאחר שנתפס נוהג שתוי."},{"u":16,"n":72,"t":"סתור","m":"לא מסודר, פרוע.","e":"הודיה קמה בבוקר עם שיער סתור ולכן הייתה צריכה לסדר אותו לפני צאתה מהבית."},{"u":16,"n":73,"t":"עומד במריו","m":"לא מוותר, לא נכנע.","e":"יוסי עומד במריו למרות הקושי הרב הכרוך במשימה שהוטלה עליו."},{"u":16,"n":74,"t":"עט","m":"הסתער.","e":"החייל עט על המחבל ומנע בכך פיגוע רב נפגעים."},{"u":16,"n":75,"t":"עיניים טרוטות","m":"עיניים חלשות ורכות.","e":"רחל הייתה בעלת עינים טרוטות לאחר שבכתה ימים רבים."},{"u":16,"n":76,"t":"עקלקל","m":"מתפתל.","e":"הכביש היה מאוד עקלקל כך שהייתי צריך לנהוג לאט מאוד ובזהירות."},{"u":16,"n":77,"t":"עשה נפשות","m":"גייס תומכים למטרה מסוימת.","e":"ארגון הטרור דעא\"ש עשה נפשות באופן מעורר בחילה למען הלחימה שלו בשם האסלאם."},{"u":16,"n":78,"t":"עשה שקר בנפשו","m":"פעל בדרך שלא מאמין בה, התעלם ממצפונו.","e":"יואב, חייל בארגון פשע מוכר, עשה שקר בנפשו אך המשיך במעשיו בשל התגמול הכספי הגבוה."},{"u":16,"n":79,"t":"פקטור","m":"גורם.","e":"כפיר טוען שהאיומים שקיבל על חייו בשל תפקידו שישמשו פקטור מרכזי לפרישתו."},{"u":16,"n":80,"t":"פרולוג","m":"הקדמה.","e":"בתחילתו של הספר יש פרולוג המשמש תקציר לעלילה."},{"u":16,"n":81,"t":"צנום","m":"רזה, כחוש.","e":"בעקבות מחלותו יואב הפך לצנום עד שהיה נראה כשלד המהלך."},{"u":16,"n":82,"t":"צפון","m":"מוסתר, חבוי.","e":"כספו של דן היה צפון היטב בתוך תיקו מחשש שייגנב."},{"u":16,"n":83,"t":"צר","m":"אויב.","e":"מכתו של חבר כואבת יותר ממכתו של צר."},{"u":16,"n":84,"t":"קוב","m":"מטר מעוקב, משמש כמידת נפח.","e":"רונן צריך 1500 קוב מים כדי למלא את הבריכה בביתו."},{"u":16,"n":85,"t":"קונוס","m":"גוף תלת ממדי, מכונה גם חרוט.","e":"הליצן חבש כובע בצורת קונוס."},{"u":16,"n":86,"t":"קונפורמי","m":"פשרן, סתגלן, הולך בתלם.","e":"אביעד נחשב לאדם מאוד קונפורמי, הוא אף פעם אינו יוזם דברים אלא מקבל את המצב הקיים."},{"u":16,"n":87,"t":"קוצר יד","m":"חוסר יכולת.","e":"נכותו של רפאל תסכלה אותו שכן היא העמידה אותו במצבים רבים של קוצר יד לבצע דברים מסוימים."},{"u":16,"n":88,"t":"רפורמה","m":"תהליך שינוי יסודי.","e":"הרפורמה החדשה של שר החינוך עודדה תלמידים לגשת לבגרות במתמטיקה ברמת 5 יח\"ל."},{"u":16,"n":89,"t":"רפרזנטטיבי","m":"ייצוגי.","e":"אחת מהדרישות לתפקיד של איש מכירות היא להיראות רפרזנטטיבי."},{"u":16,"n":90,"t":"שבק","m":"עזב, התעייף.","e":"מכשיר הפלאפון שבק חיים לאחר כשלוש שנים."},{"u":16,"n":91,"t":"שגגה","m":"טעות, שגיאה.","e":"המלצרית שפכה בשגגה את כוס הנס על הלקוח."},{"u":16,"n":92,"t":"שגור","m":"רגיל, נפוץ.","e":"יונתן קם לעוד יום שגור של שיגרה קבועה."},{"u":16,"n":93,"t":"שזר","m":"שילב, קלע.","e":"עמית שזר זר פרחים עבור חברתו לכבוד יום אהבה."},{"u":16,"n":94,"t":"תוכחה","m":"העברת ביקורת, נזיפה.","e":"המנהלת פנתה אל העובדים בדברי תוכחה על כך שהחנות אינה הייתה מסודרת כפי שביקשה."},{"u":16,"n":95,"t":"תורפה","m":"נקודת חולשה, רפיון.","e":"אחת מנקודות התורפה בגוף האדם היא המפרקת, מכה באזור זה יכולה להסב נזק רב."},{"u":16,"n":96,"t":"תחריט","m":"ציור חקוק בנחושת.","e":"האומן יצר תחריט מנחושת בעזרת לוח הדפסה."},{"u":16,"n":97,"t":"תלאות","m":"צרות, ייסורים.","e":"רבים מהעולים לארץ בזמן הקמתה עברו תלאות רבות בדרך."},{"u":16,"n":98,"t":"תענית","m":"צום.","e":"תענית יום הכיפורים היא מצווה מהתורה בשונה משאר התעניות שאותם תיקנו חכמים."},{"u":16,"n":99,"t":"תקע טריז","m":"הפריד.","e":"המגשר תקע טריז בין שתי המסוכסכים."},{"u":16,"n":100,"t":"תקע יתד","m":"התיישב, התנחל.","e":"ביל תקע יתד בארץ לאחר שהתאהב בבחורה ישראלית שהכיר."},{"u":17,"n":1,"t":"אבן שאין לה הופכין","m":"דבר שאין בו שימוש.","e":"מאז שקניתי פלאפון, הטלפון בביתי עומד כאבן שאין לה הופכין ולכן החלטתי לנתקו."},{"u":17,"n":2,"t":"אבסולוטי","m":"מוחלט, שלם, גמור.","e":"סבי האמין באופן אבסולוטי בקיומו של אלוקים."},{"u":17,"n":3,"t":"אגד","m":"(1) תחבושת, פלסתר. (2) צרור, אלומה.","e":"יונתן נחתך בשוגג מסכין בעת שחתך סלט, ולכן נאלץ לחבוש את אצבעו עם אגד."},{"u":17,"n":4,"t":"אגרסיבי","m":"כוחני, תקיף.","e":"יואב נחשב לאדם מאוד אגרסיבי ולא נעים הליכות."},{"u":17,"n":5,"t":"אותה הגברת בשנוי אדרת","m":"הדבר נשאר כשהיה, ללא שינוי משמעותי.","e":"אינך מחדש דבר בדבריך שכן זאת אותה הגברת בשנוי אדרת."},{"u":17,"n":6,"t":"איחוי","m":"חיבור.","e":"לאחר זכייתו של ראש הממשלה בבחירות הוא הבטיח כי יפעל לאיחוי הקרעים שנפערו בעקבותיהם."},{"u":17,"n":7,"t":"אמודאי","m":"צוללן.","e":"טרם נכנס האמודאי למים הוא לבש את חליפת הצלילה."},{"u":17,"n":8,"t":"אמתלה","m":"תירוץ.","e":"המורה ביקשה מהתלמיד שלא ייתן לה אמתלות מדוע איחר לשיעור."},{"u":17,"n":9,"t":"אצעדה","m":"צמיד.","e":"לכבוד יום הולדתה של שרית חברתה קנתה לה אצעדה."},{"u":17,"n":10,"t":"אתנחתא","m":"הפסקה.","e":"מאמנו האישי של יואב אמר לו כי בין כל סט תרגילים יש לעצור לאתנחתא קצרה."},{"u":17,"n":11,"t":"בגדי חמודות","m":"בגדים נאים ומכובדים.","e":"לכבוד חתונת ביתו קנה האב בגדי חמודות."},{"u":17,"n":12,"t":"בזעיר אנפין","m":"בקנה מידה קטן.","e":"סיפור עקדת יצחק הוא בזעיר אנפין אחד מסיפורי התנ\"ך."},{"u":17,"n":13,"t":"בכבד ראש","m":"ברצינות, לאחר מחשבה.","e":"שרת המשפטים ונשיאת בית המשפט העליון דנו בכבד ראש על המועמדים לשופטים בבית המשפט העליון."},{"u":17,"n":14,"t":"במזיד","m":"בכוונה להרע.","e":"ליאור מואשם בגרימת מוות במזיד שכן הייתה בכוונתו לפגוע במנוח."},{"u":17,"n":15,"t":"בנפש חפצה","m":"ברצון רב.","e":""},{"u":17,"n":16,"t":"בציר","m":"קטיף ענבים.","e":"עונת הבציר תתרחש בין חודש אוגוסט לבין חודש אוקטובר בשנה הבאה."},{"u":17,"n":17,"t":"גלעין","m":"חרצן, גרעין הפרי.","e":"יואב הוציא מהפרי את הגלעין והשליכו לפח בטרם אכל אותו."},{"u":17,"n":18,"t":"גמילה","m":"הפסקת הרגל מזיק.","e":"גמילה מעישון נחשבת לתהליך קשה הכרוך לעיתים בתופעות לוואי וזאת בשל החוסר המשמעותי בניקוטין."},{"u":17,"n":19,"t":"גנזך","m":"ארכיון.","e":"בגנזך יד ושם ניתן למצוא אוסף חומרים ארכיוני הקשור לשואה."},{"u":17,"n":20,"t":"גרס","m":"טען.","e":"פרקליטו של הנאשם גרס לחפותו."},{"u":17,"n":21,"t":"דחה בקש","m":"התחמק מלתת תשובה בתירוצים קלושים.","e":"התלמיד דחה בקש את מורתו לאחר ששאלה אותו מדוע איחר לשיעור."},{"u":17,"n":22,"t":"דיבר סרה","m":"השמיץ, ביזה.","e":"המתמודד דיבר סרה על יריבו בריש גלי."},{"u":17,"n":23,"t":"דיותה","m":"כלי קיבול לדיו.","e":"לאחר שהסופר סיים לכתוב הוא הניח את העט דיו בתוך הדיותה."},{"u":17,"n":24,"t":"דלק","m":"(1) בער. (2) רדף.","e":"השוטר דלק אחר החשוד."},{"u":17,"n":25,"t":"הב","m":"תן, תביא.","e":"האב ביקש מהבן, הב לי את הפלאפון מהחדר."},{"u":17,"n":26,"t":"הביל","m":"לח, ספוג אדים.","e":"החזאי אמר כי מזג-האוויר בימים הקרובים יהיה הביל במיוחד באזור מישור החוף."},{"u":17,"n":27,"t":"הגיגים","m":"הרהורים, מחשבות.","e":"לרינת היו הגיגים רבים האם ההחלטה להינשא לנהוראי נכונה."},{"u":17,"n":28,"t":"הדיוט","m":"שאינו מומחה, חסר השכלה.","e":"ליאב היה הדיוט בנושא, לכן העדיף להתייעץ עם מומחה."},{"u":17,"n":29,"t":"הדיח","m":"(1) הסית למעשה רע. (2) העבירו מתפקידו.","e":"מנכ\"ל החברה החליט להדיח את העובד מתפקידו בעקבות אי השקעתו."},{"u":17,"n":30,"t":"הולך בטל","m":"בטלן.","e":"אשתו של אלכס הייתה מתוסכלת מכך שהוא הולך בטל ולא מחפש עבודה."},{"u":17,"n":31,"t":"הזין","m":"האכיל.","e":"ינון הזין את הארנבת בגן החיות."},{"u":17,"n":32,"t":"הטיל מורא","m":"הפחיד.","e":"העבריין הטיל מורא על סובביו."},{"u":17,"n":33,"t":"היפותזה","m":"השערה.","e":"ההיפותזה של החוקר נראתה לחוקרים אחרים כמופרכת ולא הגיונית."},{"u":17,"n":34,"t":"הלך בתלם","m":"התנהג כמקובל.","e":"הוריו של נווה חזרו מאסיפת ההורים מרוצים לאחר שמורתו אמרה בפניהם שהוא ילד טוב ההולך בתלם."},{"u":17,"n":35,"t":"המרה את פיו","m":"לא ציית לדבריו.","e":"ניתאי המרה את פיו של אביו ולכן קיבל עונש."},{"u":17,"n":36,"t":"המתיק את הגלולה","m":"הקל.","e":"הרופא המתיק את הגלולה בכך שנתן לחולה משככי כאבים."},{"u":17,"n":37,"t":"ויטאלי","m":"שופע חיים, חיוני.","e":"המורה נחשב לאוהד בקרב התלמידים וההנהלה מכיוון שתמיד נראה ויטאלי ונמרץ."},{"u":17,"n":38,"t":"זחיחות דעת","m":"יהירות, שחצנות.","e":"זחיחות הדעת של חי בסוף תכשיל אותו, מכיוון שאנשים אינם אוהבים להיות בחברת גאוותנים."},{"u":17,"n":39,"t":"זיכוך","m":"ניקוי, טיהור.","e":"יוחאי אוהב לטבול במקווה בכל יום שישי, זה נותן לו תחושת זיכוך לפני השבת."},{"u":17,"n":40,"t":"זרנוק","m":"צינור להשקיה או לכיבוי אש.","e":"בזמן השריפה הכבאי פרש את הזרנוק."},{"u":17,"n":41,"t":"זרע אל הקוצים","m":"טרח לשווא.","e":"לאחר שיואב התבשר כי נכשל במבחן למרות שלמד ימים ולילות הוא חש זרע אל הקוצים."},{"u":17,"n":42,"t":"חביצה","m":"פודינג.","e":"השף השתמש בחביצה להכנת הקינוח."},{"u":17,"n":43,"t":"חברבר","m":"מנומר.","e":"מעילה של נירית היה חברבר, זה היה נראה כאילו נלקח מעור שתוקק","m":"רצה מאוד.","e":"בן זוגה של חן השתוקק לראותה לאחר שחזר מחו\"ל."},{"u":18,"n":34,"t":"התגפף","m":"התחבק מתוך אהבה, התלטף.","e":"יקיר התגפף עם חברתו כשחזר מהצבא."},{"u":18,"n":35,"t":"התחבט","m":"התלבט.","e":"טלי התחבטה האם לצאת עם חברותיה בערב או להישאר בבית."},{"u":18,"n":36,"t":"התנצח","m":"התווכח, התפלמס.","e":"בעלי החברה התנצח עם שותפו לגבי המשך העסקתו של אחד העובדים בחברה."},{"u":18,"n":37,"t":"זבד","m":"מתנה, דורון, שי.","e":"לכבוד יום הולדתה של רוני סבא וסבתא קנו לה זבד."},{"u":18,"n":38,"t":"זיו","m":"זוהר.","e":"פניה של הכלה נמלאו זיו ביום חופתה."},{"u":18,"n":39,"t":"זיז","m":"בליטה.","e":"בשולחן שהזמנו היה זיז קטן ולכן ביקשנו להחליפו."},{"u":18,"n":40,"t":"זרז","m":"מזרז פעולה, מאיץ.","e":"אנזים הוא חלבון המשמש זרז של תהליכים כימיים ביצורים חיים."},{"u":18,"n":41,"t":"חיגר","m":"צולע, פיסח.","e":"יקיר חיגר ברגלו כתוצאה מפציעה במהלך שירותו הצבאי."},{"u":18,"n":42,"t":"חלמאי","m":"שוטה, כינוי לטיפש.","e":"חכם מדבר כשיש לו משהו לומר, חלמאי מדבר מפני שהוא חייב לומר משהו."},{"u":18,"n":43,"t":"חציצה","m":"הפרדה, הבדלה, סייג.","e":"בחתונות דתיות ניתן לראות כי קיימת חציצה בין גברים לנשים."},{"u":18,"n":44,"t":"חתימת שפם","m":"ראשית צמיחתו של השפם.","e":"אבי תמיד טוען שילד נהפך לגבר כאשר רואים בפניו חתימת שפם."},{"u":18,"n":45,"t":"טביעת עין","m":"היכולת לעמוד לעומק על טיבו של דבר על פי מראהו בלבד.","e":"ליואב יש טביעת עין חדה מה שעוזר לו בעבודתו כחוקר."},{"u":18,"n":46,"t":"טוב הדבר בעיניו","m":"הדבר מצא חן בעיניו.","e":"המתמודד בתחרות הבישול חשש מביקורותיהם של השופטים, אך לאחר שאלו חייכו לעברו לאחר טעימת המנה הוא הבין שטוב הדבר בעיניהם."},{"u":18,"n":47,"t":"טח","m":"מכוסה, נאטם.","e":"עיניו של החטוף טחו ולכן לא היה יכול לראות לאן מובילים אותו חוטפיו."},{"u":18,"n":48,"t":"טרקלין","m":"סלון, אולם, לובי.","e":"בכניסה לביתו של הגביר היה טרקלין גדול ומפואר."},{"u":18,"n":49,"t":"יצא לשוח","m":"הלך לטייל.","e":"ליאור יצא לשוח בחורשה ליד ביתו, ולחרדתו נתקל בנחש."},{"u":18,"n":50,"t":"ישימון","m":"מדבר, ציה.","e":"הישימון הוא אזור צחיח המועט בצמחייה."},{"u":18,"n":51,"t":"כילי","m":"קמצן, צייקן.","e":"אור היה כילי ולכן חברתו רצתה להיפרד ממנו."},{"u":18,"n":52,"t":"כפן","m":"רעב.","e":"לקראת סוף צום יום הכיפורים חש דוד כפן עז שהקשה עליו להמשיך לצום."},{"u":18,"n":53,"t":"כתמול שלשום","m":"כמו תמיד, כרגיל.","e":"שרגא רטן כי חייו בנאליים ושגרתיים כל יום כתמול שלשום."},{"u":18,"n":54,"t":"לא בשמים היא","m":"דבר שניתן להשיג.","e":"לאחר שנורית ביצעה את המשימה היא אמרה כי לא בשמים היא וכל אחד יכול לבצעה."},{"u":18,"n":55,"t":"לא ידע את נפשו","m":"היה נרגש ונבוך.","e":"תום לא ידע את נפשו בעקבות מסיבת ההפתעה שערכה לו משפחתו."},{"u":18,"n":56,"t":"לא נקף אצבע","m":"לא התערב.","e":"יוני לא נקף אצבע בוויכוח שהתרחש בין שני חבריו מכיוון שידע שהתערבותו תגרום להחמרת המצב."},{"u":18,"n":57,"t":"לאין שיעור","m":"ללא גבול.","e":"אהבתי אלייך לאין שיעור, בלתי ניתן לעמוד אותה בקנה מידה."},{"u":18,"n":58,"t":"מאוים","m":"אדם שמנסים לפגוע בו.","e":"הנאשם טען להגנתו כי חש מאוים מהנדקר ולכן דקר אותו."},{"u":18,"n":59,"t":"מגוב","m":"מגרפה.","e":"הגנן השתמש במגוב כדי לנקות את העלים שגזם."},{"u":18,"n":60,"t":"מעוגן","m":"מבוסס, מסתמך.","e":"קביעתו של החוקר מעוגנת על עובדות מתוך מחקרים שנעשו ולא על השערות."},{"u":18,"n":61,"t":"מצילה","m":"פעמון.","e":"איבון צלצלה מספר פעמים במצילה בכניסה לביתה של חן וכאשר לא זכתה למענה ניסתה לפתוח את הדלת."},{"u":18,"n":62,"t":"מקנה","m":"שם כולל לצאן ולבקר.","e":"אודי התחיל את דרכו כרועה צאן אצל דודו שהיה בעל מקנה רב."},{"u":18,"n":63,"t":"מר נפש","m":"מתוסכל, ממורמר.","e":"יוני היה מר נפש לאחר שהעסק שעמל עליו ימים כלילות והשקיע בו את כל הונו פשט רגל."},{"u":18,"n":64,"t":"מרות","m":"סמכות.","e":"למנהל בית- הספר יש את המרות להשעות תלמיד מבית- הספר במידה ויש לו סיבה מוצדקת לכך."},{"u":18,"n":65,"t":"מרזב","m":"צינור היורד מן הגג המשמש להורדת מי הגשמים מהגג למטה","e":"בעת בניית הבית דאג הקבלן להתקין מרזב כדי למנוע התנקזות של מים על הגג."},{"u":18,"n":66,"t":"מרי","m":"התנגדות","e":"הלקוח המאוכזב עמד במרי ולא הסכים לקבל את הצעת החברה לפצות אותו רק בחלק מן הסכום."},{"u":18,"n":67,"t":"מרית","m":"שפכטל","e":"השיפוצניק השתמש במרית כדי לטייח את קירות החדר."},{"u":18,"n":68,"t":"מש","m":"זז, נע","e":"התלמיד אינו מש ממקומו לאחר שהמורה נזפה בו על התנהגותו."},{"u":18,"n":69,"t":"משלח יד","m":"עבודה, עיסוק, מקצוע","e":"משלח ידו העיקרי של האמן הוא ממכירת יצירותיו."},{"u":18,"n":70,"t":"נול","m":"מכונת אריגה","e":"התופרת טוותה את השטיח באמצעות נול."},{"u":18,"n":71,"t":"נושה","m":"אדם המלווה כסף","e":"רפאל היה נושה כסף לחברו איתמר, אך כשראה שאיתמר אינו מחזיר לו את הכסף ורק מבקש עוד הפסיק להלוואת לו."},{"u":18,"n":72,"t":"נחבא אל הכלים","m":"צנוע, ביישן, עניו","e":"דניאלה נחבאת אל הכלים כי לתפיסתה זהו ערך חשוב מאד בחיי אדם."},{"u":18,"n":73,"t":"נחירה","m":"המתת בעלי חיים על ידי דקירה בצוואר","e":"המתת בעלי חיים באמצעות נחירה אסורה לפי ההלכה."},{"u":18,"n":74,"t":"ניאוף","m":"קיום יחסי מין עם אישה הנשואה לגבר אחר.","e":"בעלה של שירן החליט להתגרש ממנה לאחר שגילה כי היא נואפת עם מישהו מהעבודה."},{"u":18,"n":75,"t":"ניחא","m":"טוב, נוח","e":"ניחא היה לה לישון בספא למרות שהייתה לה אפשרות לישון במיטה."},{"u":18,"n":76,"t":"ניכוש","m":"עקירת עשבים שוטים","e":"ניכוש עשבים היא עבודה שאינה נגמרת שכן העשבים השוטים תמיד יצמחו מחדש."},{"u":18,"n":77,"t":"סוור","m":"סבל בנמל","e":"תפקידו של הסוור בנמל הוא פיזי וסיזיפי אך יש לו תגמול כספי הולם."},{"u":18,"n":78,"t":"סוס טרויאני","m":"בגידה","e":"לאחר שאלמוג התפטר ועבר לעבוד בחברה המתחרה כינה אותו מעסיקו לשעבר סוס טרויאני."},{"u":18,"n":79,"t":"סורר ומורה","m":"מרדן ועקשן","e":"בני סורר ומורה ואיני יודע איך לחנכו, שיתף האב את חברו."},{"u":18,"n":80,"t":"סיס","m":"עובד המטפל בסוסים","e":"ניר היה סיס שטיפל בסוסיו במסירות נפש ובאהבה רבה."},{"u":18,"n":81,"t":"עטוי","m":"מכוסה","e":"הקוסם היה עטוי גלימה שחורה וארוכה עד לרצפה."},{"u":18,"n":82,"t":"עקם את חוטמו","m":"התייחס באי -שביעות רצון","e":"האב עקם את חוטמו כאשר ראה את התעודה של בנו."},{"u":18,"n":83,"t":"עוכר","m":"בלתי צלול","e":"נחל הירקון עוכר ומזוהם ועל כן השחייה בו אסורה."},{"u":18,"n":84,"t":"על פניו","m":"לכאורה","e":"סנגורו של החשוד אמר לו שעל פניו אין לו מה לחשוש מכיוון שלפרקליטות אין מספיק ראיות להפלילו."},{"u":18,"n":85,"t":"פחוס","m":"שטוח, מעוך","e":"רונית רידדה את הבצק בעזרת מערוך כדי שיהיה פחוס."},{"u":18,"n":86,"t":"פסח","m":"צולע","e":"טל לא יכל ללכת בצורה רגילה מכיוון שהיה פסח."},{"u":18,"n":87,"t":"צורר","m":"שונא, אויב","e":"היטלר היה צורר יהודים ופעל על-מנת להשמידם."},{"u":18,"n":88,"t":"צנוף","m":"עטוף","e":"התינוק היה צנוף בשמיכה היטב לפני שהוריו יצאו איתו מהבית."},{"u":18,"n":89,"t":"קב","m":"משענת לצלוע","e":"יונתן נאלץ להיעזר בקביים לאחר ששבר את רגלו."},{"u":18,"n":90,"t":"קולקציה","m":"אוסף","e":"הקולקציה החדשה של המעצבת זכתה לתשבחות רבות בקרב המבקרים."},{"u":18,"n":91,"t":"קונקרטי","m":"ממשי, מוחשי","e":"הראיות קונקרטיות הן אלו שהובילו להרשעה."},{"u":18,"n":92,"t":"קרדום","m":"גרזן","e":"אליאב חטב עצים באמצעות קרדום."},{"u":18,"n":93,"t":"רגיונלי","m":"אזורי","e":"ליהודים בערים שונות במרוקו היו מנהגים שונים וזאת בשל מרחקם רגיונלי."},{"u":18,"n":94,"t":"רדייה","m":"שליטה ביד קשה","e":"פרעה רדה ביהודים ושיעבד אותם לפי רצונו."},{"u":18,"n":95,"t":"רובץ","m":"שוכן, שוהה במקום אחד זמן רב","e":"אלרואי רובץ בבית חברו הטוב כבר תקופה ארוכה למרות שחברו רומז לו שיחפש מקום אחר."},{"u":18,"n":96,"t":"שוד ושבר","m":"קריאת צער וייאוש","e":"לאחר התבשרותה על מות בנה זעקה האם שוד ושבר על כך שנלקח באיבו."},{"u":18,"n":97,"t":"שעבוד","m":"עבדות","e":"ליאת מרגישה שהיא משועבדת לעבודתה, מכיוון שבתקופה האחרונה היא הדבר היחיד שממלא את זמנה."},{"u":18,"n":98,"t":"תש","m":"נחלש, התעייף","e":"מרדכי חש כי כוחו תש והוא לא חזק כבצעירותו."},{"u":18,"n":99,"t":"תשחורת","m":"נוער, נעורים, עלומים","e":"ימי התשחורת עוברים ומותירים רק זיכרונות נעימים בעוד הזקנה דופקת בפתח."},{"u":18,"n":100,"t":"תשליל","m":"סרט צילום","e":"הצלם שמר את התשליל כדי לפתח את התמונות שבו."},{"u":19,"n":1,"t":"אבן שפה","m":"האבנים המצויות בשולי הכביש המפרידות בין הכביש והמדרכה.","e":"שי לא יכל לחנות מול המרפאה מכיוון שאבני השפה היו צבועות באדום ולבן."},{"u":19,"n":2,"t":"אגב אורחא","m":"דרך אגב.","e":"יצאתי לסידורים אחזור רק בערב, אגב אורחא השארתי אוכל במקרר."},{"u":19,"n":3,"t":"אגל","m":"טיפה, רסיס.","e":"אגלי טל ירדו עליי בצאתי בבוקר מהבית."},{"u":19,"n":4,"t":"אדוה","m":"גל קטן.","e":"בזמן ששחתי בברכה יצרתי אדוות במים סביבי."},{"u":19,"n":5,"t":"אין לדברים שחר","m":"לא נכון כלל וכלל.","e":"החוקר הטיח בפני הנאשם שאין לדברים שחר שכן הוא נמצא משקר מספר פעמים."},{"u":19,"n":6,"t":"איפה ואיפה","m":"יחס מפלה.","e":"המורה אמרה שאצלה בכיתה אין יחס של איפה ואיפה, היא נותנת יחס שווה לכל תלמידיה."},{"u":19,"n":7,"t":"איתן","m":"חזק.","e":"למרות כל הקשיים שעבר בחייו דור נשאר איתן ולא נשבר."},{"u":19,"n":8,"t":"אתרע מזלו","m":"המזל לא היה לצדו.","e":"יאיר הימר על סכום נכבד כי היה בטוח שיזכה, אך אתרע מזלו והוא הפסיד את כספו."},{"u":19,"n":9,"t":"בד בבד","m":"ביחד, בו זמנית.","e":"סטודנטים רבים נאלצים לעבוד בד בבד עם הלימודים כדי לממן אותם."},{"u":19,"n":10,"t":"בא כוח","m":"נציג, מורשה, מיופה כוח.","e":"בא כוח של הנאשם נלחם על חפותו."},{"u":19,"n":11,"t":"באוש","m":"מסריח, מעופש, עבש, מצחין.","e":"הכריך טונה ששכח אדיר בתיקו לפני כשבוע היה באוש."},{"u":19,"n":12,"t":"בגינו","m":"בגללו, בעטיו.","e":"אין לך מה להיפגע בגינו, הוא ידוע כאדם פוגעני שאינו מתחשב בזולת."},{"u":19,"n":13,"t":"בדותה","m":"שקר, כזב.","e":"יואב לא האמין כי כל מה שאמרה לו שירה היה בדותה כדי למצוא חן בעיניו וששום דבר מכך אינו אמיתי."},{"u":19,"n":14,"t":"בדמי ימיו","m":"באמצע חייו.","e":"אילן רמון נפטר בדמי ימיו בגיל 94, בשל התרסקות מעבורת קולומביה."},{"u":19,"n":15,"t":"בהרת","m":"מחלה המאופיינת בהופעת כתמים לבנים בעור.","e":"רופא העור הסביר למטופל כי הכתמים הלבנים שעל עורו נובעים ממחלה בשם בהרת."},{"u":19,"n":16,"t":"גבהו ממנו הדברים","m":"לא הבין.","e":"נאור הרגיש כי גבהו ממנו דבריו של המרצה."},{"u":19,"n":17,"t":"גבן","m":"מי שגבו עקום, בעל חטוטרת.","e":"אביב היה גבן ולכן סבל מבעיות רבות בגב."},{"u":19,"n":18,"t":"גדיד","m":"קטיף תמרים.","e":"עונת הגדיד מתרחשת בחודשיים אוגוסט וספטמבר."},{"u":19,"n":19,"t":"גזוזטרה","m":"מרפסת.","e":"בחג הסוכות השנה בנינו סוכה בגזוזטרה שבביתנו החדש."},{"u":19,"n":20,"t":"דאיה","m":"ריחוף באוויר.","e":"מזג האוויר אפשר דאיה מוצלחת."},{"u":19,"n":21,"t":"דבקה נ ","e":"צחי כלכל את צעדיו היטב לפני שהחליט לפתוח מסעדה בעיר."},{"u":19,"n":57,"t":"כמיהה","m":"רצון עז, השתוקקות, התאוות.","e":"לירון חשה כמיהה לאכול מתוק בזמן הדיאטה אך התגברה על חשק זה."},{"u":19,"n":58,"t":"כרונולוגי","m":"תיאור רצף אירועים לפי סדר התרחשותם.","e":"הספר מסודר באופן כרונולוגי מהולדתו של הגיבור על למותו."},{"u":19,"n":59,"t":"לבילי","m":"בלתי יציב.","e":"ליאל חששה לצאת עם ירון כי הוא נראה לה אדם לבילי."},{"u":19,"n":60,"t":"לבלוב","m":"פריחת ניצנים.","e":"באביב ניתן לראות את לבלוב העצים."},{"u":19,"n":61,"t":"לסטים","m":"שודד, גנב.","e":"לאחר שמשך סכום גדול מהבנק יואב חשש מפני לסטים שיגנבו את כספו."},{"u":19,"n":62,"t":"מבוזר","m":"מפוזר.","e":"לפני הקמת המדינה היהודים היו מבוזרים בקהילות שונות ברחבי העולם."},{"u":19,"n":63,"t":"מבלק","m":"נתון באי סדר.","e":"ארונו של גל היה מבלק כך שלא היה ניתן למצוא בו דבר."},{"u":19,"n":64,"t":"מבוסם","m":"שיכור, בגילופין.","e":"בדיקת \"הינשוף\" איששה שחנן אכן היה מבוסם."},{"u":19,"n":65,"t":"מבוע","m":"מעיין, מקור מים.","e":"מידי יום שישי אופק הולך לטבול במבוע שליד ביתו."},{"u":19,"n":66,"t":"מבותק","m":"משוסע.","e":"גופתו של המטייל שנעדר נמצאה מבותקת לאחר שדב תקף אותו."},{"u":19,"n":67,"t":"מבכירה","m":"אישה היולדת את בנה הראשון.","e":"מטר היה לחוץ מחוץ לחדר הלידה, בעת שאשתו מבכירה."},{"u":19,"n":68,"t":"מגואל","m":"מלוכלך, מזוהם.","e":"ידיו של הרוצח היו מגואלות בדם לאחר שדקר למוות את הנרצח."},{"u":19,"n":69,"t":"מדמנה","m":"מזבלה.","e":"יואב השליך למדמנה את כל החפצים המיותרים בביתו."},{"u":19,"n":70,"t":"מושך בעט","m":"עוסק בכתיבה.","e":"הרלן קובן הוא מושך בעט מפורסם שזכה בפרסים רבים על ספריו."},{"u":19,"n":71,"t":"מליץ","m":"אדם שממליץ על מישהו אחר, מדבר בזכותו.","e":"בראיון העבודה ביקש המנהל מהמרואיין שיביא לו טלפון של מליץ שידבר בזכותו."},{"u":19,"n":72,"t":"נאד","m":"שק עור לנשיאת נוזלים.","e":"בעבר היו נושאים מים בעזרת נאדות."},{"u":19,"n":73,"t":"נבוב","m":"חלול, ריק מתוכן.","e":"דניאלה אמרה כי אינה מעוניינת לצאת עם שלומי מכיוון שהיא מחפשת בחור חכם ולטענתה הוא נבוב."},{"u":19,"n":74,"t":"נדף","m":"התפשט, נמוג.","e":"מבגדיו של אביתר נדף ריח של זיעה לאחר האימון."},{"u":19,"n":75,"t":"סבא","m":"השתכר.","e":"בחג הפורים מאיר סבא מיין כדי לקיים את מצוות עדי לא ידע."},{"u":19,"n":76,"t":"סדקית","m":"שם כולל לחפצים קטנים, ובעיקר כלי תפירה.","e":"בביתה של גלית יש מגירה עם סדקית למקרה בו תצטרך תיקון בבגד."},{"u":19,"n":77,"t":"סקירה","m":"ראייה כוללת של דבר, השקפה.","e":"בזמן ההיריון מיכל נתבקשה לעשות סקירת מערכות כדי לבדוק את שלמות כל המערכות הפנימיות של העובר."},{"u":19,"n":78,"t":"עלומים","m":"נעורים.","e":"סבי סיפר לי כי הוא הכיר את סבתי עוד בימי העלומים."},{"u":19,"n":79,"t":"עמד על טיבו","m":"בחן אותו.","e":"המתחרה עמד על טיבו של יריבו כדי למצוא את נקודות התורפה שלו."},{"u":19,"n":80,"t":"עבודה זרה","m":"עבודת אלילים.","e":"האיסור על עבודה זרה הוא אחד מהצווים בעשרת הדיברות, שנאמר: \"לא יהיה לך אלקים אחרים על פני. לא-תעשה לך פסל, וכל- תמונה\" (שמות, כ', ב'-ג')"},{"u":19,"n":81,"t":"עדי","m":"תכשיט.","e":"ביום הולדתי הורי קנו לי עדי שאענוד על צווארי."},{"u":19,"n":82,"t":"פלג","m":"חלק.","e":"אורי נפצע בתאונת דרכים בפלג גופו התחתון וכתוצאה מכך לא יכל להזיז את רגליו."},{"u":19,"n":83,"t":"פרגוד","m":"וילון.","e":"יואב הסתתר מאחורי הפרגוד בביתו בזמן שהוא ואחיו שחקו במחבואים."},{"u":19,"n":84,"t":"צהל","m":"שמח.","e":"אוהד הקבוצה צהל כשראה שקבוצתו ניצחה במשחק."},{"u":19,"n":85,"t":"צור מחצבתו","m":"מקום מולדתו.","e":"סבי לעולם לא ביקר בצור מחצבתו גרמניה, לטענתו הוא לא יוכל לעמוד שוב במקום בו איבד את כל משפחתו."},{"u":19,"n":86,"t":"קושש","m":"אסף, ליקט.","e":"הילדים קוששו קרשים לקראת ל\"ג בעומר."},{"u":19,"n":87,"t":"קיבורת","m":"שריר הזרוע.","e":"אור הלכה לחדר -כושר כדי לחזק את הקיבורת."},{"u":19,"n":88,"t":"קיטון","m":"חדר קטן.","e":"איני יכול לארח חברים בחדרי מכיוון שהוא קיטון."},{"u":19,"n":89,"t":"קלישה","m":"ביטוי נדוש.","e":"כמעט כל אגדת ילדים מסתימות בקלישה שהנסיך והנסיכה חיו באושר ועושר עד עצם היום הזה."},{"u":19,"n":90,"t":"קרדינלי","m":"עיקרי, יסודי, חשוב.","e":"למידה לקראת המבחן מהווה תנאי קרדינלי כדי לעבור אותו."},{"u":19,"n":91,"t":"רווי","m":"גדוש, שופע.","e":"השולחן היה רווי בדברי מאכל לכבוד החג."},{"u":19,"n":92,"t":"רוח קדים","m":"רוח מדברית חמה.","e":"הטיול בנגב בוטל בשל רוח קדים שהתחוללה באזור."},{"u":19,"n":93,"t":"רום","m":"(1) שיא. (2) גובה.","e":"הר האוורסט, הגבוהה ביותר בעולם, הינו ברום של כ- 848,8 מ' מעל פני הים."},{"u":19,"n":94,"t":"ריאלי","m":"מציאותי.","e":"יצחק היה אדם מאוד ריאלי ולכן הוא התחבר מאוד למקצועות כמו פיזיקה ומתמטיקה בעוד שבהיסטוריה ואזרחות הוא התקשה."},{"u":19,"n":95,"t":"שאיה","m":"חורבן, הרס.","e":"בזמן המלחמה הארץ הייתה מוכת שאיה, אזרחים רבים נפגעו וערים שלמות נהרסו."},{"u":19,"n":96,"t":"שבב","m":"רסיס.","e":"למרות שהרופאים אמרו לה כי הפגיעה ברגלה בלתי הפיכה ועל-כן היא תישאר נכה כל חייה, לברכה היה שבב של תקווה שהיא תוכל ללכת."},{"u":19,"n":97,"t":"תגר","m":"סוחר, רוכל.","e":"התגר היה ידוע במחיריו הזולים ועל-כן היו לו לקוחות רבים."},{"u":19,"n":98,"t":"תוחלת","m":"תקווה, ציפייה.","e":"לנאשם הייתה תוחלת כי הממצאים החדשים יוכיחו את חפותו."},{"u":19,"n":99,"t":"תופין","m":"עוגה, אפיפית.","e":"לכבוד חג השבועות אמי אפתה תופין גבינה."},{"u":19,"n":100,"t":"תמימות דעים","m":"הסכמה מוחלטת.","e":"בסוגיה זו חשוב שתהיה תמימות דעים שכן היא הבסיס לכל הפרויקט."},{"u":20,"n":1,"t":"אהבה נכזבת","m":"אהבה חד-צדדית.","e":"סנדי לא נענתה לחיזוריו הרבים של יגל, ולכן מבחינתו היא תמיד תהיה אהבה נכזבת."},{"u":20,"n":2,"t":"אוילות","m":"טיפשות.","e":"\"אוילות היא לחזור על אותה הפעולה וכל פעם לצפות לתוצאה אחרת\" (אלברט איינשטיין)."},{"u":20,"n":3,"t":"אומניפוטנטי","m":"כל יכול.","e":"המאמינים בקיומו של האל מאמינים כי הוא אומניפוטנטי."},{"u":20,"n":4,"t":"אזר חלציו","m":"התחזק.","e":"דוד אזר חלציו לקראת הקרב נגד יריבו."},{"u":20,"n":5,"t":"אטם שפתיו","m":"שתק, לא דיבר.","e":"שחף אטם שפתיו בזמן שאמו הוכיחה אותו על התנהגותו החצופה."},{"u":20,"n":6,"t":"איד","m":"צרה.","e":"חברים אמתיים נמדדים בעת איד ולא בעת שמחה."},{"u":20,"n":7,"t":"אילוח","m":"זיהום.","e":"ליהודה התגלה אילוח בדם ולכן הוא נאלץ לקחת אנטיביוטיקה."},{"u":20,"n":8,"t":"אינדוקציה","m":"תהליך מחשבתי שתפקידו להשליך מהפרט אל הכלל.","e":"אינדוקציה מוגדרת ההפך function load(){try{const s=localStorage.getItem('psy_v1');if(s){const o=JSON.parse(s);if(o&&o.w)return Object.assign(fresh(),o)}}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem('psy_v1',JSON.stringify(S))}catch(e){}}
const st=w=>S.w[ID(w)];
const isProb=w=>{const s=st(w);return !!s&&s.x>=2&&s.x>=s.r};
const isDue=(w,now=Date.now())=>{const s=st(w);return !!s&&s.b>0&&s.d<=now};
function grade(w,ok,retry){
  const id=ID(w);let s=S.w[id];
  if(!s){s=S.w[id]={b:0,d:0,r:0,x:0};if(S.newToday.d!==dkey())S.newToday={d:dkey(),c:0};S.newToday.c++}
  if(ok){s.r++;if(retry){s.d=sod()+DAY;if(s.b<1)s.b=1}else{s.b=Math.min(5,s.b+1);s.d=sod()+INT[s.b]*DAY}}
  else{s.x++;s.b=1;s.d=Date.now()}
  S.days[dkey()]=(S.days[dkey()]||0)+1;
  save();
}
const newLeft=()=>Math.max(0,S.newPerDay-(S.newToday.d===dkey()?S.newToday.c:0));

/* ---------- navigation ---------- */
let V='home',cfg={scope:'all',type:'flash',size:10},sess=null,dq='',dunit='all',dmax=40,openId=null,msg='';
const TABS=[['home','🏠','בית'],['practice','✏️','תרגול'],['dict','📖','מילון'],['stats','📊','התקדמות']];
function go(v){V=v;msg='';render();window.scrollTo(0,0)}
function renderNav(){
  const cur=V==='session'||V==='summary'?'practice':V;
  $('nav').innerHTML=TABS.map(t=>`<button class="${cur===t[0]?'on':''}" data-v="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function render(){renderNav();({home,practice,dict,stats,session,summary})[V]()}

/* ---------- queue ---------- */
function buildQueue(scope,size,noLimit){
  if(scope==='prob')return shuffle(DATA.filter(isProb)).slice(0,size);
  const pool=DATA.filter(w=>scope==='all'||w.u===+scope);
  const now=Date.now();
  const due=pool.filter(w=>isDue(w,now)).sort((a,b)=>st(a).d-st(b).d);
  let q=due.slice(0,size);
  if(q.length<size){
    const left=noLimit?size:newLeft();
    q=q.concat(pool.filter(w=>!st(w)).slice(0,Math.min(left,size-q.length)));
  }
  return q;
}
function startSession(noLimit){
  const q=buildQueue(cfg.scope,cfg.size,noLimit);
  if(!q.length){msg='empty';return render()}
  sess={q:q.map(w=>({w,retry:false})),i:0,ok:0,bad:[],total:q.length,answered:false,shown:false};
  go('session');
}

/* ---------- screens ---------- */
function home(){
  const now=Date.now();
  const due=DATA.filter(w=>isDue(w,now)).length;
  const unseen=DATA.filter(w=>!st(w)).length;
  const learned=DATA.length-unseen;
  const mastered=DATA.filter(w=>{const s=st(w);return s&&s.b>=4}).length;
  const prob=DATA.filter(isProb).length;
  $('app').innerHTML=`<h1>מילים לפסיכומטרי</h1><div class="sub">מתוך «עושר לשוני» · ${DATA.length} מילים ב-20 יחידות</div>
  <div class="grid">
   <div class="stat"><b>${due}</b><span>לחזרה עכשיו</span></div>
   <div class="stat"><b>${Math.min(newLeft(),unseen)}</b><span>חדשות להיום</span></div>
   <div class="stat"><b>${learned}</b><span>נלמדו</span></div>
   <div class="stat"><b>${mastered}</b><span>שולט בהן</span></div>
  </div>
  <button class="btn" id="go">${due||newLeft()?'התחל את חזרת היום':'אין מה לחזור עכשיו'}</button>
  <button class="btn sec" id="more">לימוד חופשי / בחירת יחידה</button>
  ${prob?`<button class="btn sec" id="pb">תרגול מילים בעייתיות (${prob})</button>`:''}
  <h2>הגדרות</h2>
  <label>מילים חדשות ביום</label>
  <div class="seg" id="npd">${[5,10,20,30].map(n=>`<button data-n="${n}" class="${S.newPerDay===n?'on':''}">${n}</button>`).join('')}</div>`;
  $('go').onclick=()=>{cfg.scope='all';cfg.type=cfg.type||'flash';startSession(false)};
  $('more').onclick=()=>go('practice');
  const pb=$('pb');if(pb)pb.onclick=()=>{cfg.scope='prob';startSession(false)};
  $('npd').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.newPerDay=+b.dataset.n;save();render()});
  if(msg==='empty'){msg='';}
}
function practice(){
  const units=Array.from({length:20},(_,i)=>i+1);
  const empty=msg==='empty';
  $('app').innerHTML=`<h1>תרגול</h1><div class="sub">בחר מה ללמוד ואיך</div>
  <label>חומר</label>
  <select id="sc"><option value="all">כל היחידות (חזרות + חדשות)</option>${units.map(u=>`<option value="${u}">יחידה ${u}</option>`).join('')}<option value="prob">מילים בעייתיות</option></select>
  <label>סוג תרגול</label>
  <div class="seg" id="ty">
   <button data-t="flash">כרטיסיות</button><button data-t="mean">חידון פירוש</button><button data-t="term">מילה לפי פירוש</button></div>
  <label>מספר מילים בסבב</label>
  <div class="seg" id="sz">${[10,20,30].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
  <button class="btn" id="st">התחל</button>
  ${empty?`<div class="card" style="margin-top:12px">אין כרגע מילים מתאימות לסבב: אין מילים לחזרה, ומכסת המילים החדשות להיום מלאה (או שאין מילים בעייתיות).<button class="btn sec" id="nl">למד מילים חדשות בכל זאת</button></div>`:''}
  <div class="note">מילה שטעית בה חוזרת בסוף הסבב. מילים שעניתם עליהן נכון מתרחקות: יום, 3 ימים, שבוע, שבועיים, 3 שבועות.</div>`;
  $('sc').value=cfg.scope;
  const mark=()=>{[...$('ty').children].forEach(b=>b.classList.toggle('on',b.dataset.t===cfg.type));[...$('sz').children].forEach(b=>b.classList.toggle('on',+b.dataset.n===cfg.size))};
  mark();
  $('sc').onchange=e=>cfg.scope=e.target.value;
  [...$('ty').children].forEach(b=>b.onclick=()=>{cfg.type=b.dataset.t;mark()});
  [...$('sz').children].forEach(b=>b.onclick=()=>{cfg.size=+b.dataset.n;mark()});
  $('st').onclick=()=>{msg='';startSession(false)};
  const nl=$('nl');if(nl)nl.onclick=()=>{msg='';startSession(true)};
}
function meanHtml(w){
  const parts=w.m.split(/\s*(?=\(\d\))/).filter(Boolean);
  return parts.map(p=>`<div>${esc(p)}</div>`).join('');
}
function distractors(w,field){
  const len=(field==='m'?w.m:w.t).length;
  const pool=shuffle(DATA.filter(x=>x.t!==w.t&&x.m!==w.m&&x[field]!==w[field])).slice(0,30);
  pool.sort((a,b)=>Math.abs(a[field].length-len)-Math.abs(b[field].length-len));
  const out=[];const seen=new Set();
  for(const x of pool){if(!seen.has(x[field])){seen.add(x[field]);out.push(x)}if(out.length===3)break}
  return out;
}
function session(){
  const s=sess;if(!s){return go('practice')}
  if(s.i>=s.q.length)return go('summary');
  const {w,retry}=s.q[s.i];
  const pct=Math.round(s.i/s.q.length*100);
  let body='';
  if(cfg.type==='flash'){
    body=`<div class="card fc" id="fc">${s.shown?`<div class="mean">${meanHtml(w)}</div>${w.e?`<div class="ex">${esc(w.e)}</div>`:''}`:`<div class="term">${esc(w.t)}</div><div class="hint">לחץ כדי לראות פירוש</div>`}</div>
    ${s.shown?`<div class="row"><button class="btn bad" id="no">לא ידעתי</button><button class="btn ok" id="yes">ידעתי</button></div>`:`<button class="btn sec" id="rv">הצג פירוש</button>`}`;
  }else{
    if(!s.opts){const f=cfg.type==='mean'?'m':'t';s.opts=shuffle([w,...distractors(w,f)]);}
    const f=cfg.type==='mean'?'m':'t';
    body=`<div class="card q">${cfg.type==='mean'?`<div class="term">${esc(w.t)}</div>`:`<div class="qm">${meanHtml(w)}</div>`}
    ${s.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o[f])}</button>`).join('')}
    <div id="after"></div></div>`;
  }
  $('app').innerHTML=`<div class="meta"><span>${s.i+1} / ${s.q.length}${retry?' · חזרה על טעות':''}</span><span>נכון: ${s.ok}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>${body}
  <button class="btn sec" id="quit" style="margin-top:18px">סיים סבב</button>`;
  $('quit').onclick=()=>{s.i=s.q.length;go('summary')};
  const finish=ok=>{
    grade(w,ok,retry);
    if(ok)s.ok++;else{if(!s.bad.includes(w))s.bad.push(w);if(!retry)s.q.push({w,retry:true})}
    s.i++;s.shown=false;s.opts=null;session();
  };
  if(cfg.type==='flash'){
    $('fc').onclick=()=>{s.shown=!s.shown;session()};
    if(!s.shown){$('rv').onclick=()=>{s.shown=true;session()}}
    else{$('yes').onclick=()=>finish(true);$('no').onclick=()=>finish(false)}
  }else{
    const f=cfg.type==='mean'?'m':'t';let done=false;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;done=true;
      const o=s.opts[+b.dataset.k];const ok=o===w;
      b.classList.add(ok?'ok':'bad');
      if(!ok)document.querySelectorAll('.opt')[s.opts.indexOf(w)].classList.add('ok');
      $('after').innerHTML=`${cfg.type==='term'?`<div class="ex"><b>${esc(w.t)}</b></div>`:''}${w.e?`<div class="ex">${esc(w.e)}</div>`:''}<button class="btn" id="nx">${s.i+1<s.q.length||!ok?'הבא':'סיום'}</button>`;
      $('nx').onclick=()=>finish(ok);
    });
  }
}
function summary(){
  const s=sess;if(!s)return go('home');
  const answered=s.ok+s.bad.length;
  $('app').innerHTML=`<div class="card sum"><h1 style="text-align:center">סיימת סבב</h1><b class="big">${s.ok}</b><div style="text-align:center;color:var(--mute)">תשובות נכונות${s.bad.length?` · ${s.bad.length} מילים לחזרה`:''}</div></div>
  ${s.bad.length?`<h2>מילים שטעית בהן</h2>${s.bad.map(w=>`<div class="item"><b>${esc(w.t)}</b><div class="d">${meanHtml(w)}</div></div>`).join('')}`:''}
  <button class="btn" id="again">סבב נוסף</button><button class="btn sec" id="hm">לבית</button>`;
  $('again').onclick=()=>startSession(false);
  $('hm').onclick=()=>go('home');
}
const norm=s=>s.replace(/[֑-ׇ"'׳״.,;:!?()\-–]/g,'').toLowerCase();
function dots(w){const s=st(w);const b=s?s.b:0;return '●'.repeat(b)+'○'.repeat(5-b)}
function dict(){
  const units=Array.from({length:20},(_,i)=>i+1);
  $('app').innerHTML=`<h1>מילון</h1><div class="sub">חיפוש לפי מילה או לפי חלק מהפירוש</div>
  <input type="search" id="q" placeholder="חיפוש…" value="${esc(dq)}">
  <label>יחידה</label><select id="du"><option value="all">כל היחידות</option>${units.map(u=>`<option value="${u}">יחידה ${u}</option>`).join('')}</select>
  <div id="list"></div>`;
  $('du').value=dunit;
  const draw=()=>{
    const q=norm(dq.trim());
    let r=DATA.filter(w=>(dunit==='all'||w.u===+dunit)&&(!q||norm(w.t).includes(q)||norm(w.m).includes(q)));
    const total=r.length;r=r.slice(0,dmax);
    $('list').innerHTML=`<div class="note">${total} תוצאות</div>`+r.map(w=>{const id=ID(w);return `<div class="item"><div class="h" data-id="${id}"><b>${esc(w.t)}${isProb(w)?'<span class="chip w">בעייתית</span>':''}</b><span class="tag">יח' ${w.u} · ${w.n} <span class="dots">${dots(w)}</span></span></div>${openId===id?`<div class="d">${meanHtml(w)}${w.e?`<div class="ex">${esc(w.e)}</div>`:''}</div>`:''}</div>`}).join('')+(total>dmax?`<button class="btn sec" id="mr">הצג עוד</button>`:'');
    $('list').querySelectorAll('.h').forEach(h=>h.onclick=()=>{openId=openId===h.dataset.id?null:h.dataset.id;draw()});
    const mr=$('mr');if(mr)mr.onclick=()=>{dmax+=40;draw()};
  };
  let t;$('q').oninput=e=>{dq=e.target.value;dmax=40;clearTimeout(t);t=setTimeout(draw,150)};
  $('du').onchange=e=>{dunit=e.target.value;dmax=40;draw()};
  draw();
}
function streak(){let n=0;let t=sod();if(!S.days[dkey(t)])t-=DAY;while(S.days[dkey(t)]){n++;t-=DAY}return n}
function stats(){
  let learned=0,mastered=0,right=0,wrong=0;const per=Array.from({length:20},()=>({n:0,l:0,m:0}));
  for(const w of DATA){const p=per[w.u-1];p.n++;const s=st(w);if(s){learned++;p.l++;right+=s.r;wrong+=s.x;if(s.b>=4){mastered++;p.m++}}}
  const prob=DATA.filter(isProb);
  const acc=right+wrong?Math.round(right/(right+wrong)*100):0;
  const wk=[];for(let i=6;i>=0;i--){const t=sod()-i*DAY;wk.push([['א','ב','ג','ד','ה','ו','ש'][new Date(t).getDay()],S.days[dkey(t)]||0])}
  const mx=Math.max(1,...wk.map(x=>x[1]));
  $('app').innerHTML=`<h1>התקדמות</h1><div class="sub">&nbsp;</div>
  <div class="grid">
   <div class="stat"><b>${learned}</b><span>נלמדו מתוך ${DATA.length}</span></div>
   <div class="stat"><b>${mastered}</b><span>שולט בהן (קופסה 4+)</span></div>
   <div class="stat"><b>${acc}%</b><span>דיוק כולל</span></div>
   <div class="stat"><b>${streak()}</b><span>ימים ברצף</span></div>
  </div>
  <h2>תשובות ב-7 הימים האחרונים</h2>
  <div class="card"><div class="wk">${wk.map(x=>`<div><i style="height:${Math.round(x[1]/mx*60)}px"></i>${x[0]}<br>${x[1]}</div>`).join('')}</div></div>
  <h2>לפי יחידה</h2>
  ${per.map((p,i)=>`<div class="ub" data-u="${i+1}"><span>יחידה ${i+1}</span><div class="t"><i class="m" style="width:${p.m}%"></i><i style="width:${p.l-p.m}%"></i></div><span>${p.l}</span></div>`).join('')}
  <div class="note">ירוק: שולט · כחול: בלמידה. לחיצה על יחידה פותחת תרגול שלה.</div>
  <h2>מילים בעייתיות (${prob.length})</h2>
  ${prob.length?prob.slice(0,15).map(w=>`<div class="item"><b>${esc(w.t)}</b><span class="tag"> · ${st(w).x} טעויות</span><div class="d">${meanHtml(w)}</div></div>`).join('')+(prob.length>15?`<div class="note">מוצגות 15 הראשונות.</div>`:''):'<div class="note">אין עדיין. מילה נחשבת בעייתית אחרי 2 טעויות לפחות כשהטעויות מרובות מההצלחות.</div>'}
  <h2>גיבוי ושחזור</h2>
  <div class="note">ההתקדמות נשמרת בדפדפן הזה בלבד. כדי לא לאבד אותה, העתק את הקוד ושמור אותו (למשל בהודעה לעצמך).</div>
  <textarea id="bk" readonly></textarea>
  <button class="btn sec" id="cp">העתק גיבוי</button>
  <label>שחזור: הדבק כאן קוד גיבוי</label>
  <textarea id="rs"></textarea>
  <button class="btn sec" id="rb">שחזר</button><div class="note" id="bm"></div>`;
  $('bk').value=JSON.stringify(S);
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('bk').value);$('bm').textContent='הועתק.'}catch(e){$('bk').select();$('bm').textContent='ההעתקה האוטומטית נחסמה: הטקסט סומן, העתק ידנית.'}};
  $('rb').onclick=()=>{try{const o=JSON.parse($('rs').value);if(!o||typeof o.w!=='object')throw 0;S=Object.assign(fresh(),o);save();$('bm').textContent='שוחזר בהצלחה.';setTimeout(render,600)}catch(e){$('bm').textContent='הקוד לא תקין.'}};
  document.querySelectorAll('.ub').forEach(r=>r.onclick=()=>{cfg.scope=r.dataset.u;go('practice')});
}
render();
</script>
